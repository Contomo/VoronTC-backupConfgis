



        

[gcode_macro TEST_TC_UPDATE_OFFSETS_FROM_SVF]
description: "T0 xyz <- probe_position; T0 probe <- offsets_t0.probe; T>0 xyz+probe <- offsets_tN. Scenarios: DRIFT/BIAS/SCALE/OUTLIER/NOISE/RESET."
variable_default_round: 4
variable_default_ampl: 0.6
variable_default_noise: 0.04
variable_default_probe_noise: 0.01
variable_default_probe_bias: 0.0
gcode:
    {% set tc   = printer.toolchanger %}
    {% set svf  = printer.save_variables.variables %}
    {% set r    = params.ROUND|d(default_round)|int %}
    {% set ampl = params.AMPL|d(default_ampl)|float %}
    {% set nxyz = params.NOISE|d(default_noise)|float %}
    {% set npr  = params.PNOISE|d(default_probe_noise)|float %}
    {% set pbias= params.PBIAS|d(default_probe_bias)|float %}
    {% set scen = params.SCENARIO|d('DRIFT')|lower %}
    {% set with_probe = params.PROBE|d(1)|int %}

    {% set tlist = [] %}
    {% set start_t = params.START|d(tc.tool_numbers|first)|int %}
    {% set end_t   = params.END|d(tc.tool_numbers|last)|int %}
    {% for t in tc.tool_numbers|sort %}
        {% if t >= start_t and t <= end_t %}
            {% set _ = tlist.append(t) %}
        {% endif %}
    {% endfor %}
    {% set den = (tlist|length - 1) if (tlist|length > 1) else 1 %}

    {% macro ensure_xyz(d) %}{% set _ = d.update({'x': d.get('x',0.0)|float,'y': d.get('y',0.0)|float,'z': d.get('z',0.0)|float}) %}{% endmacro %}
    {% macro ensure_probe(d) %}{% set _ = d.update({'probe': d.get('probe',0.0)|float}) %}{% endmacro %}

    {% set t0_xyz = {} %}
    {% set _ = t0_xyz.update(svf.get('probe_position', {})) %}
    { ensure_xyz(t0_xyz) }
    {% set t0_probe_base = svf.get('offsets_t0', {}).get('probe', 0.0)|float %}

    {% for idx in range(tlist|length) %}
        {% set tn = tlist[idx] %}
        {% set base = {} %}
        {% if tn == 0 %}
            {% set _ = base.update(t0_xyz) %}
            {% set _ = base.update({'probe': t0_probe_base}) %}
        {% else %}
            {% set key = tc.tool_names[tn]|lower|replace('tool ', 'offsets_') %}
            {% set _ = base.update(svf.get(key, {})) %}
            { ensure_xyz(base) }
            { ensure_probe(base) }
        {% endif %}

        {% set f = idx / den %}
        {% set dx = 0.0 %}{% set dy = 0.0 %}{% set dz = 0.0 %}
        {% if scen == 'drift' %}
            {% set dx = (-ampl) + 2*ampl*f %}
            {% set dy = (-ampl/2.0) + ampl*f %}
            {% set dz = (ampl/3.0) - 2*ampl*f/3.0 %}
        {% elif scen == 'bias' %}
            {% set dx = ampl %}{% set dy = -ampl/2.0 %}{% set dz = ampl/4.0 %}
        {% elif scen == 'scale' %}
            {% set sx = 1.0 + ampl %}{% set sy = 1.0 + ampl/2.0 %}{% set sz = 1.0 - ampl/3.0 %}
            {% set dx = (base.x*sx) - base.x %}
            {% set dy = (base.y*sy) - base.y %}
            {% set dz = (base.z*sz) - base.z %}
        {% elif scen == 'outlier' %}
            {% if idx == den %}{% set dx = 3.0*ampl %}{% set dy = -2.5*ampl %}{% set dz = 1.8*ampl %}{% endif %}
        {% endif %}

        {% set n1 = [-nxyz,-nxyz/2,0.0,nxyz/2,nxyz]|random %}
        {% set n2 = [-nxyz,-nxyz/2,0.0,nxyz/2,nxyz]|random %}
        {% set n3 = [-nxyz,-nxyz/2,0.0,nxyz/2,nxyz]|random %}

        {% set x = (base.x + dx + n1)|round(r) %}
        {% set y = (base.y + dy + n2)|round(r) %}
        {% set z = (base.z + dz + n3)|round(r) %}

        {% set probe_base = base.probe|float %}
        {% if with_probe %}
            {% set pn = [-npr,-npr/2,0.0,npr/2,npr]|random %}
            {% set pdrift = (ampl/5.0)*(2*f - 1) if scen == 'drift' else 0.0 %}
            {% set probe = (probe_base + pbias + pdrift + pn)|round(r) %}
        {% else %}
            {% set probe = probe_base|round(r) %}
        {% endif %}

        _TC_UPDATE_OFFSETS2 T={tn} OVERWRITE={x},{y},{z},{probe}
    {% endfor %}

    _TC_UPDATE_OFFSETS2 SHOW_LAST=1














