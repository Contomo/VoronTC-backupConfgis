[gcode_macro RELOAD_KLIPPER_MODULE]
description: "Reload a Klipper python module by object name"
gcode:
    {% set SELF       = 'RELOAD_KLIPPER_MODULE' %}

    {% set module_name = params.MODULE|d('', true) %}

    {% set gbl        = printer.printer.__class__.__init__.__globals__ %}
    {% set sys        = gbl.sys %}
    {% set importlib  = gbl.importlib %}

    #--------------------------------------------------------------------------------------------------------
    {% macro reload_module(obj_name) %}
        {% set obj  = printer.printer.lookup_object(obj_name, None) %}
        {% if not obj %}
            { err(obj_name ~ ' object not found') }
        {% else %}
            {% set mod_name = obj.__class__.__module__ or '' %}
            {% if not mod_name %}
                { err('no __module__ for object ' ~ obj_name) }
            {% else %}
                {% set mod = sys.modules.get(mod_name) %}
                {% if not mod %}
                    { err('module ' ~ mod_name ~ ' not in sys.modules') }
                {% else %}
                    {% set _          = importlib.reload(mod) %}
                    {% set class_name = obj.__class__.__name__ %}
                    {% set new_cls    = mod.__dict__.get(class_name, None) %}
                    {% if new_cls %}
                        {% set _ = obj.__setattr__('__class__', new_cls) %}
                        { msg('reloaded ' ~ mod_name ~ ' and patched ' ~ obj_name ~ ' -> ' ~ class_name) }
                    {% else %}
                        { err('reloaded ' ~ mod_name ~ ' but no ' ~ class_name ~ ' class found') }
                    {% endif %}
                {% endif %}
            {% endif %}
        {% endif %}
    {% endmacro %}

    #--------------------------------------------------------------------------------------------------------
    {% macro msg(s, prefix_color="--v-accent-base, orange", msg_color="--p-text-color2, grey") %}
        {% set desc = printer.configfile.settings['gcode_macro ' ~ SELF|lower].description|trim|trim('"')|trim("'") %}
        {% set pre  = "<span style=\"color: var(" ~ prefix_color ~ "); font-weight:bold;\" title=\"" ~ desc ~ "\">" ~ SELF ~ " </span>" %}
        { action_respond_info(pre ~ "<span style=\"color: var(" ~ msg_color ~ ");\" title=\"" ~ desc ~ "\">" ~ s ~ "</span>") }
    {% endmacro %}
    {% macro err(s) %}{ msg(s, prefix_color="--v-error-base, red", msg_color="--v-warning-base, orange") }{% endmacro %}

    #--------------------------------------------------------------------------------------------------------
    {% if not module_name %}
        { err('MODULE parameter is required, e.g. MODULE=save_variables') }
    {% else %}
        { reload_module(module_name) }
    {% endif %}

    
    # ╭────────────────── helpers ──────────────────╮
    # ╰──────────────────────────────────────────────╯
# ↻

    
