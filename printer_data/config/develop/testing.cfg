# extruder_colour = #8000FF;#64FDF5;#000000;#FFFFFF;#FFFFFF;#00C1AE;#00FF7F;#F26722



# Filament unload — non-blocking, concurrent, polished.
# Flow: preheat to (min_extrude_temp + 5 °C) → do a gentle 5 mm “nibble” → keep heating toward final (default 210 °C)
#       while retracting in steps until 100 mm total. No TEMPERATURE_WAIT/M109.
# Concurrency: one independent task per extruder; the delayed tick iterates all active tasks each cycle.

[gcode_macro FILAMENT_UNLOAD]
description: Plug-pull unload: preheat(min+5 °C) → nibble 5 mm → pull to 100 mm while heating to 210 °C (non-blocking)
variable_settings: {
        'nibble_total_mm':  5.0,     # total gentle pre-pull (executed first inside pull phase)
        'nibble_step_mm':   1.0,     # mm per tick for nibble
        'pull_step_mm':     5.0,     # mm per tick for main pull
        'total_pull_mm':    100.0,   # total retract (includes nibble)
        'preheat_margin':   5.0,     # °C above min_extrude_temp for preheat threshold
        'final_target':     210.0,   # °C while doing main pull
        'pull_feed_mm_m':   300.0,   # mm/min for all E pulls
        'tick_seconds':     1.0      # scheduler period
    }
variable_tasks: {} # {'extruderX': {'active':True,'phase':'preheat|pull|done','nibbled':0.0,'pulled':0.0,'preheat':..,'final':..,'T':..}}
gcode:
    {% set SELF   = 'FILAMENT_UNLOAD' %}
    {% set cfg    = printer.configfile.settings %}
    {% set S      = settings %}
    {% set tasks  = tasks %}

    # messages (house style)
    {% macro msg(s, prefix_color="--v-accent-base", msg_color="--p-text-color2") %}
        {% set desc = cfg['gcode_macro ' ~ SELF|lower].description %}
        {% set pre  = "<span style=\"color: var(" ~ prefix_color ~ "); font-weight:bold;\" title=\"" ~ desc ~ "\">" ~ SELF ~ " </span>" %}
        { action_respond_info(pre ~ "<span style=\"color: var(" ~ msg_color ~ ");\" title=\"" ~ desc ~ "\">" ~ s ~ "</span>") }
    {% endmacro %}
    {% macro err(s) %}{ msg(s, prefix_color="--v-error-base", msg_color="--v-warning-base") }{% endmacro %}

    # helpers
    {% macro ext_name(tn) %}{ 'extruder' if tn <= 0 else 'extruder' ~ tn }{% endmacro %}
    {% macro heat(ext, temp) %}SET_HEATER_TEMPERATURE HEATER={ ext } TARGET={ temp|int }{% endmacro %}
    {% macro e_pulse(ext, delta_e, feed) %}
        {% set prev_ext = printer.toolhead.extruder|d(None) %}
        SAVE_GCODE_STATE NAME={ '_FU_E_' ~ ext }
        { 'ACTIVATE_EXTRUDER EXTRUDER=' ~ ext if not prev_ext or prev_ext != ext else '' }
        M83
        G1 E{ delta_e } F{ feed }
        RESTORE_GCODE_STATE NAME={ '_FU_E_' ~ ext } MOVE=0
        {'ACTIVATE_EXTRUDER EXTRUDER=' ~ prev_ext if prev_ext and prev_ext != ext else '' }
        {'M8' ~ ('2' if printer.gcode_move.absolute_extrude else '3')}
    {% endmacro %}

    # resolve extruder
    {% set tn  = params.get('T', (printer.toolchanger.tool_number if 'toolchanger' in printer else 0))|int %}
    {% set ext = ext_name(tn) %}
    {% if ext not in printer %}
        { msg("Unknown extruder: " ~ ext ~ ". Ignoring.") }
    {% else %}
        {% set ex      = printer[ext] %}
        {% set ex_cfg  = cfg.get(ext, {}) %}
        {% set minx    = ex_cfg.get('min_extrude_temp', 170)|float %}
        {% set now     = ex.temperature|float %}
        {% set stop    = params.get('STOP', 0)|int %}
        {% set final   = params.get('TEMP', S.final_target)|float %}
        {% set t       = tasks.get(ext, {}) %}

        # stop (soft)
        {% if stop %}
            {% if t and t.get('active') %}
                {% set _ = t.update({'active': False, 'phase': 'stopped'}) %}
                { msg("Stopped unload on " ~ ext ~ " at " ~ now|round(1) ~ "°C; pulled=" ~ (t.get('pulled',0.0)|round(1)) ~ " mm") }
            {% else %}
                { msg("No active unload for " ~ ext ~ ".") }
            {% endif %}
        {% else %}
            # init task
            {% if not t %}
                {% set warm_threshold = (minx + S.preheat_margin)|float %}
                {% set _ = tasks.update({ ext: {
                    'T': tn, 'extruder': ext,
                    'active': True, 'phase': 'preheat',
                    'preheat': warm_threshold, 'final': final,
                    'nibbled': 0.0, 'pulled': 0.0
                } }) %}
                {% set t = tasks[ext] %}
                { msg("Begin unload on " ~ ext ~ ": preheat→" ~ t.preheat|round(1) ~ "°C, nibble 5 mm, then pull to " ~ S.total_pull_mm|round(0) ~ " mm @ " ~ t.final|round(0) ~ "°C.") }
            {% endif %}

            {% if t.get('active') %}
                {% if t.phase == 'preheat' %}
                    {% set warm_target = [t.preheat, ex.target]|max %}
                    { heat(ext, warm_target) }
                    {% if now >= t.preheat %}
                        {% set _ = t.update({'phase': 'pull'}) %}
                        { msg(ext ~ " reached " ~ now|round(1) ~ "°C → starting pull sequence.") }
                    {% else %}
                        { msg(ext ~ " heating " ~ now|round(1) ~ "→" ~ t.preheat|round(0) ~ "°C…") }
                    {% endif %}

                {% elif t.phase == 'pull' %}
                    { heat(ext, t.final) }
                    {% set need_total = (S.total_pull_mm|float - t.pulled|float) %}
                    {% if need_total > 0.001 %}
                        {% set need_nibble = (S.nibble_total_mm|float - t.nibbled|float) %}
                        {% if need_nibble > 0.001 %}
                            {% set step = [S.nibble_step_mm|float, need_nibble]|min %}
                            { e_pulse(ext, -step, S.pull_feed_mm_m) }
                            {% set _ = t.update({
                                'nibbled': (t.nibbled|float + step),
                                'pulled':  (t.pulled|float  + step)
                            }) %}
                            { msg(ext ~ " nibble " ~ t.nibbled|round(1) ~ " / " ~ S.nibble_total_mm|round(0) ~ " mm while ramping to " ~ t.final|round(0) ~ "°C") }
                        {% else %}
                            {% set step = [S.pull_step_mm|float, need_total]|min %}
                            { e_pulse(ext, -step, S.pull_feed_mm_m) }
                            {% set _ = t.update({ 'pulled': (t.pulled|float + step) }) %}
                            { msg(ext ~ " pulled " ~ t.pulled|round(1) ~ " / " ~ S.total_pull_mm|round(0) ~ " mm @ " ~ now|round(1) ~ "°C") }
                        {% endif %}
                    {% else %}
                        {% set _ = t.update({'active': False, 'phase': 'done'}) %}
                        { msg("Unload complete on " ~ ext ~ ". Total " ~ t.pulled|round(0) ~ " mm.") }
                    {% endif %}
                {% endif %}
            {% endif %}
        {% endif %}
    {% endif %}

    # persist & schedule tick
    SET_GCODE_VARIABLE MACRO={SELF} VARIABLE=tasks VALUE={ tasks }
    {% set active_list = tasks.values()|selectattr('active')|list %}
    UPDATE_DELAYED_GCODE ID=_UNLOAD_TICK DURATION=0
    UPDATE_DELAYED_GCODE ID=_UNLOAD_TICK DURATION={ S.tick_seconds if active_list|length else 0 }


[delayed_gcode _UNLOAD_TICK]
gcode:
    {% set m  = printer['gcode_macro FILAMENT_UNLOAD'] %}
    {% set st = m.tasks|d({}) %}
    {% for t in st.values() if t.get('active') %}
        FILAMENT_UNLOAD T={ t.T }
    {% endfor %}
    {% set active_list = st.values()|selectattr('active')|list %}
    UPDATE_DELAYED_GCODE ID=_UNLOAD_TICK DURATION={ m.settings.tick_seconds if active_list|length else 0 }


[gcode_macro SET_PID]
gcode:
    {% set scale = 255.0 %}
    {% set name = params.get('HEATER', '') %}
    {% set heater_obj = printer.printer.lookup_object(name, None) %}
    {% set objs = [] %}
    {% for pre in ['heater_', 'heater_generic_', 'heater ', 'heater_generic '] if not heater_obj %}
        {% set _heater = printer.printer.lookup_object(pre ~ name, None) %}
        {% set _ = objs.append(_heater) if _heater %}
    {% endfor %}
    {% set heater_obj = objs|first if not heater_obj else heater_obj %}
    {% if heater_obj %}
        {% set ctrl = heater_obj.heater.control %}
        {% set _ = action_raise_error('SET_PID: ' ~ heater_obj.name ~ ' is not PID-controlled') 
                                      if not ctrl or ctrl.__class__.__name__ != 'ControlPID' %}
        {% set gains = [['P','Kp'], ['I','Ki'], ['D','Kd']] %}
        {% for req, attr in gains if req in params or attr in params %}
            {% set raw = params.get(req, params.get(attr))|float %}
            {% set scaled = raw / scale %}
            {% set _ = ctrl.__setattr__(attr, scaled) %}
            {% set _ = ctrl.profile.update({'pid_' ~ attr|lower: raw}) %}
            {% set _ = action_respond_info(attr ~ ' = raw:' ~ raw ~ ' scaled:' ~ scaled) %}
        {% else %}
            { action_respond_info('pelase supply any of: "' ~ gains|sum(start=[])|join(', ') ~ '"') }
        {% endfor %}
    {% endif %}
    {% if 'SHOWME' in params %}
        { action_respond_info(ctrl.__dict__.items()|string) }
    {% endif %}


[gcode_macro TTC_CONTEXT]
gcode:
    {% set trunc = 3200 %}
    {% set sp = printer.printer.__class__.__init__.__globals__.importlib.import_module('subprocess') %}
    {% set cmds = [
        'python3 /home/klippy/printer_data/misc/ttc_context.py',
        'python3 /home/klippy/printer_data/misc/ttc_analyzer.py'
    ] %}

    {% set results = [] %}
    {% for c in cmds %}
        {% set cp = sp.run(['bash','-lc', c], capture_output=True, text=True) %}
        {% set out = cp.stdout or '' %}
        {% set err = cp.stderr or '' %}
        {% if out|length > trunc %}
            {% set out = out[:trunc] ~ '\n…(truncated)' %}
        {% endif %}
        {% if err|length > trunc %}
            {% set err = err[:trunc] ~ '\n…(truncated)' %}
        {% endif %}
        {% set _ = results.append({'cmd': c, 'rc': cp.returncode, 'out': out, 'err': err}) %}
    {% endfor %}

    {%- macro esc(s) -%}
        {%- set re = printer.printer.__class__.__init__.__globals__.importlib.import_module('re') -%}
        {%- set hash = '\u0023' -%}
        {%- set ampfix = '&' ~ 'amp;' ~ hash -%}
        {%- set numfix = '&' ~ hash -%}
        {%- set safe = re.sub('&(?!amp;|' ~ hash ~ ')', '&amp;', s) -%}
        { safe
            .replace(ampfix, numfix)
            .replace('<','&lt;')
            .replace('>','&gt;')
        }
    {%- endmacro -%}

    {%- macro section(r) -%}
        {%- set block -%}
        <details open style="margin:.5em 0;padding:.4em .6em;border:1px solid rgba(68,68,68,1);border-radius:.5em;background:rgba(17,17,17,1)">
            <summary style="cursor:pointer;outline:none">
                <b>{ esc(r.cmd) }</b> <span style="opacity:.7">(rc={ r.rc })</span>
            </summary>
            <pre style="white-space:pre-wrap;margin:.5em 0 0 0">{ esc(r.out) }</pre>
            {%- if r.err -%}
                <div style="margin-top:.5em"><b>stderr</b>
                <pre style="white-space:pre-wrap;margin:.25em 0 0 0">{ esc(r.err) }</pre></div>
            {% endif %}
        </details>
        {%- endset -%}
        { block }
    {%- endmacro -%}

    {% set body = [] %}
    {% for r in results %}
        {% set _ = body.append(section(r)) %}
    {% endfor %}

    {%- set page -%}
    <div class="ttc-report" style="font-family:ui-monospace,Menlo,monospace;line-height:1.25">
        <h3 style="margin:0 0 .5em 0">Timer Too Close — Context and Analysis</h3>
        <div style="opacity:.7;margin-bottom:.75em">TRUNC={ trunc }</div>
        { body|join('') }
    </div>
    {%- endset -%}

    {% set clean = page
        |replace('\n\n','\n')
        |replace('>\n<','><')
    %}
    {action_respond_info(clean)}








[gcode_macro _CUSTOM_PROMPTS]
gcode:
    {% set MAX_TIME_DELTA_AUTOOPEN = 2500 %}

    {% set import = printer.printer.__class__.__init__.__globals__.importlib.import_module %}
    {% set time   = import('time') %}
    {% set b64    = import('base64') %}
    {% set json   = import('json') %}
    {% set now    = (time.time()*1000)|int %}

    {%- macro _msg_format(prefix='', message='', prefix_color="--v-accent-base", msg_color="--p-text-color2") -%}
        {%- set pre = "<span style=\"color: var(" ~ prefix_color ~ "); font-weight:bold;\">" ~ prefix ~ " </span>" -%}
        { pre ~ "<span style=\"color: var(" ~ msg_color ~ ");\">" ~ message ~ "</span>" }
    {%- endmacro -%}

    {%- macro _str_to_b64(str='') -%} { b64.b64encode(str.encode()).decode() } {%- endmacro -%}

    {% macro _GRIPS_CSS(edge_pad=5, edge_width=10, corner_pad=6, corner_size=18) %}
        {% set edges = {
            't':  {'pos':'top','dim':'height','val':edge_pad*2,'cursor':'n-resize'},
            'b':  {'pos':'bottom','dim':'height','val':edge_pad*2,'cursor':'s-resize'},
            'l':  {'pos':'left','dim':'width','val':edge_width,'cursor':'w-resize'},
            'r':  {'pos':'right','dim':'width','val':edge_width,'cursor':'e-resize'}
        } %}
        {'.psd-grip {position: absolute; z-index: 5; background: transparent;}' }
        {% for key, cfg in edges.items() %}
            { '.psd-grip-' ~ key ~ ' {' ~
                cfg.pos ~ ': -' ~ edge_pad ~ 'px;' ~
                cfg.dim ~ ': ' ~ cfg.val ~ 'px;' ~
                'cursor: ' ~ cfg.cursor ~ ';}' }
        {% endfor %}
        {% for c in ['tl','tr','bl','br'] %}
            { '.psd-grip-' ~ c ~ ' {' ~
                ('top' if 't' in c else 'bottom') ~ ': -' ~ corner_pad ~ 'px;' ~
                ('left' if 'l' in c else 'right') ~ ': -' ~ corner_pad ~ 'px;' ~
                'width: ' ~ corner_size ~ 'px;' ~
                'height: ' ~ corner_size ~ 'px;' ~
                'cursor: ' ~ ('nwse' if c in ['tl','br'] else 'nesw') ~ '-resize;' ~
                'z-index: 6;}' }
        {% endfor %}
    {% endmacro %}

    {% macro create_html_prompt_b64() %}
        {% set _html_b64 = kwargs.pop('content', '') %}
        {% set html  = b64.b64decode(_html_b64).decode() %}
        { create_html_prompt(*varargs, content=html, **kwargs) }
    {% endmacro %}

    {% macro create_html_prompt(header='Prompt', content='', message='open prompt', width=400, minw=300, minh=170) %}
        {% set header_sanitized = header|lower|replace(' ', '-') %}
        {% set U_ID    = now ~ '-' ~ header_sanitized %}
        {% set LINK_ID = U_ID ~ '-link' %}
        {% set STYLE_ID = U_ID ~ '-style' %}

        {% set cfg = {
            'ts': now,
            'title': header,
            'wantW': width,
            'minW': minw,
            'minH': minh,
            'bg': 'var(--p-background-darker)',
            'html_b64': _str_to_b64(content),
            'u_id': U_ID,
            'link_id': LINK_ID,
            'style_id': STYLE_ID,
            'openDelay': MAX_TIME_DELTA_AUTOOPEN
        } %}

        {% set js_src %}{% raw %}
            (function () {
                var C = (function(){ try { var c = window.__psd_cfg; delete window.__psd_cfg; return c || {}; } catch(e){ return {}; } })();
                if (!C || typeof C !== 'object') return;

                function spawnDialog(cfg) {
                    if (document.getElementById(cfg.u_id)) {
                        var existingDlg = document.getElementById(cfg.u_id).querySelector('.psd-dlg');
                        if (existingDlg) {
