
[mcu et1]
canbus_uuid: 9422cd1b01cb


[extruder1]
nozzle_diameter: 0.200

[tool T1]
params_accelerometer: 'adxl345 T1'
params_tool_info.extruder_type: 'direct'
params_tool_info.extruder_name: 'hgx lite'
params_tool_info.hotend: 'tz'
params_tool_info.nozzle_material: 'copper steel'
params_tool_info: {
        'extruder_type': 'direct',
        'extruder_name': 'hgx lite',
        'hotend': 'tz',
        'nozzle_material': 'copper steel',
    }

[temperature_sensor T1_mcu]
sensor_type: temperature_mcu
sensor_mcu: et1


[gcode_macro T1]
variable_active: 0
variable_color: ""
variable_tool_number: 1
gcode:
    SELECT_TOOL T={tool_number} {rawparams}

[tool T1]
detection_pin: ^!et1:PB6
tool_number: 1
extruder: extruder1
fan: T1_partfan

[probe_multiplexer T1]
pin: ^et1:PB6
probe_number: 1
z_offset: 0
speed: 15
lift_speed: 75.0
samples: 4
samples_result: median
sample_retract_dist: 1.5
samples_tolerance: 0.025
samples_tolerance_retries: 8
activate_gcode:
    _TAP_PROBE_ACTIVATE
deactivate_gcode:
    _TAP_PROBE_DEACTIVATE

bad_probe_retries: 6
drop_first_result: True
bad_probe_strategy: circle
nozzle_scrubber_gcode: CLEAN_NOZZLE
scrubbing_frequency: 2



[extruder1]
step_pin: et1: PD0
dir_pin: et1: PD1
enable_pin: !et1: PD2
microsteps: 32
full_steps_per_rotation: 200
rotation_distance: 5.6
max_extrude_only_distance: 1400.0
max_extrude_only_velocity: 75.0
max_extrude_only_accel: 1500
filament_diameter: 1.750
heater_pin: et1: PB13
sensor_type: Generic 3950 # ATC Semitec 104NT-4-R025H42G
sensor_pin: et1: PA3

min_temp: 0
max_temp: 300

max_extrude_cross_section: 0.64

[tmc2209 extruder1]
uart_pin: et1: PA15
sense_resistor: 0.11 # default for klipper, kalico requires it.
run_current: 0.575
stealthchop_threshold: 999999


[fan_generic T1_partfan]
pin: et1:PA1

[heater_fan T1_hotend_fan]
pin: et1:PA0
heater: extruder1
heater_temp: 65.0


[adxl345 T1]
cs_pin: et1: PB12
spi_software_sclk_pin: et1: PB10
spi_software_mosi_pin: et1: PB11
spi_software_miso_pin: et1: PB2
axes_map: x,z,-y

[neopixel T1_leds]
pin: et1:PD3
chain_count: 10
color_order: GRB, GRB, GRB, GRB, GRB, GRB, GRB, GRB, GRBW, GRBW
initial_RED: 0.0
initial_GREEN: 0.0
initial_BLUE: 0.0
initial_WHITE: 0.0

[gcode_macro _T1_vars]
variable_logo_led_name:         "T1_leds"
variable_logo_idx:              "1,2,3,4,5,6,7,8"
variable_logo_brightness:       "0.7,0.7,0.7,0.7,0.7,0.7,0.7,0.7"
variable_nozzle_led_name:       "T1_leds"
variable_nozzle_idx:            "9,10"
variable_nozzle_brightness:     "1,1" # add it or leave it, defaults to 1.0 anyways.
gcode:



[extruder1]
control: mpc
heater_power: 40 
cooling_fan: fan_generic T1_partfan
filament_density: 1.07
filament_heat_capacity: 1.7
block_heat_capacity: 19.4012
sensor_responsiveness: 0.0936116
ambient_transfer: 0.115166
ambient_temp_sensor: heater_chamber_fan chamber