#───< MCU and temp sensor display ---------------------------------------------------------
[mcu et0]
canbus_uuid: dcd1e130e4ae


[temperature_sensor T0_mcu]
sensor_type: temperature_mcu
sensor_mcu: et0

#───< Toolchange macro ---------------------------------------------------------
[gcode_macro T0]
variable_active: 0
variable_color: ""
variable_tool_number: 0
gcode:
    SELECT_TOOL T={tool_number} {rawparams}

#───< tool object ---------------------------------------------------------
[tool T0]
detection_pin: ^!et0:PB6
tool_number:          0
extruder:             extruder
fan:                  T0_partfan
params_accelerometer: 'adxl345 T0'
params_tool_info: {
        'extruder_type': 'direct',
        'extruder_name': 'hgx lite',
        'hotend': 'rapido hf',
        'nozzle_material': 'copper steel',
    }


#───< TAP Probe ---------------------------------------------------------
[probe_multiplexer T0]
pin: ^et0:PB6
probe_number: 0
z_offset: -1.4
speed: 10
lift_speed: 75.0
samples: 3
samples_result: median
sample_retract_dist: 1.0
samples_tolerance: 0.025
samples_tolerance_retries: 5
activate_gcode:
    _TAP_PROBE_ACTIVATE
deactivate_gcode:
    _TAP_PROBE_DEACTIVATE

bad_probe_retries: 6
drop_first_result: True
bad_probe_strategy: circle
nozzle_scrubber_gcode: CLEAN_NOZZLE
scrubbing_frequency: 2



#───< Extruder ---------------------------------------------------------
[tmc2209 extruder]
uart_pin: et0: PA15
run_current: 0.600
stealthchop_threshold: 999999
sense_resistor: 0.11 # default for klipper, kalico requires it.

[extruder]
step_pin: et0: PD0
dir_pin: et0: PD1
enable_pin: !et0: PD2
microsteps: 32
full_steps_per_rotation: 200
rotation_distance: 5.6
max_extrude_only_distance: 1400.0
#max_extrude_only_velocity: 75.0
#max_extrude_only_accel: 1500
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: et0: PB13
sensor_type: MAX31865
sensor_pin: et0:PA4
spi_bus: spi1
rtd_nominal_r: 1000
rtd_reference_r: 4300
rtd_num_of_wires: 2
rtd_use_50Hz_filter: True

control: pid
min_temp: -250
max_temp: 350

max_extrude_cross_section: 0.64

# smooth_time: 0.2

pid_Kp=48.629 
pid_Ki=12.469 
pid_Kd=47.413

#───< Fans ---------------------------------------------------------
[fan_generic T0_partfan]
pin: et0:PA0

[heater_fan T0_hotend_fan]
pin: et0:PA1
heater: extruder
heater_temp: 65.0

#───< LEDs --------------------------------------------------------------------
[neopixel T0_leds]
pin: et0:PD3
chain_count: 10
color_order: GRB, GRB, GRB, GRB, GRB, GRB, GRB, GRB, GRBW, GRBW
initial_RED: 0.0
initial_GREEN: 0.0
initial_BLUE: 0.0
initial_WHITE: 0.0

[gcode_macro _T0_vars]
variable_logo_led_name:         "T0_leds"
variable_logo_idx:              "1,2,3,4,5,6,7,8"
variable_logo_brightness:       "0.7,0.7,0.7,0.7,0.7,0.7,0.7,0.7"  
variable_nozzle_led_name:       "T0_leds"
variable_nozzle_idx:            "9,10"
variable_nozzle_brightness:     "1,1" # add it or leave it, defaults to 1.0 anyways.
gcode:


#───< Accelerometer ---------------------------------------------------------
[adxl345 T0]
cs_pin: et0: PB12
spi_software_sclk_pin: et0: PB10
spi_software_mosi_pin: et0: PB11
spi_software_miso_pin: et0: PB2
axes_map: x,z,-y

[tool T0]
params_accelerometer: 'adxl345 T0'

#============================== KALICO ==============================
[extruder]
control: mpc
heater_power: 63  
cooling_fan: fan_generic T0_partfan
filament_density: 1.07
filament_heat_capacity: 1.7
block_heat_capacity: 8.90074
sensor_responsiveness: 0.0859403
ambient_transfer: 0.0569646
fan_ambient_transfer: 0.0569646, 0.0595438, 0.0638702, 0.0634781, 0.067151
ambient_temp_sensor: heater_chamber_fan chamber
