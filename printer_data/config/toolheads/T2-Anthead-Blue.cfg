# ───| Tools MCU |───
[mcu et2]
canbus_uuid: 868cbf9d7ccf # 9422cd1b01cb # 

# ───| MCU temp sensor display |───
[temperature_sensor T2_mcu]
sensor_type: temperature_mcu
sensor_mcu: et2

# ───| Toolchange macro |───
[gcode_macro T2]
variable_active: 0
variable_color: ""
variable_tool_number: 2
gcode:
    SELECT_TOOL T={tool_number} {rawparams}

# ───| tool object |───
[tool T2]
detection_pin: ^!et2:PB6
tool_number: 2
extruder: extruder2
fan: T2_partfan


# ───| TAP Probe |───
[probe_multiplexer T2]
pin: ^et2:PB6
probe_number: 2
z_offset: 0
speed: 15
lift_speed: 75.0
samples: 4
samples_result: median
sample_retract_dist: 1.5
samples_tolerance: 0.025
samples_tolerance_retries: 8
activate_gcode:
    _TAP_PROBE_ACTIVATE
deactivate_gcode:
    _TAP_PROBE_DEACTIVATE

bad_probe_retries: 6
drop_first_result: True
bad_probe_strategy: circle
nozzle_scrubber_gcode: CLEAN_NOZZLE
scrubbing_frequency: 2


# ───| Extruder |───
[extruder2]
step_pin: et2: PD0
dir_pin: et2: PD1
enable_pin: !et2: PD2
microsteps: 32
full_steps_per_rotation: 200
rotation_distance: 5.6
max_extrude_only_distance: 1400.0
max_extrude_only_velocity: 75.0
max_extrude_only_accel: 1500
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: et2: PB13
sensor_type: MAX31865
sensor_pin: et2:PA4
spi_bus: spi1
rtd_nominal_r: 1000
rtd_reference_r: 4300
rtd_num_of_wires: 2
rtd_use_50Hz_filter: True

min_temp: 0
max_temp: 350
max_extrude_cross_section: 0.64
#smooth_time: 0.2

# KLIPPER (kalico overwritten)
control: pid
pid_Kp=24.318 
pid_Ki=10.808 
pid_Kd=13.679





[tmc2209 extruder2]
uart_pin: et2: PA15
run_current: 0.550
sense_resistor: 0.11 # default for klipper, kalico requires it.
stealthchop_threshold: 999999

# ───| Fans |───
[fan_generic T2_partfan]
pin: et2:PA1

[heater_fan T2_hotend_fan]
pin: et2:PA0
heater: extruder2
heater_temp: 60.0

# ───| Accelerometer |───
[adxl345 T2]
cs_pin: et2: PB12
spi_software_sclk_pin: et2: PB10
spi_software_mosi_pin: et2: PB11
spi_software_miso_pin: et2: PB2
axes_map: x,z,-y

# ───| LEDs |───

[neopixel T2_leds]
pin: et2:PD3
chain_count: 11
color_order: GRB, GRB, GRB, GRB, GRB, GRB, GRB, GRB, GRBW, GRBW, GRB
initial_RED: 0.0
initial_GREEN: 0.0
initial_BLUE: 0.0
initial_WHITE: 0.0
