
[danger_options]
log_statistics: True
log_bed_mesh_at_startup: False
log_velocity_limit_changes: False
log_pressure_advance_changes: False
bgflush_extra_time: 0.250
endstop_sample_count: 3 # 4
multi_mcu_trsync_timeout: 0.05

[constants]
# When true, toolhead MCUs are treated as non-critical so Klipper will boot
# even if a tool board is missing from the CAN bus.
toolheads_hotplug: False
stepcompress_xyz: True

