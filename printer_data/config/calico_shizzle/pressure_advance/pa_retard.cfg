[gcode_macro TEST_PA_RATIO_SCALE]
description: Dry-run test for the SET_PA_RATIO_SCALE logic.
variable_start_vlin: 1.0
variable_stop_vlin: 3.5
variable_steps: 11
gcode:
    {% set start_vlin = params.get('START', start_vlin)|float %}
    {% set stop_vlin = params.get('STOP', stop_vlin)|float %}
    {% set steps = params.get('STEPS', steps)|int %}

    # --- Store the original PA values ---
    {% set extr = printer[printer.toolhead.extruder] %}
    {% set original_pa = {
        'ADVANCE': extr.linear_advance,
        'OFFSET': extr.nonlinear_offset,
        'VELOCITY': extr.linearization_velocity
    } %}

    { action_respond_info("--- Starting SET_PA_RATIO_SCALE Dry Run ---") }
    { action_respond_info("Sweeping VLIN from %.2f to %.2f in %d steps" % (start_vlin, stop_vlin, steps)) }
    { action_respond_info("Using current config as baseline: LA=%.4f, NLO=%.4f, VLIN=%.4f" % (original_pa.ADVANCE, original_pa.OFFSET, original_pa.VELOCITY)) }
    { action_respond_info("-" * 40) }

    # --- Loop through the steps and call the real macro ---
    {% for i in range(steps) %}
        {% set fraction = i / (steps - 1.0) %}
        {% set current_vlin = start_vlin + (stop_vlin - start_vlin) * fraction %}
        
        SET_PA_RATIO_SCALE VELOCITY={current_vlin}
    {% endfor %}
    
    # --- Restore the original PA values ---
    SET_PRESSURE_ADVANCE { original_pa|items|map('join', '=')|join(' ') }

    { action_respond_info("-" * 40) }
    { action_respond_info("--- Dry Run Complete ---") }
    { action_respond_info("Restored original PA values.") }

[gcode_macro SET_PA_RATIO_SCALE]
description: Sweeps VLIN, solving for an UNBIASED scale 'k'. Applies k to both a baseline LA and NLO.
gcode:
    {% set EPS = 1e-9 %}
    {% set _   = self.__setattr__('printer', printer.printer) %}
    {% set glb = self.printer.__class__.__init__.__globals__ %}
    {% set import = glb.importlib.import_module %}
    {% set math   = import('math') %}

    {%- macro fil_v(line_v=0.0) -%}
        {%- set fd = printer.pa_test.filament_diameter or 1.75 -%}
        {%- set nz = printer.pa_test.get('nozzle', 0.4) -%}
        {%- set lh = printer.pa_test.get('layer_height', nz/2.0) -%}
        {%- set Afil = 3.14159265359*(fd/2.0)**2 -%}
        {%- set Aline = nz*lh -%}
        { (line_v*Aline)/Afil }
    {%- endmacro -%}

    {% set vlin_new = params.get('VELOCITY', None)|float(None) %}
    
    {% if vlin_new is none %}
        { action_respond_info("Error: SET_PA_RATIO_SCALE requires VELOCITY.") }
    {% else %}
        {% set extr = printer[printer.toolhead.extruder] %}
        {% set la0 = params.get('BASE_LA', extr.linear_advance)|float %}
        {% set nlo0 = params.get('BASE_NLO', extr.nonlinear_offset)|float %}
        {% set vlin0  = params.get('BASE_VLIN', extr.linearization_velocity or 1.0)|float %}

        {% set vS = fil_v(printer.pa_test.slow_velocity   or 20.0)|float %}
        {% set vM = fil_v(printer.pa_test.medium_velocity or 120.0)|float %}
        {% set vF = fil_v(printer.pa_test.fast_velocity   or 250.0)|float %}

        {% set tS0 = math.tanh(vS/[EPS, vlin0]|max) %}
        {% set tM0 = math.tanh(vM/[EPS, vlin0]|max) %}
        {% set tF0 = math.tanh(vF/[EPS, vlin0]|max) %}
        {% set AstarS = la0*vS + nlo0*tS0 %}
        {% set AstarM = la0*vM + nlo0*tM0 %}
        {% set AstarF = la0*vF + nlo0*tF0 %}

        {% set tS_new = math.tanh(vS/[EPS, vlin_new]|max) %}
        {% set tM_new = math.tanh(vM/[EPS, vlin_new]|max) %}
        {% set tF_new = math.tanh(vF/[EPS, vlin_new]|max) %}
        {% set AnewS = la0*vS + nlo0*tS_new %}
        {% set AnewM = la0*vM + nlo0*tM_new %}
        {% set AnewF = la0*vF + nlo0*tF_new %}
        
        # --- THE FIX: NO MORE VIBES ---
        {% set wS, wM, wF = 1.0, 1.0, 1.0 %}
        
        {% set num = wS*AnewS*AstarS + wM*AnewM*AstarM + wF*AnewF*AstarF %}
        {% set den = wS*AnewS*AnewS + wM*AnewM*AnewM + wF*AnewF*AnewF %}
        {% set k = num / [EPS, den]|max %}

        {% set k = [0.5, [k, 1.8]|min]|max %}

        {% set la_new = k * la0 %}
        {% set nlo_new = k * nlo0 %}

        SET_PRESSURE_ADVANCE ADVANCE={la_new|round(6)} OFFSET={nlo_new|round(6)} VELOCITY={vlin_new|round(6)}
        { action_respond_info("UnbiasedRatioScale -> VLIN=%.4f | k=%.4f, LA=%.6f, NLO=%.6f" % (vlin_new, k, la_new, nlo_new)) }
    {% endif %}

[gcode_macro SET_PA_MATCH_SLOW_TT]
description: "NLOV→VLIN (linear map from RUN_PA_TEST.velocity range). Hold ADVANCE; solve OFFSET so A_slow stays constant."
gcode:
    {% set EPS = 1e-9 %}
    {% set _   = self.__setattr__('printer', printer.printer) %}
    {% set glb = self.printer.__class__.__init__.__globals__ %}
    {% set import = glb.importlib.import_module %}
    {% set math   = import('math') %}

    {%- macro fil_v(line_v=0.0) -%}
        {%- set fd = printer.pa_test.filament_diameter or 1.75 -%}
        {%- set nz = printer['gcode_macro RUN_PA_TEST'].nozzle or 0.4 -%}
        {%- set lh = printer.pa_test.get('layer_height', nz/2.0) -%}
        {%- set Af = 3.14159265359 * (fd/2.0) * (fd/2.0) -%}
        {%- set Al = nz * lh -%}
        { (line_v * Al) / Af }
    {%- endmacro -%}

    {% set extr   = printer[printer.toolhead.extruder] %}
    {% set la0    = (params.get('ADVANCE',    extr.linear_advance)            or 0.0)|float %}
    {% set nlo0   = (params.get('BASE_OFFSET',extr.nonlinear_offset)          or 0.0)|float %}
    {% set vlin0  = (params.get('BASE_VLIN',  extr.linearization_velocity)    or 1.0)|float %}

    {% set RP      = printer['gcode_macro RUN_PA_TEST'] %}
    {% set vstart  = RP.ranges['velocity']['start']|float %}
    {% set vstop   = RP.ranges['velocity']['stop']|float %}
    {% set nlov    = params.get('NLOV', None)|float(None) %}

    {% if nlov is none %}
        { action_respond_info("SET_PA_MATCH_SLOW_TT | needs NLOV from TUNING_TOWER") }
    {% else %}
        {% set nlov = [0.0, [1.0, nlov]|min]|max %}
        {% set vlin = vstart + (vstop - vstart) * nlov %}

        {% set vS_line = printer.pa_test.slow_velocity or 20.0 %}
        {% set vS = fil_v(vS_line)|float %}

        {% set A0S = la0*vS + nlo0*math.tanh(vS/[EPS, vlin0]|max) %}
        {% set tS  = math.tanh(vS/[EPS, vlin]|max) %}
        {% set nlo1 = (A0S - la0*vS) / [EPS, tS]|max %}
        {% set nlo1 = [0.0, nlo1]|max %}

        SET_PRESSURE_ADVANCE ADVANCE={ la0|round(6) } OFFSET={ nlo1|round(6) } VELOCITY={ vlin|round(6) }
        { action_respond_info("SET_PA_MATCH_SLOW_TT | nlov=" ~ nlov|round(5)
                              ~ "  vlin=" ~ vlin|round(6)
                              ~ "  la=" ~ la0|round(6)
                              ~ "  nlo=" ~ nlo1|round(6)
                              ~ "  vS(fil)=" ~ vS|round(6)) }
    {% endif %}

# add this if you haven't already — two-anchor matcher
[gcode_macro SET_PA_MATCH_TWOPT_TT]
description: "Map NLOV→VLIN; solve (LA,NLO) so A_slow and A_medium stay constant"
gcode:
    {% set EPS = 1e-9 %}
    {% set _   = self.__setattr__('printer', printer.printer) %}
    {% set glb = self.printer.__class__.__init__.__globals__ %}
    {% set import = glb.importlib.import_module %}
    {% set math   = import('math') %}

    {%- macro fil_v(line_v=0.0) -%}
        {%- set fd = printer.pa_test.filament_diameter or 1.75 -%}
        {%- set nz = printer['gcode_macro RUN_PA_TEST'].nozzle or 0.4 -%}
        {%- set lh = printer.pa_test.get('layer_height', nz/2.0) -%}
        {%- set Af = 3.14159265359 * (fd/2.0) * (fd/2.0) -%}
        {%- set Al = nz * lh -%}
        { (line_v * Al) / Af }
    {%- endmacro -%}

    {% set extr   = printer[printer.toolhead.extruder] %}
    {% set la0    = (params.get('BASE_LA',   extr.linear_advance)         or 0.0)|float %}
    {% set nlo0   = (params.get('BASE_NLO',  extr.nonlinear_offset)       or 0.0)|float %}
    {% set vlin0  = (params.get('BASE_VLIN', extr.linearization_velocity) or 1.0)|float %}

    {% set RP      = printer['gcode_macro RUN_PA_TEST'] %}
    {% set vstart  = RP.ranges['velocity']['start']|float %}
    {% set vstop   = RP.ranges['velocity']['stop']|float %}
    {% set nlov    = params.get('NLOV', None)|float(None) %}

    {% if nlov is none %}
        { action_respond_info("SET_PA_MATCH_TWOPT_TT | needs NLOV from 0..1") }
    {% else %}
        {% set nlov = [0.0, [1.0, nlov]|min]|max %}
        {% set vlin = vstart + (vstop - vstart) * nlov %}

        {% set vS_line = printer.pa_test.medium_velocity   or 20.0 %} # slow_velocity   or 20.0 %}
        {% set vM_line = printer.pa_test.fast_velocity or 120.0 %} # medium_velocity or 120.0 %}
        {% set vS = fil_v(vS_line)|float %}
        {% set vM = fil_v(vM_line)|float %}

        {% set tS0 = math.tanh(vS/[EPS, vlin0]|max) %}
        {% set tM0 = math.tanh(vM/[EPS, vlin0]|max) %}
        {% set A0S = la0*vS + nlo0*tS0 %}
        {% set A0M = la0*vM + nlo0*tM0 %}

        {% set tS = math.tanh(vS/[EPS, vlin]|max) %}
        {% set tM = math.tanh(vM/[EPS, vlin]|max) %}

        {% set a11 = vS %}
        {% set a12 = tS %}
        {% set a21 = vM %}
        {% set a22 = tM %}
        {% set b1  = A0S %}
        {% set b2  = A0M %}

        {% set det = a11*a22 - a12*a21 %}
        {% if det|abs < 1e-9 %}
            { action_respond_info("SET_PA_MATCH_TWOPT_TT | ill-conditioned at vlin=" ~ vlin|round(6)) }
        {% else %}
            {% set la1  = ( b1*a22 - a12*b2 ) / det %}
            {% set nlo1 = ( a11*b2 - b1*a21 ) / det %}
            {% set la1  = [0.0, la1]|max %}
            {% set nlo1 = [0.0, nlo1]|max %}
            SET_PRESSURE_ADVANCE ADVANCE={ la1|round(6) } OFFSET={ nlo1|round(6) } VELOCITY={ vlin|round(6) }
            { action_respond_info("TWOPT | nlov=" ~ nlov|round(5)
                                  ~ " vlin=" ~ vlin|round(6)
                                  ~ " la=" ~ la1|round(6)
                                  ~ " nlo=" ~ nlo1|round(6)
                                  ~ "  (A_slow,A_med preserved)") }
        {% endif %}
    {% endif %}

# quick visual sanity check — no motion, sweeps NLOV 0→1, then restores PA
[gcode_macro PA_TWOPT_SWEEP_DRYRUN]
description: "Console sweep of NLOV→[0..1] calling SET_PA_MATCH_TWOPT_TT; restores PA at end"
variable_steps: 11
gcode:
    {% set steps = params.get('STEPS', steps)|int %}
    {% set steps = [2, steps]|max %}
    {% set extr = printer[printer.toolhead.extruder] %}
    {% set base_la   = (extr.linear_advance            or 0.0)|float %}
    {% set base_nlo  = (extr.nonlinear_offset          or 0.0)|float %}
    {% set base_vlin = (extr.linearization_velocity    or 1.0)|float %}

    { action_respond_info("TWOPT dry-run: steps=" ~ steps
        ~ "  base la=" ~ base_la|round(6)
        ~ " nlo=" ~ base_nlo|round(6)
        ~ " vlin=" ~ base_vlin|round(6)) }

    {% for i in range(steps) %}
        {% set nlov = i / (steps - 1.0) %}
        SET_PA_MATCH_TWOPT_TT NLOV={ nlov|round(6) }
        { action_respond_info("• nlov=" ~ nlov|round(5)) }
    {% endfor %}

    # restore previous PA triplet
    SET_PRESSURE_ADVANCE ADVANCE={ base_la|round(6) } OFFSET={ base_nlo|round(6) } VELOCITY={ base_vlin|round(6) }
    { action_respond_info("TWOPT dry-run done — PA restored") }





[gcode_macro _PA_NLOV_DRYRUN]
description: "Console sweep of NLOV calling SET_PA_CORR per step (no motion)"
variable_steps: 11
variable_anchor: 'MID'      ; SLOW | MID | FAST  (or pass HEAD_V=)
variable_head_v: 0          ; when >0, overrides ANCHOR (line speed mm/s)
gcode:
    {% set _ = self.__setattr__('printer', printer.printer) %}
    {% set steps = params.get('STEPS', steps)|int %}
    {% set anchor = (params.get('ANCHOR', anchor)|string).upper() %}
    {% set headv  = params.get('HEAD_V', head_v)|float %}
    {% set steps = [2, steps]|max %}
    { action_respond_info("PA_NLOV_DRYRUN: steps=" ~ steps ~ "  mode=" ~ (('HEAD_V=' ~ headv) if headv>0 else ('ANCHOR=' ~ anchor))) }
    {% for i in range(steps) %}
        {% set nlov = i / (steps - 1.0) %}
        {% if headv > 0 %}
            SET_PA_CORR NLOV={ nlov|round(5) } HEAD_V={ headv|round(3) }
        {% else %}
            SET_PA_CORR NLOV={ nlov|round(5) } ANCHOR={ anchor }
        {% endif %}
    {% endfor %}

[gcode_macro _SET_PA_COFIT]
description: "Co-fit LA & NLO for each vlin, preserving two anchors A*(v) while sweeping NLOV"
gcode:
    # ── helpers ──────────────────────────────────────────────────────────────────────────────
    {% set EPS = 1e-9 %}
    {%- macro filament_velocity(line_speed=0.0) -%}
        {%- set fil_diam      = printer.pa_test.filament_diameter or 1.75 -%}
        {%- set nozzle        = printer.pa_test.get('nozzle', 0.4) -%}
        {%- set layer_height  = printer.pa_test.get('layer_height', nozzle / 2.0) -%}
        {%- set filament_area = 3.14159265359 * (fil_diam/2.0)**2 -%}
        {%- set line_area     = nozzle * layer_height -%}
        { (line_speed * line_area) / filament_area }
    {%- endmacro -%}

    # inputs
    {% set NLOV   = params.get('NLOV', None)|float(None) %}
    {% if NLOV is none or NLOV < 0 or NLOV > 1 %}
        { action_respond_info("SET_PA_COFIT: need 0<=NLOV<=1") }
    {% else %}
        {% set _   = self.__setattr__('printer', printer.printer) %}
        {% set glb = self.printer.__class__.__init__.__globals__ %}
        {% set import = glb.importlib.import_module %}
        {% set math   = import('math') %}

        {% set extr = printer[printer.toolhead.extruder] %}
        {% set la0   = (extr.linear_advance            or 0.0)|float %}
        {% set nlo0  = (extr.nonlinear_offset          or 0.0)|float %}
        {% set vlin0 = (extr.linearization_velocity    or 1.0)|float %}

        {% set runpa   = printer['gcode_macro RUN_PA_TEST'] or {} %}
        {% set vel_min = runpa.ranges.velocity.start or 0.5 %}
        {% set vel_max = runpa.ranges.velocity.stop  or 5.0 %}
        {% set vlin_new = vel_min * ((vel_max / vel_min) ** NLOV) %}

        # choose anchors
        {% set A1 = (params.get('ANCHOR1','SLOW')).upper() %}
        {% set A2 = (params.get('ANCHOR2','MID')).upper() %}

        {% set HV1 = params.get('HEAD_V1', None)|float(None) %}
        {% set HV2 = params.get('HEAD_V2', None)|float(None) %}
        {% if HV1 is not none and HV1 > 0 %}
            {% set head_v1 = HV1 %}
        {% elif A1 in ['SLOW','LOW'] %}
            {% set head_v1 = printer.pa_test.slow_velocity or 20.0 %}
        {% elif A1 in ['FAST','HIGH'] %}
            {% set head_v1 = printer.pa_test.fast_velocity or 250.0 %}
        {% else %}
            {% set head_v1 = printer.pa_test.medium_velocity or 120.0 %}
        {% endif %}

        {% if HV2 is not none and HV2 > 0 %}
            {% set head_v2 = HV2 %}
        {% elif A2 in ['SLOW','LOW'] %}
            {% set head_v2 = printer.pa_test.slow_velocity or 20.0 %}
        {% elif A2 in ['FAST','HIGH'] %}
            {% set head_v2 = printer.pa_test.fast_velocity or 250.0 %}
        {% else %}
            {% set head_v2 = printer.pa_test.medium_velocity or 120.0 %}
        {% endif %}

        {% set v1 = filament_velocity(line_speed=head_v1)|float %}
        {% set v2 = filament_velocity(line_speed=head_v2)|float %}

        # target advances A1*, A2* from current model at the two anchors
        {% set t1o = math.tanh(v1 / [EPS, vlin0]|max) %}
        {% set t2o = math.tanh(v2 / [EPS, vlin0]|max) %}
        {% set A1star = la0*v1 + nlo0*t1o %}
        {% set A2star = la0*v2 + nlo0*t2o %}

        # coefficients for new vlin
        {% set t1 = math.tanh(v1 / [EPS, vlin_new]|max) %}
        {% set t2 = math.tanh(v2 / [EPS, vlin_new]|max) %}
        {% set det = v1*t2 - v2*t1 %}
        {% if det|abs < 1e-9 %}
            { action_respond_info("SET_PA_COFIT: degenerate anchors (pick different speeds).") }
        {% else %}
            {% set la_new  = (A1star*t2 - A2star*t1) / det %}
            {% set nlo_new = (v1*A2star - v2*A1star) / det %}

            # optional guardrails
            {% set la_new = [0.0, la_new]|max %}
            {% set nlo_new = [0.0, nlo_new]|max %}

            SET_PRESSURE_ADVANCE ADVANCE={ la_new|round(6) } OFFSET={ nlo_new|round(6) } VELOCITY={ vlin_new|round(6) }
            { action_respond_info("PA co-fit (" ~ A1 ~ "," ~ A2 ~ ") -> VLIN=" ~ vlin_new|round(5)
                                  ~ "  LA=" ~ la0|round(5) ~ "→" ~ la_new|round(5)
                                  ~ "  NLO=" ~ nlo0|round(5) ~ "→" ~ nlo_new|round(5)
                                  ~ "  | v1*=" ~ v1|round(5) ~ " v2*=" ~ v2|round(5)) }
        {% endif %}
    {% endif %}




[gcode_macro PA_MATCH_SLOW_DRYRUN]
description: "Dry-run vlin sweep; keep LA fixed and solve NLO so A(slow) stays constant"
variable_steps: 11
gcode:
    {% set EPS = 1e-9 %}
    {% set _   = self.__setattr__('printer', printer.printer) %}
    {% set glb = self.printer.__class__.__init__.__globals__ %}
    {% set import = glb.importlib.import_module %}
    {% set math   = import('math') %}

    {%- macro fil_v(line_v=0.0) -%}
        {%- set fd = printer.pa_test.filament_diameter or 1.75 -%}
        {%- set nz = printer.pa_test.get('nozzle', 0.4) -%}
        {%- set lh = printer.pa_test.get('layer_height', nz/2.0) -%}
        {%- set Af = 3.14159265359 * (fd/2.0) * (fd/2.0) -%}
        {%- set Al = nz * lh -%}
        { (line_v * Al) / Af }
    {%- endmacro -%}

    {% set extr  = printer[printer.toolhead.extruder] %}
    {% set la0   = (extr.linear_advance or 0.0)|float %}
    {% set nlo0  = (extr.nonlinear_offset or 0.0)|float %}
    {% set vlin0 = (extr.linearization_velocity or 1.0)|float %}

    {% set vS = fil_v(printer.pa_test.slow_velocity   or 20.0)|float %}
    {% set vM = fil_v(printer.pa_test.medium_velocity or 120.0)|float %}

    {% set A0S  = la0*vS + nlo0*math.tanh(vS/[EPS, vlin0]|max) %}
    {% set vref = (vS*vM)**0.5 %}
    {% set vmin = params.get('VLIN_MIN', vref/1.83178)|float %}
    {% set vmax = params.get('VLIN_MAX', vref/0.693147)|float %}
    {% set steps = params.get('STEPS', steps)|int %}

    { action_respond_info("MATCH_SLOW window vlin=" ~ vmin|round(5) ~ "→" ~ vmax|round(5)
        ~ "  base la=" ~ la0|round(6) ~ " nlo=" ~ nlo0|round(6) ~ " vlin=" ~ vlin0|round(6)
        ~ "  v_slow=" ~ vS|round(5) ~ "  A_slow*=" ~ A0S|round(6)) }

    {% for i in range([2, steps]|max) %}
        {% set nlov = i/([2, steps]|max - 1.0) %}
        {% set vlin = vmin * ((vmax/vmin)**nlov) %}
        {% set tS   = math.tanh(vS/[EPS, vlin]|max) %}
        {% set nlo1 = (A0S - la0*vS) / [EPS, tS]|max %}
        {% set nlo1 = [0.0, nlo1]|max %}
        { action_respond_info("• nlov=" ~ nlov|round(5) ~ "  vlin=" ~ vlin|round(6)
                              ~ "  la=" ~ la0|round(6)
                              ~ "  nlo=" ~ nlo1|round(6)
                              ~ "  t_slow=" ~ tS|round(4)) }
    {% endfor %}



