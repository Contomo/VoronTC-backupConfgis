[gcode_macro PA_RATIO_SCALE_DRYRUN]
description: "NLOV sweep that preserves LA:NLO and solves a single scale k per vlin (no motion)"
variable_steps: 11
gcode:
    {% set EPS = 1e-9 %}
    {% set _ = self.__setattr__('printer', printer.printer) %}
    {% set glb = self.printer.__class__.__init__.__globals__ %}
    {% set import = glb.importlib.import_module %}
    {% set math = import('math') %}

    {%- macro fil_v(line_v=0.0) -%}
        {%- set fd = printer.pa_test.filament_diameter or 1.75 -%}
        {%- set nz = printer.pa_test.get('nozzle', 0.4) -%}
        {%- set lh = printer.pa_test.get('layer_height', nz/2.0) -%}
        {%- set Afil = 3.14159265359*(fd/2.0)**2 -%}
        {%- set Aline = nz*lh -%}
        { (line_v*Aline)/Afil }
    {%- endmacro -%}

    {% set extr = printer[printer.toolhead.extruder] %}
    {% set la0 = (extr.linear_advance or 0.0)|float %}
    {% set nlo0 = (extr.nonlinear_offset or 0.0)|float %}
    {% set vlin0 = (extr.linearization_velocity or 1.0)|float %}

    {% set vS = fil_v(printer.pa_test.slow_velocity   or 20.0)|float %}
    {% set vM = fil_v(printer.pa_test.medium_velocity or 120.0)|float %}
    {% set vF = fil_v(printer.pa_test.fast_velocity   or 250.0)|float %}

    {% set AstarS = la0*vS + nlo0*math.tanh(vS/[EPS,vlin0]|max) %}
    {% set AstarM = la0*vM + nlo0*math.tanh(vM/[EPS,vlin0]|max) %}
    {% set AstarF = la0*vF + nlo0*math.tanh(vF/[EPS,vlin0]|max) %}

    {% set wS, wM, wF = 1.2, 1.6, 1.0 %}

    {% set vref = (vS*vM)**0.5 %}
    {% set vmin = vref/1.83178 %}
    {% set vmax = vref/0.693147 %}
    {% set vmin = [0.30, vmin]|max %}
    {% set vmax = [vmin*1.25, vmax]|max %}

    {% set steps = params.get('STEPS', steps)|int %}
    {% set steps = [2, steps]|max %}

    { action_respond_info("RATIO·SCALE vlin=" ~ vmin|round(4) ~ "→" ~ vmax|round(4)
        ~ "  base la=" ~ la0|round(6) ~ " nlo=" ~ nlo0|round(6) ~ " vlin=" ~ vlin0|round(6)) }

    {% for i in range(steps) %}
        {% set nlov = i/(steps-1.0) %}
        {% set vlin = vmin * ((vmax/vmin)**nlov) %}
        {% set tS = math.tanh(vS/[EPS,vlin]|max) %}
        {% set tM = math.tanh(vM/[EPS,vlin]|max) %}
        {% set tF = math.tanh(vF/[EPS,vlin]|max) %}

        {% set AnewS = la0*vS + nlo0*tS %}
        {% set AnewM = la0*vM + nlo0*tM %}
        {% set AnewF = la0*vF + nlo0*tF %}

        {% set num = wS*AnewS*AstarS + wM*AnewM*AstarM + wF*AnewF*AstarF %}
        {% set den = wS*AnewS*AnewS + wM*AnewM*AnewM + wF*AnewF*AnewF %}
        {% set k = num / [EPS, den]|max %}

        {% set k = [0.5, k]|max %}
        {% set k = [k, 1.6]|min %}

        {% set la = k*la0 %}
        {% set nlo = k*nlo0 %}

        { action_respond_info("• nlov=" ~ nlov|round(5)
            ~ "  vlin=" ~ vlin|round(6)
            ~ "  k=" ~ k|round(5)
            ~ "  la=" ~ la|round(6)
            ~ "  nlo=" ~ nlo|round(6)
            ~ "  tS=" ~ tS|round(3) ~ " tM=" ~ tM|round(3) ~ " tF=" ~ tF|round(3)) }
    {% endfor %}



[gcode_macro PA_COFIT_DRYRUN]
description: "Console-only sweep of NLOV with two-anchor co-fit (no motion)"
variable_steps: 9
variable_anchor1: 'SLOW'   # SLOW | MID | FAST
variable_anchor2: 'MID'    # SLOW | MID | FAST
variable_head_v1: 0        # override anchor1 with explicit head speed (mm/s); 0 = disabled
variable_head_v2: 0        # override anchor2 with explicit head speed (mm/s); 0 = disabled
gcode:
    # ---- helpers
    {% set EPS = 1e-9 %}
    {%- macro filament_velocity(line_speed=0.0) -%}
        {%- set fil_diam      = printer.pa_test.filament_diameter or 1.75 -%}
        {%- set nozzle        = printer.pa_test.get('nozzle', 0.4) -%}
        {%- set layer_height  = printer.pa_test.get('layer_height', nozzle / 2.0) -%}
        {%- set filament_area = 3.14159265359 * (fil_diam/2.0)**2 -%}
        {%- set line_area     = nozzle * layer_height -%}
        { (line_speed * line_area) / filament_area }
    {%- endmacro -%}

    # ---- inputs
    {% set steps = params.get('STEPS', steps)|int %}
    {% set steps = [2, steps]|max %}
    {% set A1    = (params.get('ANCHOR1', anchor1)|string).upper() %}
    {% set A2    = (params.get('ANCHOR2', anchor2)|string).upper() %}
    {% set HV1   = params.get('HEAD_V1', head_v1)|float %}
    {% set HV2   = params.get('HEAD_V2', head_v2)|float %}

    {% set _   = self.__setattr__('printer', printer.printer) %}
    {% set glb = self.printer.__class__.__init__.__globals__ %}
    {% set import = glb.importlib.import_module %}
    {% set math   = import('math') %}

    {% set extr  = printer[printer.toolhead.extruder] %}
    {% set la0   = (extr.linear_advance         or 0.0)|float %}
    {% set nlo0  = (extr.nonlinear_offset       or 0.0)|float %}
    {% set vlin0 = (extr.linearization_velocity or 1.0)|float %}

    {% set runpa   = printer['gcode_macro RUN_PA_TEST'] or {} %}

    {% set vel_min = params.get('VLIN_MIN', runpa.ranges.velocity.start or 0.8)|float %}
    {% set vel_max = params.get('VLIN_MAX', runpa.ranges.velocity.stop  or 2.2)|float %}

    {% set head_v1 = HV1 if HV1 > 0 else
        (printer.pa_test.slow_velocity   or 20.0) if A1 in ['SLOW','LOW'] else
        (printer.pa_test.fast_velocity   or 250.0) if A1 in ['FAST','HIGH'] else
        (printer.pa_test.medium_velocity or 120.0) %}
    {% set head_v2 = HV2 if HV2 > 0 else
        (printer.pa_test.slow_velocity   or 20.0) if A2 in ['SLOW','LOW'] else
        (printer.pa_test.fast_velocity   or 250.0) if A2 in ['FAST','HIGH'] else
        (printer.pa_test.medium_velocity or 120.0) %}

    {% set v1 = filament_velocity(line_speed=head_v1)|float %}
    {% set v2 = filament_velocity(line_speed=head_v2)|float %}

    {% set t1o = math.tanh(v1 / [EPS, vlin0]|max) %}
    {% set t2o = math.tanh(v2 / [EPS, vlin0]|max) %}
    {% set A1star = la0*v1 + nlo0*t1o %}
    {% set A2star = la0*v2 + nlo0*t2o %}

    { action_respond_info("PA_COFIT_DRYRUN: steps=" ~ steps
        ~ "  anchors=(" ~ (('HEAD_V1=' ~ head_v1) if HV1>0 else A1) ~ ", " ~ (('HEAD_V2=' ~ head_v2) if HV2>0 else A2) ~ ")"
        ~ "  v*(fil)=" ~ v1|round(4) ~ "," ~ v2|round(4)
        ~ "  baseline la=" ~ la0|round(6) ~ " nlo=" ~ nlo0|round(6) ~ " vlin=" ~ vlin0|round(6)) }

    {% set w1 = params.get('W1', 1.0)|float %}
    {% set w2 = params.get('W2', 1.5)|float %} 
    {% set lam= params.get('LAMBDA', 0.10)|float %} 

    {% for i in range(steps) %}
        {% set nlov = i / (steps - 1.0) %}
        {% set vlin = vel_min * ((vel_max / vel_min) ** nlov) %}
        {% set t1 = math.tanh(v1 / [EPS, vlin]|max) %}
        {% set t2 = math.tanh(v2 / [EPS, vlin]|max) %}

        {% set a11 = w1*v1*v1 + w2*v2*v2 + lam %}
        {% set a12 = w1*v1*t1 + w2*v2*t2 %}
        {% set a22 = w1*t1*t1 + w2*t2*t2 %}
        {% set b1  = w1*A1star*v1 + w2*A2star*v2 + lam*la0 %}
        {% set b2  = w1*A1star*t1 + w2*A2star*t2 %}

        {% set det = a11*a22 - a12*a12 %}
        {% if det|abs < 1e-9 %}
            { action_respond_info("• nlov=" ~ nlov|round(5) ~ " vlin=" ~ vlin|round(6) ~ " — ill-conditioned (adjust anchors/λ)") }
        {% else %}
            {% set la  = ( b1*a22 - a12*b2 ) / det %}
            {% set nlo = ( a11*b2 - a12*b1 ) / det %}
            {% set la  = [0.0, la]|max %}
            {% set nlo = [0.0, nlo]|max %}
            { action_respond_info("• nlov=" ~ nlov|round(5)
                                  ~ "  vlin=" ~ vlin|round(6)
                                  ~ "  la=" ~ la|round(6)
                                  ~ "  nlo=" ~ nlo|round(6)
                                  ~ "  t1=" ~ t1|round(3) ~ " t2=" ~ t2|round(3)
                                  ~ "  [λ=" ~ lam ~ " w=(" ~ w1 ~ "," ~ w2 ~ ")]") }
        {% endif %}
    {% endfor %}






[gcode_macro SET_PA_AUTOFIT]
description: "Apply (la,nlo,vlin) for a given NLOV with auto anchors/weights/window"
gcode:
    {% set EPS = 1e-9 %}
    {% set _   = self.__setattr__('printer', printer.printer) %}
    {% set glb = self.printer.__class__.__init__.__globals__ %}
    {% set import = glb.importlib.import_module %}
    {% set math   = import('math') %}

    {%- macro fil_v(line_v=0.0) -%}
        {%- set fd = printer.pa_test.filament_diameter or 1.75 -%}
        {%- set nz = printer.pa_test.get('nozzle', 0.4) -%}
        {%- set lh = printer.pa_test.get('layer_height', nz/2.0) -%}
        {%- set Afil = 3.14159265359*(fd/2.0)**2 -%}
        {%- set Aline = nz*lh -%}
        { (line_v*Aline)/Afil }
    {%- endmacro -%}

    {% set extr  = printer[printer.toolhead.extruder] %}
    {% set la0   = (extr.linear_advance            or 0.0)|float %}
    {% set nlo0  = (extr.nonlinear_offset          or 0.0)|float %}
    {% set vlin0 = (extr.linearization_velocity    or 1.0)|float %}

    {% set vS = fil_v(printer.pa_test.slow_velocity   or 20.0)|float %}
    {% set vM = fil_v(printer.pa_test.medium_velocity or 120.0)|float %}
    {% set vF = fil_v(printer.pa_test.fast_velocity   or 250.0)|float %}
    {% set V = [vS, vM, vF] %}

    {% set vmin = [0.4, 0.6*vM]|max %}
    {% set vmax = [1.8*vM, 5.0]|min %}
    {% if vmax < vmin + 1e-6 %}
        {% set vmax = vmin*1.4 %}
    {% endif %}

    {% set t0 = [math.tanh(vS/[EPS,vlin0]|max), math.tanh(vM/[EPS,vlin0]|max), math.tanh(vF/[EPS,vlin0]|max)] %}
    {% set Astar = [la0*vS + nlo0*t0[0], la0*vM + nlo0*t0[1], la0*vF + nlo0*t0[2]] %}

    {% set w = [] %}
    {% for vv in V %}
        {% set x = vv/[EPS,vlin0]|max %}
        {% set sech2 = 1.0/(math.cosh(x)**2) %}
        {% set _ = w.append(0.5 + 1.5*sech2) %}
    {% endfor %}
    {% set w = [w[0], w[1]*1.3, w[2]] %}

    {% set LAMBDA = 0.40 %}
    {% set NLOV = params.get('NLOV', None)|float(None) %}
    {% if NLOV is none or NLOV < 0 or NLOV > 1 %}
        { action_respond_info("SET_PA_AUTOFIT: need NLOV in [0,1]") }
    {% else %}
        {% set vlin = vmin * ((vmax/vmin)**NLOV) %}
        {% set t = [math.tanh(vS/[EPS,vlin]|max), math.tanh(vM/[EPS,vlin]|max), math.tanh(vF/[EPS,vlin]|max)] %}

        {% set a11 = w[0]*vS*vS + w[1]*vM*vM + w[2]*vF*vF + LAMBDA %}
        {% set a12 = w[0]*vS*t[0] + w[1]*vM*t[1] + w[2]*vF*t[2] %}
        {% set a22 = w[0]*t[0]*t[0] + w[1]*t[1]*t[1] + w[2]*t[2]*t[2] %}
        {% set b1  = w[0]*Astar[0]*vS + w[1]*Astar[1]*vM + w[2]*Astar[2]*vF + LAMBDA*la0 %}
        {% set b2  = w[0]*Astar[0]*t[0] + w[1]*Astar[1]*t[1] + w[2]*Astar[2]*t[2] %}
        {% set det = a11*a22 - a12*a12 %}
        {% if det|abs < 1e-9 %}
            { action_respond_info("SET_PA_AUTOFIT: ill-conditioned at vlin=" ~ vlin|round(6)) }
        {% else %}
            {% set la  = ( b1*a22 - a12*b2 ) / det %}
            {% set nlo = ( a11*b2 - a12*b1 ) / det %}
            {% set la  = [0.002, la]|max %}
            {% set nlo = [0.0,   nlo]|max %}
            SET_PRESSURE_ADVANCE ADVANCE={ la|round(6) } OFFSET={ nlo|round(6) } VELOCITY={ vlin|round(6) }
            { action_respond_info("PA auto-fit -> vlin=" ~ vlin|round(5)
                                  ~ "  la=" ~ la|round(6)
                                  ~ "  nlo=" ~ nlo|round(6)
                                  ~ "  tS=" ~ t[0]|round(3) ~ " tM=" ~ t[1]|round(3) ~ " tF=" ~ t[2]|round(3)) }
        {% endif %}
    {% endif %}




[gcode_macro PA_AUTOFIT_DRYRUN]
description: "Console-only NLOV sweep with auto anchors/weights/window (no motion)"
variable_steps: 11
gcode:
    {% set EPS = 1e-9 %}
    {% set _   = self.__setattr__('printer', printer.printer) %}
    {% set glb = self.printer.__class__.__init__.__globals__ %}
    {% set import = glb.importlib.import_module %}
    {% set math   = import('math') %}

    {%- macro fil_v(line_v=0.0) -%}
        {%- set fd = printer.pa_test.filament_diameter or 1.75 -%}
        {%- set nz = printer.pa_test.get('nozzle', 0.4) -%}
        {%- set lh = printer.pa_test.get('layer_height', nz/2.0) -%}
        {%- set Afil = 3.14159265359*(fd/2.0)**2 -%}
        {%- set Aline = nz*lh -%}
        { (line_v*Aline)/Afil }
    {%- endmacro -%}

    {% set extr  = printer[printer.toolhead.extruder] %}
    {% set la0   = (extr.linear_advance            or 0.0)|float %}
    {% set nlo0  = (extr.nonlinear_offset          or 0.0)|float %}
    {% set vlin0 = (extr.linearization_velocity    or 1.0)|float %}

    {% set vS = fil_v(printer.pa_test.slow_velocity   or 20.0)|float %}
    {% set vM = fil_v(printer.pa_test.medium_velocity or 120.0)|float %}
    {% set vF = fil_v(printer.pa_test.fast_velocity   or 250.0)|float %}

    # window auto from medium; clamp to sane domain #}
    {% set vmin = [0.4, 0.6*vM]|max %}
    {% set vmax = [1.8*vM, 5.0]|min %}
    {% if vmax < vmin + 1e-6 %}
        {% set vmax = vmin*1.4 %}
    {% endif %}

    # sample set and baseline targets computed once #}
    {% set V = [vS, vM, vF] %}
    {% set t0 = [math.tanh(vS/[EPS,vlin0]|max), math.tanh(vM/[EPS,vlin0]|max), math.tanh(vF/[EPS,vlin0]|max)] %}
    {% set Astar = [la0*vS + nlo0*t0[0], la0*vM + nlo0*t0[1], la0*vF + nlo0*t0[2]] %}

    # automatic weights: derivative of tanh gives leverage near the knee #}
    {% set w = [] %}
    {% for vv in V %}
        {% set x = vv/[EPS,vlin0]|max %}
        {% set sech2 = 1.0/(math.cosh(x)**2) %}
        {% set _ = w.append(0.5 + 1.5*sech2) %}
    {% endfor %}
    # bias medium a bit more #}
    {% set w = [w[0], w[1]*1.3, w[2]] %}

    # ridge toward baseline LA to keep it physical but flexible #}
    {% set LAMBDA = 0.40 %}

    {% set steps = params.get('STEPS', steps)|int %}
    {% set steps = [2, steps]|max %}

    { action_respond_info("AUTO vlin window=" ~ vmin|round(4) ~ "→" ~ vmax|round(4)
        ~ "  samples(fil)=" ~ vS|round(4) ~ "," ~ vM|round(4) ~ "," ~ vF|round(4)
        ~ "  base: la=" ~ la0|round(6) ~ " nlo=" ~ nlo0|round(6) ~ " vlin=" ~ vlin0|round(6)) }

    {% for i in range(steps) %}
        {% set nlov = i/(steps-1.0) %}
        {% set vlin = vmin * ((vmax/vmin)**nlov) %}
        {% set t = [math.tanh(vS/[EPS,vlin]|max), math.tanh(vM/[EPS,vlin]|max), math.tanh(vF/[EPS,vlin]|max)] %}

        # normal equations with ridge on la #}
        {% set a11 = w[0]*vS*vS + w[1]*vM*vM + w[2]*vF*vF + LAMBDA %}
        {% set a12 = w[0]*vS*t[0] + w[1]*vM*t[1] + w[2]*vF*t[2] %}
        {% set a22 = w[0]*t[0]*t[0] + w[1]*t[1]*t[1] + w[2]*t[2]*t[2] %}
        {% set b1  = w[0]*Astar[0]*vS + w[1]*Astar[1]*vM + w[2]*Astar[2]*vF + LAMBDA*la0 %}
        {% set b2  = w[0]*Astar[0]*t[0] + w[1]*Astar[1]*t[1] + w[2]*Astar[2]*t[2] %}
        {% set det = a11*a22 - a12*a12 %}
        {% if det|abs < 1e-9 %}
            { action_respond_info("• nlov=" ~ nlov|round(5) ~ " vlin=" ~ vlin|round(6) ~ " ill-conditioned") }
        {% else %}
            {% set la  = ( b1*a22 - a12*b2 ) / det %}
            {% set nlo = ( a11*b2 - a12*b1 ) / det %}
            {% set la  = [0.002, la]|max %}
            {% set nlo = [0.0,   nlo]|max %}
            { action_respond_info("• nlov=" ~ nlov|round(5)
                                  ~ "  vlin=" ~ vlin|round(6)
                                  ~ "  la=" ~ la|round(6)
                                  ~ "  nlo=" ~ nlo|round(6)
                                  ~ "  tS=" ~ t[0]|round(3) ~ " tM=" ~ t[1]|round(3) ~ " tF=" ~ t[2]|round(3)) }
        {% endif %}
    {% endfor %}




[gcode_macro _OLD_SET_PA_CORR]
gcode:
    {% set EPS = 1e-9 %}

    {%- macro filament_velocity(line_speed=0.0) -%}
        {%- set fil_diam      = printer.pa_test.filament_diameter or 1.75 -%}
        {%- set nozzle        = printer.pa_test.get('nozzle', 0.4) -%}
        {%- set layer_height  = printer.pa_test.get('layer_height', nozzle / 2.0) -%}
        {%- set filament_area = 3.14159265359 * (fil_diam/2.0)**2 -%}
        {%- set line_area     = nozzle * layer_height -%}
        { (line_speed * line_area) / filament_area }
    {%- endmacro -%}

    {% set NLOV   = params.get('NLOV', None)|float(None) %}
    {% if NLOV is none or NLOV > 1 or NLOV < 0 %}
        {action_respond_info('please provide valid \'NLOV\'')}
    {% else %}
        {% set _   = self.__setattr__('printer', printer.printer) %}
        {% set glb = self.printer.__class__.__init__.__globals__ %}
        {% set import = glb.importlib.import_module %}
        {% set math   = import('math') %}

        {% set extr  = printer[printer.toolhead.extruder] %}
        {% set runpa = printer['gcode_macro RUN_PA_TEST'] or {} %}

        {% set vel_min = runpa.ranges.velocity.start or 0.5 %}
        {% set vel_max = runpa.ranges.velocity.stop  or 5.0 %}

        {% set vlin_old = (extr.linearization_velocity or 1.0)|float %}
        {% set nlo_old  = (extr.nonlinear_offset       or 0.0)|float %}
        {% set la       = (params.ADVANCE or extr.linear_advance or 0.0)|float %}

        {% set ANCHOR = (params.get('ANCHOR','FAST')|string).upper() %}
        {% set HEAD_V = params.get('HEAD_V', None)|float(None) %}
        {% if HEAD_V is not none %}
            {% set head_speed = HEAD_V %}
        {% elif ANCHOR in ['SLOW','LOW'] %}
            {% set head_speed = printer.pa_test.slow_velocity or 20.0 %}
        {% elif ANCHOR in ['MID','MED','MEDIUM'] %}
            {% set head_speed = printer.pa_test.medium_velocity or 120.0 %}
        {% else %}
            {% set head_speed = printer.pa_test.fast_velocity or 250.0 %}
        {% endif %}

        {% set Vstar = filament_velocity(line_speed=head_speed)|float %}
        {% set vlin_new = vel_min * ((vel_max / vel_min)**NLOV) %}

        {% set told = math.tanh(Vstar / [EPS, vlin_old]|max) %}
        {% set Astar_old = la*Vstar + nlo_old*told %}

        {% set tnew = math.tanh(Vstar / [EPS, vlin_new]|max) %}
        {% set nlo_new = 0.0 if tnew|abs < EPS else (Astar_old - la*Vstar) / tnew %}

        {% set label = ('HEAD_V=' ~ ('%.3f' % head_speed)) if HEAD_V is not none else ANCHOR %}
        SET_PRESSURE_ADVANCE VELOCITY={ vlin_new|round(6) } OFFSET={ nlo_new|round(6) }
        { action_respond_info("PA corr (" ~ label ~ ") -> VLIN=" ~ vlin_new|round(5)
                            ~ "  NLO=" ~ nlo_new|round(5) ~ "  | LA=" ~ la|round(5)
                            ~ "  V*=" ~ Vstar|round(5) ) }

    {% endif %}



[gcode_macro _PA_TUNE]
description: One-macro PA toolkit with internal {% macro %} helpers
variable_anchor_v: 0.0          # filament velocity at anchor (mm/s)
variable_anchor_a: 0.0          # anchored mm advance A*(Vref)
variable_anchor_tag: '—'
gcode:
    {% set _   = self.__setattr__('printer', printer.printer) %}
    {% set glb = self.printer.__class__.__init__.__globals__ %}
    {% set import = glb.importlib.import_module %}
    {% set math = import('math') %}

    {%- macro filament_velocity(line_speed=0.0) -%}
        {%- set fil_diam      = printer.pa_test.filament_diameter or 1.75 -%}
        {%- set nozzle        = printer.pa_test.get('nozzle', 0.4) -%}
        {%- set layer_height  = printer.pa_test.get('layer_height', nozzle / 2.0) -%}
        {%- set filament_area = 3.14159265359 * (fil_diam/2.0)**2 -%}
        {%- set line_area     = nozzle * layer_height -%}
        { (line_speed * line_area) / filament_area }
    {%- endmacro -%}

    {%- macro mm_advance_at(v, la, nlo, vlin) -%}
        { la * v + ( nlo * math.tanh( v / [1e-9, vlin]|max ) ) }
    {%- endmacro -%}


    {%- macro op_set_anchor(head_v=None, tag='anchor') -%}
        {% set extr = printer[printer.toolhead.extruder] %}
        {% set la   = extr.linear_advance %}
        {% set nlo  = extr.nonlinear_offset %}
        {% set vlin = extr.linearization_velocity %}

        {% set v = filament_velocity(line_speed=head_v or 0.0)|float %}
        {% if v <= 0.0 %}
            { action_respond_info("_PA_TUNE: SET_ANCHOR needs HEAD_V") }
        {% else %}
            {% set A = mm_advance_at(v=v, la=la, nlo=nlo, vlin=vlin)|float %}
            SET_GCODE_VARIABLE MACRO=_PA_TUNE VARIABLE=anchor_v VALUE="{v}"
            SET_GCODE_VARIABLE MACRO=_PA_TUNE VARIABLE=anchor_a VALUE="{A}"
            SET_GCODE_VARIABLE MACRO=_PA_TUNE VARIABLE=anchor_tag VALUE="'{tag}'"
            { action_respond_info("_PA_TUNE: anchor set tag=" ~ tag ~ "  Vref=" ~ (v|round(5)) ~ "  A*=" ~ (A|round(5))) }
        {% endif %}
    {%- endmacro -%}

    {%- macro op_bump_high_keep_mid(scale=None, delta=None) -%}
        {% set extr = printer[printer.toolhead.extruder] %}
        {% set la   = extr.linear_advance %}
        {% set nlo  = extr.nonlinear_offset %}
        {% set vlin = extr.linearization_velocity %}
        {% set vref = params.get('VREF', printer['gcode_macro _PA_TUNE'].anchor_v) %}
        {% set Astar= printer['gcode_macro _PA_TUNE'].anchor_a %}

        {% if vref <= 0.0 %}
            { action_respond_info("_PA_TUNE: set anchor first (SET_ANCHOR)") }
        {% else %}
            {% set la_new = (la * (scale or 1.0)) + (delta or 0.0) if scale is not none or delta is not none else la %}
            {% set denom  = math.tanh( vref / [1e-9, vlin]|max ) %}
            {% set denom  = [1e-9, denom]|max %}
            {% set nlo_new = (Astar - la_new * vref) / denom %}
            SET_PRESSURE_ADVANCE ADVANCE={la_new|round(6)} OFFSET={nlo_new|round(6)} VELOCITY={vlin|round(6)}
            { action_respond_info("_PA_TUNE: HIGH bump keep MID | LA=" ~ la ~ "→" ~ la_new|round(6)
                                  ~ "  NLO=" ~ nlo ~ "→" ~ nlo_new|round(6)
                                  ~ "  VLIN=" ~ vlin|round(6) ~ "  @Vref=" ~ vref|round(5)
                                  ~ "  A*=" ~ Astar|round(5)) }
        {% endif %}
    {%- endmacro -%}

    {%- macro op_bump_low_keep_mid(vlin_scale=None, vlin_set=None) -%}
        {% set extr = printer[printer.toolhead.extruder] %}
        {% set la   = extr.linear_advance %}
        {% set nlo  = extr.nonlinear_offset %}
        {% set vlin = extr.linearization_velocity %}
        {% set vref = params.get('VREF', printer['gcode_macro _PA_TUNE'].anchor_v) %}
        {% set Astar= printer['gcode_macro _PA_TUNE'].anchor_a|float %}

        {% if vref <= 0.0 %}
            { action_respond_info("_PA_TUNE: set anchor first (SET_ANCHOR)") }
        {% else %}
            {% set vlin_new = (vlin * (vlin_scale or 1.0)) if vlin_scale is not none else (vlin_set if vlin_set is not none else vlin) %}
            {% set denom    = math.tanh( vref / [1e-9, vlin_new]|max ) %}
            {% set denom    = [1e-9, denom]|max %}
            {% set nlo_new  = (Astar - la * vref) / denom %}
            SET_PRESSURE_ADVANCE ADVANCE={la|round(6)} OFFSET={nlo_new|round(6)} VELOCITY={vlin_new|round(6)}
            { action_respond_info("_PA_TUNE: LOW bump keep MID | VLIN=" ~ vlin ~ "→" ~ vlin_new|round(6)
                                  ~ "  NLO=" ~ nlo ~ "→" ~ nlo_new|round(6)
                                  ~ "  LA=" ~ la|round(6) ~ "  @Vref=" ~ vref|round(5)
                                  ~ "  A*=" ~ Astar|round(5)) }
        {% endif %}
    {%- endmacro -%}

    {%- macro op_shape_mid_keep_high(vlin_scale=None, vlin_set=None) -%}
        {% set extr = printer[printer.toolhead.extruder] %}
        {% set la   = extr.linear_advance|float %}
        {% set nlo  = extr.nonlinear_offset|float %}
        {% set vlin = extr.linearization_velocity|float %}
        {% set vref = params.get('VREF', printer['gcode_macro _PA_TUNE'].anchor_v)|float %}
        {% set Astar= printer['gcode_macro _PA_TUNE'].anchor_a|float %}

        {% if vref <= 0.0 %}
            { action_respond_info("_PA_TUNE: set a HIGH-speed anchor first") }
        {% else %}
            {% set vlin_new = (vlin * (vlin_scale or 1.0)) if vlin_scale is not none else (vlin_set if vlin_set is not none else vlin) %}
            {% set denom    = math.tanh( vref / [1e-9, vlin_new]|max ) %}
            {% set denom    = [1e-9, denom]|max %}
            {% set nlo_new  = (Astar - la * vref) / denom %}
            SET_PRESSURE_ADVANCE ADVANCE={la|round(6)} OFFSET={nlo_new|round(6)} VELOCITY={vlin_new|round(6)}
            { action_respond_info("_PA_TUNE: shape MID keep HIGH | VLIN=" ~ vlin ~ "→" ~ vlin_new|round(6)
                                  ~ "  NLO=" ~ nlo ~ "→" ~ nlo_new|round(6)
                                  ~ "  LA=" ~ la|round(6) ~ "  @Vref=" ~ vref|round(5)
                                  ~ "  A*=" ~ Astar|round(5)) }
        {% endif %}
    {%- endmacro -%}

    {% set MODE = (params.get('MODE','')|string).upper() %}
    {% if MODE == 'SET_ANCHOR' %}
        {% set HEAD_V = params.get('HEAD_V', None)|float(None) %}
        {% set TAG    = params.get('TAG', 'anchor') %}
        { op_set_anchor(head_v=HEAD_V, tag=TAG) }

    {% elif MODE == 'BUMP_HIGH' %}
        {% set SCALE = params.get('SCALE', None)|float(None) %}
        {% set DELTA = params.get('DELTA', None)|float(None) %}
        { op_bump_high_keep_mid(scale=SCALE, delta=DELTA) }

    {% elif MODE == 'BUMP_LOW' %}
        {% set VLS   = params.get('VLIN_SCALE', None)|float(None) %}
        {% set VSET  = params.get('VLIN_SET',   None)|float(None) %}
        { op_bump_low_keep_mid(vlin_scale=VLS, vlin_set=VSET) }

    {% elif MODE == 'SHAPE_MID' %}
        {% set VLS   = params.get('VLIN_SCALE', None)|float(None) %}
        {% set VSET  = params.get('VLIN_SET',   None)|float(None) %}
        { op_shape_mid_keep_high(vlin_scale=VLS, vlin_set=VSET) }

    {% else %}
        { action_respond_info("_PA_TUNE usage:\n"
                              ~ "  _PA_TUNE MODE=SET_ANCHOR HEAD_V=120 TAG=mid  (or FIL_V=9.9)\n"
                              ~ "  _PA_TUNE MODE=BUMP_HIGH SCALE=0.97           (keeps mid pinned)\n"
                              ~ "  _PA_TUNE MODE=BUMP_LOW  VLIN_SCALE=0.85       (keeps mid pinned)\n"
                              ~ "  _PA_TUNE MODE=SHAPE_MID VLIN_SCALE=1.15       (keep high pinned; set high anchor first)") }
    {% endif %}



[gcode_macro _FIT_TANH]
gcode:

    {% set _   = self.__setattr__('printer', printer.printer) %}
    {% set glb = self.printer.__class__.__init__.__globals__ %}

    {% set bi = glb['__builtins__'] %}
    {% set bd = bi if bi is mapping else bi.__dict__ if bi.__dict__ else {} %}
    {% set _  = self._TemplateReference__context.vars.update(bd) if not float %}

    {% set import = glb.importlib.import_module %}
    {% set math   = import('math') %}
    {% set atanh  = math.atanh %}
    {% set np     = import('numpy') %}

    {%- macro r(val=None) -%} { val|float(0)|round(5) } {%- endmacro -%}

    {%- macro fit_tanh(v1, v2, v3, p1, p2, p3) -%}
        {%- set la = p1 / v1 -%}
        {%- set nlo = p3 - la * v3 -%}
        {%- set f = (p2 - la * v2) / nlo -%}
        {%- set vlin = v2 / atanh(f) -%}
        { r(la) ~ '\n' ~ r(nlo) ~ '\n' ~ r(vlin) }
    {%- endmacro -%}

    {%- macro convert_adaptive_to_tanh(v, pa) -%}
        {%- set v  = np.asarray(v,  float).ravel() -%}
        {%- set pa = np.asarray(pa, float).ravel() -%}
        {%- if v.ndim != 1 or pa.ndim != 1 or v.size != pa.size or v.size < 3 -%}
            { 'NaN\nNaN\nNaN' }
        {%- else -%}
            {%- set idx = np.argsort(v) -%}
            {%- set v, pa = v[idx], pa[idx] -%}
            {%- set k = (3 if v.size >= 3 else v.size) -%}
            {%- set la, _ = np.polyfit(v[:k], pa[:k], 1) -%}
            {%- set nlo = (pa[-1] - la * v[-1]) -%}
            {%- set mid = v.size // 2 -%}
            {%- set f = (pa[mid] - la * v[mid]) / nlo -%}
            {%- set f = float(np.clip(f, -0.99, 0.99)) -%}
            {%- set vlin = abs(v[mid] / atanh(f)) -%}
            { r(la) ~ '\n' ~ r(nlo) ~ '\n' ~ r(vlin) }
        {%- endif -%}
    {%- endmacro -%}

    {% macro parse_data(parsed_data_out) %}
        {% for name, data in printer['gcode_macro _PA_DATA_STORAGE'].items() %}
            {% set lines = (data|replace('|', '\n')).strip().split('\n') %}
            {% set d_pa, d_flow, d_accel = [], [], [] %}
            {% for line in lines %}
                {% set items = line.strip().split(',') %}
                {% if items|length == 3 and items[0]|float(0.0) > 0.001 %}
                    {% set _ = d_pa.append(items[0]|float) %}
                    {% set _ = d_flow.append(items[1]|float) %}
                    {% set _ = d_accel.append(items[2]|float) %}
                {% endif %}
            {% endfor %}
            {% if d_pa %}
                {% set _ = parsed_data_out.append({'name': name, 'pa': d_pa, 'flow': d_flow, 'accel': d_accel}) %}
            {% endif %}
        {% endfor %}
    {%- endmacro -%}

    {%- macro render_fit_table(data_list) -%}
        {%- set c_border = 'var(--p-border, rgb(63,65,67))' -%}
        {%- set c_bg     = 'var(--p-background-darker, rgb(24,25,26))' -%}
        {%- set c_bg_hdr = 'var(--p-background-dark, rgb(28,30,32))' -%}
        {%- set c_warn   = 'var(--v-warning-base, var(--p-warning-base, rgb(250,104,49)))' -%}
        {%- set c_group  = 'var(--v-accent-base, rgb(255,64,129))' -%}

        {%- set html = [] -%}
        {%- set _ = html.append('<div style="display:inline-grid;grid-auto-flow:row;gap:8px;place-items:start;inline-size:auto">') -%}

        {%- set _ = html.append(
            '<style>'
            ~ '.fitwrap{display:inline-block;vertical-align:top;margin:4px 6px;padding:0;}'
            ~ '.fitname{display:block;text-align:center;margin:0 0 2px 0;font-weight:600;}'
            ~ '.fitaccent{inline-size:100%;block-size:2px;background:' ~ c_group ~ ';margin:0 0 4px 0;border-radius:2px;}'
            ~ '.fittable{border-collapse:collapse;background:transparent;}'
            ~ '.fittable thead th{background:' ~ c_bg_hdr ~ ';border:1px solid ' ~ c_border ~ ';padding:2px 6px;white-space:nowrap;text-align:left;}'
            ~ '.fittable thead th:hover{color:' ~ c_warn ~ ';}'
            ~ '.fittable tbody td{border:1px solid ' ~ c_border ~ ';background:' ~ c_bg ~ ';padding:3px 6px;white-space:nowrap;}'
            ~ '.fittable tbody tr:hover td{color:' ~ c_warn ~ ';}'
            ~ '.num{font-variant-numeric:tabular-nums;text-align:right;}'
            ~ '.num-flow{display:inline-block;min-inline-size:7ch;text-align:right;}'
            ~ '</style>'
        ) -%}

        {%- for data in data_list if data and data.flow and data.pa -%}
            {%- set flows = {} -%}
            {%- for i in range(data.flow|length) -%}
                {%- set key = (data.flow[i]|float)|round(3) -%}
                {%- set _ = flows.update({ key: (flows.get(key, []) + [i]) }) -%}
            {%- endfor -%}

            {%- set rows = [] -%}
            {%- for flow in (flows.keys()|list)|sort -%}
                {%- set idxs = flows[flow] -%}
                {%- set vlist = [] -%}
                {%- set palist = [] -%}
                {%- for j in idxs -%}
                    {%- set _ = vlist.append((data.flow[j]|float) / (3.141592653589793 * (1.75*1.75) / 4.0)) -%}
                    {%- set _ = palist.append(data.pa[j]|float) -%}
                {%- endfor -%}
                {%- set parts = convert_adaptive_to_tanh(vlist, palist).strip().split('\n') -%}
                {%- set la   = parts[0]|float -%}
                {%- set nlo  = parts[1]|float -%}
                {%- set vlin = parts[2]|float -%}
                {%- set _ = rows.append({'flow':flow, 'la':la, 'nlo':nlo, 'vlin':vlin}) -%}
            {%- endfor -%}

            {%- if rows|length > 0 -%}
                {%- set name = data.name if 'name' in data else 'dataset' ~ loop.index -%}
                {%- set _ = html.append('<div class="fitwrap">') -%}
                {%- set _ = html.append('<div class="fitname">' ~ name ~ '</div><div class="fitaccent"></div>') -%}
                {%- set _ = html.append('<table class="fittable"><thead><tr>'
                    ~ '<th>flow</th>'
                    ~ '<th>la</th>'
                    ~ '<th>nlo</th>'
                    ~ '<th>vlin</th>'
                    ~ '</tr></thead><tbody>') -%}

                {%- for row in rows -%}
                    {%- set _ = html.append(
                        '<tr>'
                        ~ '<td class="num"><span class="num-flow">' ~ ('%.3f' % (row.flow|float)) ~ '</span></td>'
                        ~ '<td class="num">' ~ ('%.5f' % (row.la|float)) ~ '</td>'
                        ~ '<td class="num">' ~ ('%.5f' % (row.nlo|float)) ~ '</td>'
                        ~ '<td class="num">' ~ ('%.5f' % (row.vlin|float)) ~ '</td>'
                        ~ '</tr>'
                    ) -%}
                {%- endfor -%}

                {%- set _ = html.append('</tbody></table></div>') -%}
            {%- endif -%}
        {%- endfor -%}

        {%- set _ = html.append('</div>') -%}
        { html|join }
    {%- endmacro -%}

    {% set parsed_data = [] %}
    {% set _ = parse_data(parsed_data) %}
    {% set html = render_fit_table(parsed_data) %}
    #{ action_respond_info(html) }






[gcode_macro _PLOT_ADVANCE_MODEL]
gcode:
    {% set _   = self.__setattr__('printer', printer.printer) %}
    {% set glb = self.printer.__class__.__init__.__globals__ %}
    {% set import_mod = glb.importlib.import_module %}
    {% set io   = import_mod('io') %}
    {% set b64  = import_mod('base64') %}
    {% set np   = import_mod('numpy') %}
    {% set math = import_mod('math') %}
    {% set plt  = import_mod('matplotlib.pyplot') %}
    {% set bi   = glb['__builtins__'] %}
    {% set bd   = bi if bi is mapping else bi.__dict__ %}
    {% set _    = self._TemplateReference__context.vars.update(bd) %}

    # Parameters to visualize
    {% set la   = 0.002 %}
    {% set nlo  = 0.015 %}
    {% set vlin = 1.0 %}

    {% macro main() %}
        # Velocity domain
        {% set v = np.linspace(0.0, 20.0, 400) %}
        {% set A = la*v**2 + nlo*v*np.tanh(v / vlin) %}

        # Linear reference (for comparison)
        {% set A_lin = la*v**2 %}

        # Create figure
        {% set fig = plt.figure(figsize=(7.5,4.5), dpi=130) %}
        {% set ax  = fig.add_subplot(111) %}
        {% set _ = fig.patch.set_facecolor((0.13,0.13,0.13)) %}
        {% set _ = ax.set_facecolor((0.13,0.13,0.13)) %}
        {% set _ = ax.grid(True, which='both', alpha=0.3, color=(0.8,0.8,0.8)) %}
        {% set _ = ax.set_xlabel('Velocity v (mm/s)') %}
        {% set _ = ax.set_ylabel('Advance distance A(v) (mm)') %}
        {% set _ = ax.set_title('Nonlinear vs Linear Advance Model') %}
        {% set _ = ax.plot(v, A_lin, '--', color='tab:gray', alpha=0.8, label='Linear model') %}
        {% set _ = ax.plot(v, A, '-', linewidth=2.5, color='tab:orange', label='Nonlinear tanh model') %}
        {% set _ = ax.legend(loc='upper left', framealpha=0.25, fontsize=8) %}
        {% set _ = fig.tight_layout() %}

        # Encode SVG image
        {% set buf = io.BytesIO() %}
        {% set _ = fig.savefig(buf, format='svg', transparent=True, bbox_inches='tight') %}
        {% set _ = plt.close(fig) %}
        {% set svg = buf.getvalue() %}
        {% set img = 'data:image/svg+xml;base64,' ~ b64.b64encode(svg).decode() %}

        { action_respond_info(''
            ~ 'Model: la=' ~ la ~ ', nlo=' ~ nlo ~ ', vlin=' ~ vlin ~ '<br>'
            ~ '<img style="background-color:rgb(34,34,34);max-width:100%;" src="' ~ img ~ '"/>'
        ) }
    {% endmacro %}
    { main() }



[gcode_macro _FIT_TANH_PLOT]
gcode:
    {% set _   = self.__setattr__('printer', printer.printer) %}
    {% set glb = self.printer.__class__.__init__.__globals__ %}
    {% set bi = glb['__builtins__'] %}
    {% set bd = bi if bi is mapping else bi.__dict__ if bi.__dict__ else {} %}
    {% set _  = self._TemplateReference__context.vars.update(bd) %}
    {% set import_mod = glb.importlib.import_module %}
    {% set io         = import_mod('io') %}
    {% set b64        = import_mod('base64') %}
    {% set np         = import_mod('numpy') %}
    {% set math       = import_mod('math') %}
    {% set plt        = import_mod('matplotlib.pyplot') %}
    {% set mplot3d    = import_mod('mpl_toolkits.mplot3d') %}
    # bring in builtins so float(), etc. are bare names
    {% set bi = glb['__builtins__'] %}
    {% set bd = bi if bi is mapping else bi.__dict__ %}
    {% set _  = self._TemplateReference__context.vars.update(bd) %}
    {% set src = printer.printer.lookup_object('gcode_macro FIT_TANH', None) %}
    {% import src.template.template as conv with context %}
    {% set material_name = 'esun_abs_cf' %}
    # filament cross-section (1.75mm)
    {% set area = 3.141592653589793 * (1.75*1.75) / 4.0 %}

    {% macro main() %}
        # parse -> per-material arrays: vf, accel, pa
        {% set bymat = {} %}
        {% for name, data in printer['gcode_macro _PA_DATA_STORAGE'].items() %}
            {% set lines = (data|replace('|','\n')).strip().split('\n') %}
            {% for line in lines %}
                {% set it = line.strip().split(',') %}
                {% if it|length == 3 and (it[0]|float(0.0)) > 0.0 %}
                    {% set pa, flow, accel = it|map('trim')|map('float')|list %}
                    {% set vf    = flow / area %}
                    {% set slot = bymat.get(name, {'vf': [], 'acc': [], 'pa': []}) %}
                    {% set _ = slot.vf.append(vf) %}
                    {% set _ = slot.acc.append(accel) %}
                    {% set _ = slot.pa.append(pa) %}
                    {% set _ = bymat.update({name: slot}) %}
                {% endif %}
            {% endfor %}
        {% endfor %}

        # pick the requested material (fallback to first)
        {% set keys = bymat.keys()|list %}
        {% set mat  = material_name if material_name in bymat else (keys[0] if keys else None) %}
        {% if not mat %}
            { action_respond_info('No PA data found.') }
        {% else %}
            {% set arr = bymat[mat] %}
            {% set v = np.asarray(arr.vf,  float).ravel() %}
            {% set p = np.asarray(arr.pa,  float).ravel() %}
            {% set a = np.asarray(arr.acc, float).ravel() %}

            {% set idx = np.argsort(v) %}
            {% set v, p, a = v[idx], p[idx], a[idx] %}

            {% set la, nlo, vlin = conv.convert_adaptive_to_tanh(v, p).split('\n')|map('float')|list %}

            # ---- 3D scatter + “curtain” fit surface (PA capped at 0.1 for display) ----
            {% set fig3 = plt.figure(figsize=(7.5,5.2), dpi=130) %}
            {% set ax3  = fig3.add_subplot(111, projection='3d') %}
            {% set _ = fig3.patch.set_facecolor((0.13,0.13,0.13)) %}
            {% set _ = ax3.set_facecolor((0.13,0.13,0.13)) %}
            {% set _ = ax3.set_title('PA vs vf vs accel — ' ~ mat) %}
            {% set _ = ax3.set_xlabel('vf (mm/s)') %}
            {% set _ = ax3.set_ylabel('accel (mm/s²)') %}
            {% set _ = ax3.set_zlabel('PA') %}

            {% set _ = ax3.scatter(v, a, np.clip(p, 0.0, 0.1), s=14, alpha=0.9, color='tab:cyan') %}

            {% set vf_min = float(v.min()) %}
            {% set vf_max = float(v.max()) %}
            {% set ac_min = float(a.min()) %}
            {% set ac_max = float(a.max()) %}

            {% set vx = np.linspace(vf_min, vf_max, 120) %}
            {% set axline = np.linspace(ac_min, ac_max, 8) %}
            {% set V, Agrid = np.meshgrid(vx, axline) %}
            {% set Z = la*V + nlo*np.tanh(V / max(1e-9, vlin)) %}
            {% set Z = np.clip(Z, 0.0, 0.1) %}
            {% set _ = ax3.plot_surface(V, Agrid, Z, rstride=1, cstride=1, linewidth=0.2, antialiased=True, alpha=0.55, color='tab:orange') %}

            {% set buf3 = io.BytesIO() %}
            {% set _ = fig3.savefig(buf3, format='svg', transparent=True, bbox_inches='tight') %}
            {% set _ = plt.close(fig3) %}
            {% set svg3 = buf3.getvalue() %}
            {% set img3 = 'data:image/svg+xml;base64,' ~ b64.b64encode(svg3).decode() %}

            # ---- 2D slice: PA vs vf with model curve (sorted), also capped at 0.1 for display ----
            {% set fig2 = plt.figure(figsize=(7.2,4.4), dpi=130) %}
            {% set ax2  = fig2.add_subplot(111) %}
            {% set _ = fig2.patch.set_facecolor((0.13,0.13,0.13)) %}
            {% set _ = ax2.set_facecolor((0.13,0.13,0.13)) %}
            {% set _ = ax2.grid(True, which='both', alpha=0.28, color=(0.8,0.8,0.8)) %}
            {% set _ = ax2.set_xlabel('vf (mm/s)') %}
            {% set _ = ax2.set_ylabel('PA') %}
            {% set _ = ax2.set_title('tanh fit (global) — ' ~ mat) %}
            {% set _ = ax2.set_ylim(0.0, 0.1) %}

            {% set _ = ax2.scatter(v, np.clip(p, 0.0, 0.1), s=26, alpha=0.9, color='tab:cyan', edgecolors='none', label='data') %}
            {% set vx2 = np.linspace(vf_min, vf_max, 240) %}
            {% set py  = la*vx2 + nlo*np.tanh(vx2 / max(1e-9, vlin)) %}
            {% set py  = np.clip(py, 0.0, 0.1) %}
            {% set _   = ax2.plot(vx2, py, '-', linewidth=2.6, alpha=0.95, color='tab:orange', label='fit') %}
            {% set _   = ax2.legend(loc='upper right', framealpha=0.25, fontsize=8) %}
            {% set _   = fig2.tight_layout() %}

            {% set buf2 = io.BytesIO() %}
            {% set _ = fig2.savefig(buf2, format='svg', transparent=True, bbox_inches='tight') %}
            {% set _ = plt.close(fig2) %}
            {% set svg2 = buf2.getvalue() %}
            {% set img2 = 'data:image/svg+xml;base64,' ~ b64.b64encode(svg2).decode() %}

            { action_respond_info(''
                ~ 'Params for ' ~ mat ~ ': la=' ~ (la|round(5)) ~ ', nlo=' ~ (nlo|round(5)) ~ ', vlin=' ~ (vlin|round(5)) ~ '<br><br>'
                ~ '<b>3D view:</b><br>'
                ~ '<img style="background-color:rgb(34,34,34);max-width:100%;" src="' ~ img3 ~ '"/><br><br>'
                ~ '<b>2D slice:</b><br>'
                ~ '<img style="background-color:rgb(34,34,34);max-width:100%;" src="' ~ img2 ~ '"/>'
            ) }
        {% endif %}
    {% endmacro %}

    { main() }

