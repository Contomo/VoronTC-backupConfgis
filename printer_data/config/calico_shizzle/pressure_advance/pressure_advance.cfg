# FLOWRATES:
# PLA 0.965
# ASA 0.845
# ABS 0.938
# PETG 0.97
# ABS-CF 0.938

# Accel: 3000mm/s²
# 
# scv: 5 
# slow_v: 20
# medium_v: 120
# fast_velocity: 300
# 
# LEFT
# 9.56mm  | medium_v → slow_v 
# 13.81mm | slow_v → scv → slow_v 
# 6.41mm  | slow_v → medium
# 
# FRONT
# 9.7mm   | medium_v → 0(G4) → fast_v 
# 7.8mm   | fast_v → slow_v
# 4.7mm   | slow_v → fast_v
# 8.85mm  | fast_v → scv_v → fast_v
# 
# RIGHT
# 12.5mm  | medium_v → 0 → medium_v
# 
# BACK 
# 10.58mm | fast_v → 0(seam) → fast_v


# → 

# LEFT
# 8.36mm  | medium_v → slow_v 
# > 25mm  | slow_v → scv → slow_v 
# < 0mm   | slow_v → medium
# 
# FRONT
# 10.29mm | medium_v → 0(G4) → fast_v 
# 2mm     | fast_v → slow_v
# < 0mm   | slow_v → fast_v
# 10.3mm  | fast_v → scv_v → fast_v
# 
# RIGHT
# 25mm    | medium_v → 0 → medium_v
# 
# BACK 
# < 0mm   | fast_v → 0(seam) → fast_v




# 
#   slow_v → scv_v                                     
#  ┌───────┘   fast_v → medium_v                  medium_v → fast_v                  
#  │         ┌────────────────┘        ┌───────────────────┴─────────┐
#  │         ▼                         ▼                             │
#  │ ╔════════────────────+────────────════════╕◄─ fast_v → medium_v │
#  │ ║                    ▲                    │                     │
#  │ ║       seam(wipe)───┘                    │                     │
#  │ ║                          0 → medium_v   │                     │
#  │ │◄──┬─slow_v → medium_v           │(G4)   ║◄────────────────────┘
#  │ │   │                             │       ║  
#  └►+   │                             └──────►+    
#    │   │     slow_v → fast_v─┐               ║     
#    │◄──┘                     │               ║◄─ fast_v → medium_v    
#    ║      0 → fast_v         │ scv_v → fast_v│       
#    ║       │(G4)   ┌─────────┤       │       │       
#    ║       ▼       ▼         ▼       ▼       │       
#    ╙───────+───────═══════════───────+───────┘       
#           
#     scv == square corner velocity
#
# NLO ↔ LinVEL relates to "slow_v → scv_v" and "slow_v → medium_v"
# (left side, mid and right transition)
# raise LinVEL to shift "slow medium" transition down, lower LinVEL to to shift "slow scv" down.
# down being, lower NLO, goal is to get them on the same height for given NLO and LinVEL
#
#
#   G4 / scv_v ticks → best for smooth time/time offset
#
#   Acceleration step (e.g., slow_v → medium_v, medium_v → fast_v, 0 → medium_v, 0 → fast_v):
#   • start thin  ⇒ magnitude too low  or phase too late  → ↑LA or ↓TIME_OFFSET.
#   • start bulge ⇒ magnitude too high or phase too early → ↓LA or ↑TIME_OFFSET.
#   
#   Deceleration step (e.g., fast → medium, fast → slow):
#   • start bulge ⇒ too little/late back-off → ↑LA or ↓TIME_OFFSET.
#   • start thin  ⇒ too much/early  back-off → ↓LA or ↑TIME_OFFSET.

# Tuning tower with linear_advance
# 1. If the left side converges below the front side, then slightly decrease the nonlinear_offset
# 2. If the left side converges above the front side, then slightly increase the nonlinear_offset
# 3. If the left side converges at the same height as the front side, use linear_advance



# TANH
# correction = linear_advance x E_VEL + ( nonlinear_offset * tanh(E_VEL / linearization_velocity) )
#
# RECIP 
# correction = linear_advance * E_VEL + ( nonlinear_offset * ( 1 - 1 / (1 + E_VEL / linearization_velocity) ) )
# correction = linear_advance * E_VEL + ( nonlinear_offset * ( E_VEL / (E_VEL + linearization_velocity) ) )


### improved procedure:

# - 1 NLO, look at left side, primarily left left
# - 2 LA, look at front side (or right if needed) primarily 2nd bump *(front has 4: seam, fast→slow, slow→fast, fast→scv) wanna look at fast→slow*
# - *2.5 run a tower with time offset, either now or when youre done, 
#    it may make differences harder too see if you do it now, but if your results are horrid enough, run it now*
# - 3 binary search LA/NLO till equal **__(dont need to be perfect)__** equality ≥ perfection
# - 4 VLIN, left side middle *(slow → scv)* seam bulges out → lower VLIN and for an indent, raise VLIN
# - 5 if wanted, bounce between 3 ↔ 4
# 
# All other sections show the critical points over a larger "speed spectrum" but those mentioned points shows the cirtical points to control in isolation.












# higher speed → lower speed bulging out while the reverse is good:
# upper part of curve is too low, increase LA

# so:
# nibble with VLIN/NLO for seams

[pa_test]
size_x: 70          # X dimension tower size  (mm)
size_y: 56          # Y dimension tower size  (mm)
height: 25          # Height of tower (mm)
origin_x: 175       # Center of the bed in X
origin_y: 200       # Center of the bed in Y
layer_height: 0.2   # mm
first_layer_height: 0.2 # mm
perimeters: 2
brim_width: 2
brim_velocity:   175
slow_velocity:   20 # 10 # 20     # Slowest velocity for PA test segment (mm/s)
medium_velocity: 120 # 25 # 120    # Medium velocity for PA test segment (mm/s)
fast_velocity:  300 # 80 # 250     # End velocity for PA test segment (mm/s)
filament_diameter: 1.75

[gcode_macro RUN_PA_TEST]
description: 
variable_nozzle: 0.4
variable_bed_temp: 100 # 105 # 70 # 40 # 55 # 100 # 105
variable_target_temp: 255 # 250 # 250 # 215 # 255
variable_chamber_temp: 0 # 55 # 55
variable_flow_rate: 0.97 # 0.935 #0.97 # 0.938
variable_testparam: 0   # 0 = advance, 1 = offset, 2 = time_offset
variable_stack_testparam: 3
variable_stack_param: None
variable_tune: False # TUNE=1 → START

# RUN_PA_TEST HEIGHT=20 TESTPARAM=1 STACK_TESTPARAM=3 TUNE=1 STACK_COUNT=4

variable_stack_count: 1
variable_ranges: {
    'advance':     {'start': 0.000, 'stop': 0.080},# {'start': 0.005, 'stop': 0.035},
    'offset':      {'start': 0.000, 'stop': 0.500},
    'time_offset': {'start': 0.000, 'stop': 0.010},
    'velocity':    {'start': 0.500, 'stop': 3.000},
    'smooth_time': {'start': 0.005, 'stop': 0.050},
    'nlov':        {'start': 0.000, 'stop': 1.000},
    'scv':         {'start': 0.000, 'stop': 15.00},
    }
variable_tune_range:  {'min': -0.3, 'max': 0.3} # when tuning, instead of range, use  X%
variable_stack_range: {'min': -0.3, 'max': 0.3}
variable_original_values: {}

[pa_test]
start_gcode:
    SET_VELOCITY_LIMIT ACCEL=5000
    {% set n = pa_test.stack_count %}
    {% if n > 1 %}
        {% set base = params.get('STACK_BASE')|float %}
        {% set pct_min = printer['gcode_macro RUN_PA_TEST'].stack_range['min']|float %}
        {% set pct_max = printer['gcode_macro RUN_PA_TEST'].stack_range['max']|float %}
        {% set val = base * (1 + pct_min) %}
        { action_respond_info("Starting:\nstack 1/" ~ n ~ " — " ~ params.STACK_TESTPARAM ~ "=" ~ (val|round(6))) }
        SET_PRESSURE_ADVANCE {params.STACK_TESTPARAM}={val|round(6)}
    {% endif %}
    {% if params.PARAMETER|upper == 'NLOV' %}
        # TUNING_TOWER COMMAND=SET_PA_CORR PARAMETER={params.PARAMETER} START={params.START} FACTOR={params.FACTOR} {rawparams}
        TUNING_TOWER {rawparams} COMMAND=SET_PA_MATCH_SLOW_TT PARAMETER=NLOV START={params.START} FACTOR={params.FACTOR}
    {% elif params.PARAMETER|upper == 'SCV' %}
        TUNING_TOWER {rawparams} COMMAND=SET_VELOCITY_LIMIT PARAMETER=square_corner_velocity START={params.START} FACTOR={params.FACTOR}
    {% else %}
        TUNING_TOWER {rawparams} COMMAND=SET_PRESSURE_ADVANCE PARAMETER={params.PARAMETER} START={params.START} FACTOR={params.FACTOR}
    {% endif %}

stack_gcode:
    {% set i, n = pa_test.stack_index, pa_test.stack_count %}
    {% set base = params.get('STACK_BASE')|float %}
    {% set pct_min = printer['gcode_macro RUN_PA_TEST'].stack_range['min']|float %}
    {% set pct_max = printer['gcode_macro RUN_PA_TEST'].stack_range['max']|float %}
    {% set d = (pct_max - pct_min) / [1, n - 1]|max|float %}
    {% set pct = pct_min + d * i|float %}
    {% set val = base * (1.0 + pct) %}
    { action_respond_info("Stack " ~ (i + 1) ~ "/" ~ n ~ " — " ~ params.STACK_TESTPARAM ~ "=" ~ (val|round(6))) }
    { action_respond_info("stack debug: i=" ~ i ~ " base=" ~ base ~ " n=" ~ n ~ " min=" ~ pct_min ~ " max=" ~ pct_max ~ " d=" ~ d ~ " pct=" ~ pct) }
    SET_PRESSURE_ADVANCE {params.STACK_TESTPARAM}={val|round(6)}

    {% set skip = i * pa_test.height %}
    TUNING_TOWER COMMAND=SET_PRESSURE_ADVANCE PARAMETER={params.PARAMETER} START={params.START} FACTOR={params.FACTOR} SKIP={skip} {rawparams}

end_gcode:
    PRINT_END
    RESTORE_GCODE_STATE NAME=PA_TEST_STATE
    {% set prev = printer['gcode_macro RUN_PA_TEST'].original_values %}
    SET_PRESSURE_ADVANCE {prev|xmlattr}
    { action_respond_info("Restored PA values:" ~ prev|xmlattr|replace(' ', '\n - ') ) }

[gcode_macro RUN_PA_TEST]
gcode:
    {% set NAME = 'RUN_PA_TEST' %}
    {% set vars = printer['gcode_macro ' ~ NAME] %}
    {% set IDX_TO_PARAM = ranges.keys()|list %}

    # ──────────── The macro that runs as our "print start" -----------------------------------
    {% macro print_start() %}
        SET_HEATER_TEMPERATURE HEATER=chamber TARGET={vars.chamber_temp}
        M109 S{150}
        G28
        MOVE_TO_CENTER Z=2
        M140 S{vars.bed_temp}
        M106 S{255}
        CLEAN_NOZZLE
        M190 S{vars.bed_temp}
        {% if vars.chamber_temp and vars.chamber_temp >= 40 %}G4 P60000{% endif %}
        M107
        G32
        M109 S{vars.target_temp}
        { ('M221 S' ~ vars.flow_rate * 100.0) if vars.flow_rate > 0 else '' }
    {% endmacro %}

    {% set extr = printer[printer.toolhead.extruder] %}
    {% set base_map = {
        'advance': extr.linear_advance or 0.0,
        'offset': extr.nonlinear_offset or 0.0,
        'time_offset': extr.time_offset or 0.0,
        'smooth_time': extr.smooth_time or 0.0,
        'velocity': extr.linearization_velocity or 0.0,
    } %}

    # ──────────── Parse all the supplied parameters to vars ----------------------------------
    {% set w_key = params.keys()|map('lower')|select('in', vars.keys()|list)|list %}
    {% for key in w_key if key != 'ranges' %}
        {% set val = params.get(key|upper)|float(params.get(key|upper)) %}
        {% set _ = vars.update({key: val}) %}
        {% set _ = params.pop(key|upper, None) %}
        SET_GCODE_VARIABLE MACRO={NAME} VARIABLE={key} VALUE={% if val is string %}"'{val}'"{% else %}"{val}"{% endif %}
    {% endfor %}

    # ──────────── Calc/Overwrite start and stop/index ----------------------------------------
    {% set idx = vars.testparam|int if vars.testparam is number else IDX_TO_PARAM.index(vars.testparam|lower) %}
    {% set param = IDX_TO_PARAM[idx] %}

    {% if vars.tune|int(vars.tune)|string|lower in ['true', '1', '1.0', 'yes', 'enabled'] %}
        {% set b_val = base_map.get(param) %}
        {% set start = b_val + (b_val * tune_range['min']) %}
        {% set stop  = b_val + (b_val * tune_range['max']) %}
    {% else %}
        {% set start = params.get('START', vars.ranges.get(param).get('start'))|float %}
        {% set stop  = params.get('STOP',  vars.ranges.get(param).get('stop' ))|float %}
        {% set start = params.get('BEGIN', start)|float %}
        {% set stop  = params.get('END',    stop)|float %}
    {% endif %}

    {% set height = params.get('HEIGHT', printer.configfile.settings.pa_test.height)|float %}
    {% set factor = ((stop - start) / height)|round(5) %}

    # ──────────── kick off the print --------------------------------------------------------- 

    SAVE_GCODE_STATE NAME=PA_TEST_STATE
    { print_start() }

    {% set _ = vars.update({'stack_testparam': stack_param}) if stack_param %} # just so that stack_param is also valid
    {% set sidx = vars.stack_testparam|int if vars.stack_testparam is number else IDX_TO_PARAM.index(vars.stack_testparam|lower) %}
    {% set key = IDX_TO_PARAM[sidx] %}

    SET_GCODE_VARIABLE MACRO=RUN_PA_TEST VARIABLE=original_values VALUE="{base_map}"
    PRINT_PA_TOWER {   params|xmlattr ~
                     ' NOZZLE=' ~ vars.nozzle ~
                     ' TARGET_TEMP=' ~ vars.target_temp ~
                     ' STACK_COUNT=' ~ vars.stack_count|int ~
                     ' PARAMETER=' ~ param ~
                     ' START=' ~ start ~
                     ' FACTOR=' ~ factor ~
                     ' STACK_TESTPARAM=' ~ key ~
                     ' STACK_BASE=' ~ base_map[key] or None ~
                     ' STACK_MIN_PCT=' ~ vars.stack_range['min'] ~
                     ' STACK_MAX_PCT=' ~ vars.stack_range['max'] }

    # ──────────── lil box cause i always forget ---------------------------------------------- 
    {% set script = namespace(block='') %}
    {% set script.block %}{% raw %}
    <span style="color: var(--v-accent-base); font-weight:bold;" title="§§DESC§§">§§NAME§§ </span>
    <span style="color: var(--p-text-color);" title="§§DESC§§">§§MESSAGE§§</span>
    <div class="val-box" style="max-width:100%; width:fit-content;
        background:var(--p-background-darker); border:2px solid var(--p-border);
        border-radius:6px; padding:.5em .75em; box-sizing:border-box; margin-top:.25em;">

        <div style="margin:0 0 .25em 0;">
            calc: <code>value = start + factor × local_mm</code> ·
            local_mm and stack are derived from <code>Z</code> (global height)
        </div>

        <div class="val-row" style="display:flex; gap:.75em; align-items:center; flex-wrap:wrap;"
            data-start="§§START§§" data-factor="§§FACTOR§§" data-key="§§KEY§§"
            data-height="§§HEIGHT§§" data-scount="§§SCOUNT§§">
            <div>Z (0→§§ZMAX§§ mm):
                <input class="z-input" type="number" inputmode="decimal" step="0.1" min="0" max="§§ZMAX§§" value="0"
                    style="width:7.5em; padding:.2em .45em; background:transparent; color:inherit;
                        border:1px solid var(--p-border); border-radius:4px;">
            </div>
            <div>stack:<code class="stack-no" style="font:inherit;">1</code></div>
            <div>local&nbsp;mm:<code class="local-mm" style="font:inherit;">0.0000</code></div>
            <div>value:&thinsp;
                <code class="val copyable" title="copy" style="font:inherit; cursor:pointer; user-select:text;">—</code>
            </div>
        </div>

        <div class="stack-row" style="display:flex; gap:.75em; align-items:center; flex-wrap:wrap; margin-top:.35em;"
            data-scount="§§SCOUNT§§" data-smin="§§SMIN§§" data-smax="§§SMAX§§" data-sbase="§§SBASE§§"
            data-height="§§HEIGHT§§" data-skey="§§SKEY§§">
            <div>pct:&thinsp;<code class="spct" style="font:inherit;">—</code></div>
            <div>skip:&thinsp;<code class="sskip" style="font:inherit;">—</code></div>
            <div>§§SPARAM§§:&thinsp;
                <code class="sval copyable" title="copy" style="font:inherit; cursor:pointer; user-select:text;">—</code>
            </div>
        </div>

        <div style="margin-top:.25em; opacity:.75; font-size:.9em;">
            <i>(adjusting: §§PARAM§§ from §§START§§ → §§STOP§§ over §§HEIGHT§§ mm per stack;
            stack param: §§SPARAM§§, base=§§SBASE§§, min=§§SMIN§§, max=§§SMAX§§, n=§§SCOUNT§§)</i>
        </div>

        <img src="x" alt="" style="width:0;height:0;opacity:0;pointer-events:none"
        onerror="(function(img){
            try{
                var box=img.closest('.val-box'); if(!box) return;
                if(img.dataset.bound==='1') return; img.dataset.bound='1';

                function n(v){ v=(v==null?'':String(v)).replace(',', '.'); v=parseFloat(v); return isFinite(v)?v:0; }
                function r1(x){ return (Math.round(x*10)/10).toFixed(1); }
                function r2(x){ return (Math.round(x*100)/100).toFixed(2); }
                function r4(x){ return (Math.round(x*10000)/10000).toFixed(4); }

                function makeCopyable(el){
                    if(!el) return;
                    if(!el.title){ el.title='copy'; }
                    el.addEventListener('click', function(){
                        try{
                            var text = el.textContent || '';
                            function fallbackCopy(t){
                                try{
                                    var ta=document.createElement('textarea');
                                    ta.value=t; ta.setAttribute('readonly','');
                                    ta.style.position='fixed'; ta.style.opacity='0'; ta.style.left='-9999px';
                                    document.body.appendChild(ta); ta.focus(); ta.select();
                                    var ok=document.execCommand('copy'); document.body.removeChild(ta); return !!ok;
                                }catch(e){ return false; }
                            }
                            if (window.isSecureContext && navigator.clipboard && navigator.clipboard.writeText){
                                navigator.clipboard.writeText(text).catch(function(){ fallbackCopy(text); });
                            } else { fallbackCopy(text); }

                            var parent=el.parentNode;
                            if (getComputedStyle(parent).position === 'static') { parent.style.position='relative'; }
                            var tag=parent.querySelector('.copy-badge');
                            if (!tag){
                                tag=document.createElement('span');
                                tag.className='copy-badge';
                                tag.textContent='copied';
                                tag.style.position='absolute';
                                tag.style.right='0';
                                tag.style.top='-1.1em';
                                tag.style.padding='0 .35em';
                                tag.style.border='1px solid var(--p-border)';
                                tag.style.borderRadius='4px';
                                tag.style.fontSize='.85em';
                                tag.style.background='var(--p-background-darker)';
                                tag.style.opacity='0';
                                tag.style.pointerEvents='none';
                                tag.style.transition='opacity 150ms ease';
                                parent.appendChild(tag);
                            }
                            tag.style.opacity='1';
                            clearTimeout(tag._t);
                            tag._t=setTimeout(function(){ tag.style.opacity='0'; }, 850);
                        }catch(_){}
                    });
                }

                var row=box.querySelector('.val-row');
                var zIn=row.querySelector('input.z-input');
                var out=row.querySelector('.val');
                var stackNo=row.querySelector('.stack-no');
                var localMM=row.querySelector('.local-mm');

                var start=Number(row.getAttribute('data-start'))||0;
                var factor=Number(row.getAttribute('data-factor'))||0;
                var height=Number(row.getAttribute('data-height'))||0;
                var scount=Math.max(1, Number(row.getAttribute('data-scount'))||1);
                var zkey=(row.getAttribute('data-key')||'valcalc')+'::z';

                var srow=box.querySelector('.stack-row');
                var spct=srow.querySelector('.spct');
                var sskip=srow.querySelector('.sskip');
                var sout=srow.querySelector('.sval');
                var smin=Number(srow.getAttribute('data-smin'))||0;
                var smax=Number(srow.getAttribute('data-smax'))||0;
                var sbase=Number(srow.getAttribute('data-sbase'))||0;

                var total=height*scount;
                function clampZ(z){ z=n(z); if(!isFinite(z)||z<0) z=0; if(z>total) z=total; return z; }

                function update(){
                    var z=clampZ(zIn.value);
                    zIn.value=String(z);
                    var st=Math.min(scount, Math.floor(z/height)+1);
                    var local=z - (st-1)*height;
                    if(stackNo) stackNo.textContent=String(st);
                    if(localMM) localMM.textContent = r2(local);
                    out.textContent=r4(start + factor*local);

                    if(scount<=1){ srow.style.display='none'; }
                    else {
                        srow.style.display='';
                        var d=(smax - smin)/Math.max(1, scount-1);
                        var pct=smin + d*(st-1);
                        if(spct)  spct.textContent  = r1(pct*100) + '%';
                        if(sskip) sskip.textContent = r2((st-1)*height) + ' mm';
                        if(sout)  sout.textContent=r4(sbase*(1 + pct));
                    }
                }

                try{ var saved=localStorage.getItem(zkey); if(saved!==null){ zIn.value=saved; } }catch(_){}
                var t=null;
                function saveSoon(){ try{ clearTimeout(t); t=setTimeout(function(){ localStorage.setItem(zkey, String(zIn.value||'0')); },120);}catch(_){} }

                zIn.addEventListener('input', update);
                zIn.addEventListener('change', function(){ update(); saveSoon(); });

                makeCopyable(out);
                makeCopyable(sout);

                update();
            }catch(_){}
            try{img.remove();}catch(_){}
        })(this)">
    </div>
    {% endraw %}{% endset %}

    {% set _r = 3 %}
    {% set mapping = [
        ('§§NAME§§',    NAME),
        ('§§MESSAGE§§', 'Print starting now…'),
        ('§§DESC§§',    printer.configfile.settings['gcode_macro ' ~ NAME|lower].description|e),

        ('§§PARAM§§',   param),
        ('§§START§§',   start|round(_r)),
        ('§§FACTOR§§',  factor|round(_r+1)),
        ('§§STOP§§',    stop|round(_r)),
        ('§§HEIGHT§§',  height|round(_r-1)),
        ('§§KEY§§',     (NAME ~ '|' ~ param ~ '|' ~ printer.system_stats.cputime)),

        ('§§SCOUNT§§',  vars.stack_count|int),
        ('§§SMIN§§',    vars.stack_range['min']),
        ('§§SMAX§§',    vars.stack_range['max']),
        ('§§SBASE§§',   (base_map[key] or 0.0)),
        ('§§SPARAM§§',  key),
        ('§§SKEY§§',    (NAME ~ '|' ~ key ~ '|' ~ printer.system_stats.cputime)),

        ('§§ZMAX§§',    (height * vars.stack_count)|round(_r-1)),
    ] %}
    {% for ph, val in mapping %}
        {% set script.block = script.block|replace(ph, val|string) %}
    {% endfor %}
    { action_respond_info(script.block|replace('\n','')) }





