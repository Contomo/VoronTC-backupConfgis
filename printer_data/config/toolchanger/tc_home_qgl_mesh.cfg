[force_move]
enable_force_move: True

#SET_KINEMATIC_POSITION [X=<value>] [Y=<value>] [Z=<value>] [SET_HOMED=<[X][Y][Z]>] [CLEAR_HOMED=<[X][Y][Z]>]

[homing_override]
axes: xyz
gcode:
    {% import homing_helper      as hh        with context %}
    {% import toolchanger_helper as tch with context %}

    {% set p             = printer %}
    {% set cfg, th, tc   = p.configfile.settings, p.toolhead, p.toolchanger %}
    {% set tcs           = p['gcode_macro _toolchanger_settings'] %}
    {% set home_settings = tcs.get('homing', {}) %}
    {% set rand, safe_z  = home_settings.get('z_home_xy_random', 0), home_settings.get('xy_move_safe_z_height', 10) %}
    
    {% set max_x, max_y  = cfg.stepper_x.position_max, cfg.stepper_y.position_max %}
    {% set center_x      = (max_x / 2.0) + (range(rand * -10, rand * 10)|random / 10.0) %}
    {% set center_y      = (max_y / 2.0) + (range(rand * -10, rand * 10)|random / 10.0) %}

    {% set axes_to_home  = 'xyz' if not rawparams else (rawparams|lower) %}
    {% macro home() %}
        { tch.check_tc_status() }
        { tch.check_tn_actn() }

        {% if 'tool_probe_endstop' in printer %}
            {% set actn = printer.tool_probe_endstop.active_tool_number %}
        {% elif 'probe_multiplexer' in printer %}
            {% set actn = printer.probe_multiplexer.probe_number %}
        {% else %}
            {% set actn = printer.toolchanger.tool_number %}
        {% endif %}
        { tch.update_tool_probe_from_svf(actn, False) if 'probe_multiplexer' in printer and actn != -1 else '' }
        G90
        
        #── safely move away from docks if are close ────────────────────────────────────
        {% if 'z' in th.homed_axes and 'y' in th.homed_axes and min_y_distance_to_dock(th.position.y)|float < 100 %}
            G0 Z{3 + th.position.z} F{tc.params_fast_speed / 4}
            G0 Y{[tc.params_safe_y, th.position.y]|max} F{tc.params_fast_speed}
        {% endif %}

        {% if 'z' not in th.homed_axes and 'z' in axes_to_home %}
            # ---< home Z
            G28 Z
            G0 Z{safe_z}
        {% elif 'z' in th.homed_axes %}
            # ---< or come down from whereever we are
            G0 Z{safe_z} F{tc.params_fast_speed/4}
        {% endif %}

        {% if 'y' in axes_to_home %}
            G28 Y
        {% endif %}

        {% if 'x' in axes_to_home %}
            G28 X
        {% endif %}

        #── Home Z axis in the middle of the bed ────────────────────────────────────
        {% if 'z' in axes_to_home %}
            ROUNDED_G0 X={center_x} F={tc.params_fast_speed} D={cfg.stepper_x.position_max/4}
            ROUNDED_G0 Y={center_y} F={tc.params_fast_speed} D=0
            G28 Z
            _TC_ADJUST_HOME_OFFSET
        {% endif %}
        
        { tch.restore_vel() }
    {% endmacro %}

    {%- macro min_y_distance_to_dock(y_pos=0.0) -%}
        {%- set dock_ys = [] -%}
        {%- for tool in printer.toolchanger.tool_names -%}
            {%- set _ = dock_ys.append(printer[tool].params_park_y) if 'params_park_y' in printer[tool] -%}
        {%- endfor -%}
        { dock_ys|min if dock_ys else 9999 }
    {%- endmacro -%}

    {% if 'probe_multiplexer' in printer and printer.toolchanger.detected_tool_number not in printer.probe_multiplexer.probe_numbers and 'z' in axes_to_home %}
        MOVE_TO_CENTER
    {% else %}
        { home() }
    {% endif %}

[gcode_macro G32]
gcode:
    {% from toolchanger_helper import check_ok with context %}
    {check_ok()}
    QUAD_GANTRY_LEVEL
    MOVE_TO_CENTER
    G28




[gcode_macro QUAD_GANTRY_LEVEL]
rename_existing: _QUAD_GANTRY_LEVEL
description: "Fine/Coarse with rounded approach to first probe point"
variable_fine_move:          0.5    # your preferred fine-move height
variable_reduce_accel:       True   # disable if you dont like it i guess
variable_mm_away_from_docks: 90     # mm you want to rather do a little backmove before coming in (umbilical)
gcode:
    {% if toolchanger_helper %}
        {% import toolchanger_helper as tch with context %}
        { tch.check_ok() }
    {% endif %}

    {% set qg_cfg   = printer.configfile.settings.quad_gantry_level %}
    {% set fast     = printer.toolchanger.params_fast_speed or 10000 %}

    {% if 'tool_probe_endstop' in printer %}
        {% set act_z = printer.tool_probe_endstop.active_tool_probe_z_offset %}
    {% elif 'probe_multiplexer' in printer %}
        {% set act_z = printer.probe_multiplexer.z_offset %}
    {% else %}
        {% set act_z = 0.0 %}
    {% endif %}
    {% set tool_z   = printer[printer.toolchanger.tool].gcode_z_offset or 0.0 if printer.toolchanger.tool else 0.0 %}
    
    {% set cur      = printer.toolhead.position %}
    {% set is_level = printer.quad_gantry_level.applied %}

    {% macro qgl() %}
        G90
        {% set move_z = fine_move if is_level and not rawparams else qg_cfg.horizontal_move_z %}

        {% if cur[2] < [move_z, 2]|max %}
            ROUNDED_G0 Z={ [move_z, 2]|max } F={ fast / 4.0 } D=10
        {% endif %}

        # ---< select a pretty non tangling approach
        {% set pnt = qg_cfg.points[0] %}
        {% set dist_y = min_y_distance_to_dock(cur[1])|float %}
        {% if dist_y < mm_away_from_docks %}
            ROUNDED_G0 Y={ cur[1] + (mm_away_from_docks - dist_y) } F={ fast } D=100
            ROUNDED_G0 X={ pnt[0] } Y={ pnt[1] }    F={ fast } D=0
        {% elif cur[1] > pnt[1] %}
            ROUNDED_G0 X={ pnt[0] } F={ fast } D=100
            ROUNDED_G0 Y={ pnt[1] } F={ fast } D=0
        {% else %}
            ROUNDED_G0 Y={ pnt[1] } F={ fast } D=100
            ROUNDED_G0 X={ pnt[0] } F={ fast } D=0
        {% endif %}

        # ---< Decide 'coarse' -> 'fine' | just 'fine'
        {% if rawparams %}
            _QUAD_GANTRY_LEVEL { rawparams }
        {% elif not is_level %}
            _QUAD_GANTRY_LEVEL RETRY_TOLERANCE={ fine_move }
            _QUAD_GANTRY_LEVEL HORIZONTAL_MOVE_Z={ fine_move - act_z + tool_z }
            MOVE_TO_CENTER
        {% else %}
            _QUAD_GANTRY_LEVEL HORIZONTAL_MOVE_Z={ move_z - act_z + tool_z }
            MOVE_TO_CENTER
        {% endif %}  
    {% endmacro %}

    {%- macro min_y_distance_to_dock(y_pos=0.0) -%}
        {%- set dock_ys = [] -%}
        {%- for tool in printer.toolchanger.tool_names -%}
            {%- set _ = dock_ys.append(printer[tool].params_park_y) if 'params_park_y' in printer[tool] -%}
        {%- endfor -%}
        { (y_pos - dock_ys|max) if dock_ys else 9999 }
    {%- endmacro -%}

    { qgl() }


[gcode_macro PAIN_GANTRY_LEVEL]
description: "forgive me"
gcode:
    {% set z_steppers = [] %}
    {% for step in printer.motion_report.steppers if step.startswith('stepper_z') %}
        SET_TMC_CURRENT STEPPER={step} CURRENT=0.2
        {% set _ = z_steppers.append(step) %}
    {% endfor %}
    SET_KINEMATIC_POSITION Z=50
    G0 Z0 F600
    M400
    {% for obj in printer if obj.split() and obj.split()[1] in z_steppers %}
        SET_TMC_CURRENT STEPPER={obj.split()[1]} CURRENT={printer[obj].get('run_current')}
    {% endfor %}
    G0 Z10 F600


# BED_MESH_CALIBRATE PROFILE=<name> METHOD=[manual | automatic | scan | rapid_scan]
# [<probe_parameter>=<value>] [<mesh_parameter>=<value>] [ADAPTIVE=[0|1] [ADAPTIVE_MARGIN=<value>]

# BED_MESH_CLEAR
# BED_MESH_PROFILE SAVE=<name> LOAD=<name> REMOVE=<name>
[gcode_macro BED_MESH_CALIBRATE]
rename_existing: _BED_MESH_CALIBRATE
gcode:
    {% import toolchanger_helper as tc with context %}
    { tc.check_ok() }
    {% if 'quad_gantry_level' in printer and not printer.quad_gantry_level.applied %}
        QUAD_GANTRY_LEVEL
    {% endif %}
    BED_MESH_CLEAR

    _BED_MESH_CALIBRATE {rawparams}
    {% if printer.print_stats.state|lower != "printing" %}
        MOVE_TO_CENTER Z=10
    {% endif %}

    {% set tool = printer[printer.toolchanger.tool] %}
    BED_MESH_SHIFT_PROFILE X={tool.gcode_x_offset * -1.0} Y={tool.gcode_y_offset * -1.0} Z={tool.gcode_z_offset * -1.0}


[gcode_macro BED_MESH_SHIFT_PROFILE]
description: Shift the XYZ frame of a Bed Mesh Profile
gcode:
    {% set profile = params.PROFILE|d(printer.bed_mesh.profile_name) %}
    {% set dx = params.X|d(0)|float(0.0) %}
    {% set dy = params.Y|d(0)|float(0.0) %}
    {% set dz = params.Z|d(0)|float(0.0) %}
    {% set bedmesh = printer.printer.lookup_object('bed_mesh', None) %}

    {% if not profile %}
        { action_respond_info("BED_MESH_SHIFT_PROFILE: PROFILE=<name> is required") }
    {% elif dx == 0 and dy == 0 and dz == 0  %}
        { action_respond_info("BED_MESH_SHIFT_PROFILE: nothing to do (all offsets are zero)") }
    {% elif bedmesh is none %}
        { action_respond_info("BED_MESH_SHIFT_PROFILE: Bed mesh isnt setup.") }
    {% else %}
        {% set pmgr = bedmesh.pmgr %}
        {% if profile not in pmgr.profiles %}
            { action_respond_info("BED_MESH_SHIFT_PROFILE: profile: '" ~ profile ~ "' not valid out of: '" ~ pmgr.profiles.keys() ~ "'") }
        {% else %}
            {% set _ = pmgr.load_profile(profile) %}
            {% set zmesh = bedmesh.get_mesh() %}
            {%- set params = zmesh.get_mesh_params() -%}

            # shift Z
            {%- set new_matrix = [] -%}
            {%- for row in zmesh.probed_matrix if dz != 0 -%}
                {%- set new_row = [] -%}
                {%- for z0 in row -%}
                    {%- set _ = new_row.append((z0 + dz)|float) -%}
                {%- endfor -%}
                {%- set _ = new_matrix.append(new_row) -%}
            {%- endfor -%}
            {%- set _ = zmesh.build_mesh(new_matrix) if new_matrix -%}
            
            # shift XY
            {% set _ = params.update({
                'min_x': params['min_x'] + dx,
                'max_x': params['max_x'] + dx
            }) if dx != 0 %}

            {% set _ = params.update({
                'min_y': params['min_y'] + dy,
                'max_y': params['max_y'] + dy
            }) if dy != 0 %}

            {% set _ = pmgr.save_profile(profile) %}
            { action_respond_info("BED_MESH_SHIFT_PROFILE: shifted profile '" ~ profile ~ "' by X=" ~ dx ~ " Y=" ~ dy ~ " Z=" ~ dz ) }
        {% endif %}
    {% endif %}
