[gcode_macro DOC_DUMP]
variable_splitter_key:  '§'
description:            "Usage: DOC_DUMP S=foo§bar   (§ = AND, case-insensitive)"
variable_color_obj:     "rgb(0,150,255)"
variable_color_meth:    "rgb(255,200,50)"
variable_color_doc:     "rgb(180,180,180)"
variable_color_match:   "rgb(255,0,100)"
variable_color_section: "rgb(200,180,255)"
variable_color_kind:    "rgb(120,220,200)"
gcode:
    {% set query     = params.S|d("")|string %}
    {% set terms     = query.lower().split(splitter_key) %}
    {% set include__ = params.DUNDER|d(False) %}
    {% set skipdocs  = (query == "") %}

    {%- macro macro(macro_argument='default_value') -%}{%- endmacro -%}

    {% set types = [
        ['string',     ''],
        ['list',       []],
        ['dictionary', {}],
        ['tuple',      ()],
        ['int',        0|int],
        ['float',      0.0],
        ['self',       self],
        ['generator',  {}|select],
        ['printer',    printer],
        ['macro',      macro],
    ] %}

    {% set sections = [] %}
    {% set section_meta = [
        ['string',     'string methods'],
        ['list',       'list methods'],
        ['dictionary', 'dict methods'],
        ['tuple',      'tuple methods'],
        ['int',        'int methods'],
        ['float',      'float methods'],
        ['self',       'template / self'],
        ['generator',  'generator helpers'],
        ['filter',     'filters'],
        ['test',       'tests'],
        ['global',     'globals'],
        ['printer',    'printer'],
        ['macro',      'jinja macro'],
    ] %}

    {% set data = {} %}
    {% for typ, obj in types %}{% set _ = data.update({typ: []}) %}{% endfor %}
    {% set _ = data.update({
        'filter': [],
        'test':   [],
        'global': []
    }) %}

    {% macro main() %}
        # 1) Introspect methods on sample types (string/list/dict/etc.)
        {% for typ, obj in types %}
            {% for meth in obj.__dir__() %}
                {% if not (meth.startswith('__') and meth.endswith('__')) or include__ %}
                    {% set fn = obj|attr(meth) %}
                    {% set _data = _add_type_method(typ, meth, fn, terms) %}
                    {% set _ = data[typ].append(_data) if _data %}
                {% endif %}
            {% endfor %}
        {% endfor %}

        # 2) Introspect filters / tests / globals from Jinja environment
        {%- set ctx = self._TemplateReference__context or {}  -%}
        {%- set _all = [
            (ctx.environment.filters or {}, 'filter'),
            (ctx.environment.tests   or {}, 'test'),
            (ctx.environment.globals or {}, 'global')
        ] -%}
        {%- for container, label in _all -%}
            {% for name, val in container.items() %}
                {% set content = _add_env_entry(label, name, val, terms) %}
                {% set _ = data[label].append(content) if content %}
            {% endfor %}
        {% endfor %}

        # 3) Assemble sections and print with action_respond_info
        {% set total = (data.values()|sum(start=[]))|length %}
        {% if total == 0 %}
            { action_respond_info("DOC_DUMP: no doc matches found for '" ~ query|e ~ "'") }
        {% else %}
            {% for key, label in section_meta %}
                {% if data[key] %}
                    {% set content = data[key]|join('') %}
                    {% set summary = _span(color_section, label ~ " (" ~ data[key]|length|string ~ ")") %}
                    {% set _ = sections.append(_details(summary, content)) %}
                {% endif %}
            {% endfor %}

            {% set title = "<b>DOC_DUMP: found " ~ total ~ " matches for '" ~ query|e ~ "'</b>" %}
            {% set report = _details(title, sections|join('')) %}
            { action_respond_info("<div style='font-size:90%; line-height:1.4;'>" ~ report ~ "</div>") }
        {% endif %}
    {%- endmacro %}

    {%- macro _span(color, txt) -%}
        { "<span style='color:" ~ color ~ "'>" ~ txt ~ "</span>" }
    {%- endmacro -%}

    {%- macro _details(summary, content) -%}
        { "<details><summary style='cursor:pointer;'>" ~
            summary ~ "</summary><div style='padding-left: 20px; border-left: 1px solid rgb(51, 51, 51);'>" ~
            content ~ "</div></details>" }
    {%- endmacro -%}

    {%- macro highlight(text, term) -%}
        {%- set L   = term|length -%}
        {%- set low = text.lower() -%}
        {%- set idx = low.find(term) -%}
        {%- set out = text[:idx] ~ "<span style='color:" ~ color_match ~ "'>" ~
                     text[idx:idx+L] ~ "</span>" ~ text[idx+L:] if idx != -1 else text -%}
        { out }
    {%- endmacro -%}

    {%- macro _signature(fn) -%}
        {%- if fn and fn.__text_signature__ is defined and fn.__text_signature__ -%}
            {%- set s = ((fn.__text_signature__.strip()).lstrip('(')).rstrip(')') -%}
            {%- set parts = s.split(', ', 1) -%}
            {%- if parts and parts[0] == '$self' -%}
                {%- set sig = parts[1] if parts|length > 1 -%}
            {%- endif -%}
        {%- endif -%}
        {%- if not sig and fn.__code__ is defined and fn.__code__.co_varnames is defined -%}
            {%- set names = fn.__code__.co_varnames[:fn.__code__.co_argcount] -%}
            {%- set sig   = names|join(', ') -%}
        {%- endif -%}
        {%- set sig = sig|replace('/, ', '')|replace(' /', '')|replace('/', '') if sig -%}
        { (" <code>(" ~ sig|e ~ ")</code>") if sig else '' }
    {%- endmacro -%}

    {%- macro format_doc(text='') -%}
            {%- set text = namespace(content=text|trim|e) -%}

            {%- for role in [':func:`', ':meth:`', ':class:`', ':mod:`'] if role in text.content -%}
                {%- set parts = text.content.split(role) -%}
                {%- set rebuilt = [parts[0]] -%}
                {%- for p in parts[1:] -%}
                    {%- set end = p.find('`') -%}
                    {%- set _ = rebuilt.append(
                        ('<code>' ~ p[:end] ~ '</code>' ~ p[end+1:]) if end != -1 else p
                    ) -%}
                {%- endfor -%}
                {%- set text.content = rebuilt|join('') -%}
            {%- endfor -%}

            {%- for role in ['.. code-block:: ', '.. sourcecode:: '] if role in text.content -%}
                {%- set parts   = text.content.split(role) -%}
                {%- set rebuilt = [parts[0]|trim] -%}
                {%- for rest in parts[1:] -%}
                    {%- set lang_split  = rest.split('\n', 1) -%}
                    {%- set after_lang  = lang_split[1] if lang_split|length > 1 else '' -%}
                    {%- set code_split  = after_lang.lstrip('\n').split('\n\n', 1) -%}
                    {%- set remainder   = code_split[1]|trim if code_split|length > 1 else '' -%}
                    {%- set _ = rebuilt.append(
                        '<pre style="margin:0.2em 0; padding:0.25em 0.5em; '
                        ~ "font-size:85%; "
                        ~ 'border-left:1px solid rgb(80,80,80); background:rgb(10,10,10); '
                        ~ 'white-space:pre;">'
                        ~ code_split[0].lstrip(' ')
                        ~ '</pre>'
                        ~ ("\n" ~ remainder if remainder else "")
                    ) -%}
                {%- endfor -%}
                {%- set text.content = rebuilt|join('') -%}
            {%- endfor -%}

            {%- set text.content = text.content|replace('.. versionadded:: ', '<i>added in version: </i>') -%}
            
            {%- if '``' in text.content -%}
                {%- set out = [] -%}
                {%- for p in text.content.split('``') -%}
                    {%- set _ = out.append(('<code>' ~ p ~ '</code>') if loop.index0 is odd else p) -%}
                {%- endfor -%}
                {%- set text.content = out|join('') -%}
            {%- endif -%}

            { "<pre style=\"margin:0.25em 0 0 0.5em; "
                ~ "color:" ~ color_doc ~ "; "
                ~ "white-space:pre-wrap; "
                ~ "font-family:monospace;\">"
                ~ text.content|replace('{{', '{')|replace('}}', '}') ~ "</pre>" }
        {%- endmacro -%}

    # add one method entry for a given example type
    {%- macro _add_type_method(typ, meth, fn, search_terms) -%}
        {%- if fn and (fn.__doc__ or skipdocs) -%}
            {%- set search_docs = fn.__doc__ if not skipdocs else '' -%}
            {%- set haystack    = (typ ~ " " ~ meth ~ " " ~ search_docs)|lower -%}
            {%- set missing     = search_terms|select|reject('in', haystack)|list -%}
            {%- if missing|length == 0 -%}
                {%- set mask = namespace(
                    meth_html = meth,
                    doc_html  = format_doc(search_docs)
                ) -%}
                {%- for t in search_terms -%}
                    {%- set mask.meth_html = highlight(mask.meth_html, t) -%}
                {%- endfor -%}
                {%- set row =
                    "<details style='margin-left:1em; padding:2px 0;'>"
                    ~ "<summary>"
                        ~ _span(color_obj, typ)
                        ~ _span(color_doc, ".")
                        ~ _span(color_meth, mask.meth_html)
                        ~ _signature(fn)
                    ~ "</summary>"
                    ~ mask.doc_html
                    ~ "</details>"
                -%}
                { row }
            {%- endif -%}
        {%- endif -%}
    {%- endmacro -%}

    # add one env entry (filter/test/global)
    {%- macro _add_env_entry(kind_label, name, val, search_terms) -%}
        {%- set doc_raw = val.__doc__ if val and val.__doc__ is defined else '' -%}
        {%- set search_docs = doc_raw if not skipdocs else '' -%}
        {%- set haystack = (kind_label ~ " " ~ name ~ " " ~ search_docs)|lower -%}
        {%- set missing = search_terms|select|reject('in', haystack)|list -%}
        {%- if missing|length == 0 -%}
            {%- set mask = namespace(
                meth_html=name,
                doc_html=format_doc(search_docs)
            ) -%}
            {%- for t in search_terms -%}
                {%- set mask.meth_html = highlight(mask.meth_html, t) -%}
            {%- endfor -%}
            {%- set row =
                "<details style='margin-left:1em; padding:2px 0;'>"
                ~ "<summary>"
                    ~ _span(color_kind, kind_label)
                    ~ _span(color_doc, ("|" if kind_label == 'filter' else "."))
                    ~ _span(color_meth, mask.meth_html)
                    ~ _signature(val)
                ~ "</summary>"
                ~ mask.doc_html
                ~ "</details>"
            -%}
            { row }
        {%- endif -%}
    {%- endmacro -%}



    { main() }
