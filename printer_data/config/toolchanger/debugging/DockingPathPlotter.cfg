#PLOT_PATH PATH="[{'z':0, 'y':4}, {'z':0, 'y':0}, {'z':-12, 'y':0}]|[{'z':-12, 'y':2}, {'z':-12, 'y':0}, {'z':1.5, 'y':0, 'f':0.5, 'verify':1}, {'z':0, 'y':0}]|[{'y':9.5, 'z':4}, {'y':9.5, 'z':2}, {'y':5.5, 'z':0}, {'z':0, 'y':0, 'f':0.5}, {'z':-10, 'y':0}, {'z':-10, 'y':16}]|[{'z':5, 'y':60}, {'z':5, 'y':0}, {'z':0, 'y':0}, {'z':-6, 'y':0}, {'z':-6, 'y':10}]|[{'y':59, 'z':17.5}, {'y':5, 'z':17.5}, {'y':5, 'z':0.2}, {'y':0.5, 'z':0.1}, {'z':0, 'y':0, 'f':0.5}, {'z':-10, 'y':0}, {'z':-10, 'y':16}]|[{'z':-12, 'y':2}, {'z':-12, 'y':0}, {'z':1.5, 'y':0, 'f':0.5, 'verify':1}, {'z':0.5, 'y':2.5, 'f':0.5}, {'z':8, 'y':8}]|[{'z':-8, 'y':24}, {'z':-8}, {'f':0.5, 'verify':1}, {'y':3, 'z':3}]|[{'y':3, 'z':3}, {'f':0.5}, {'z':-8}, {'z':-8, 'y':24}]|[{'z':0, 'y':10}, {'z':0, 'y':0}, {'z':-8, 'y':0}, {'z':-9, 'y':3}]|[{'z':-9, 'y':3}, {'z':-8, 'y':0}, {'z':-4, 'y':0}, {'z':1, 'f':0.5, 'verify':1}, {'z':0}, {'y':10, 'z':0}]|[{'z':0, 'y':4}, {'z':0, 'y':0}, {'z':-7.3, 'y':0}, {'z':-11.2, 'y':3.5}, {'z':-13.2, 'y':8}]|[{'z':-13.2, 'y':8}, {'z':-11.2, 'y':3.5}, {'z':-7.3, 'y':0}, {'z':3, 'y':0, 'f':0.5, 'verify':1}, {'z':0, 'y':0}, {'z':0, 'y':4}]"


[gcode_macro PLOT_PATH]
description: "Matplotlib 2D tool-path plot. Usage: PLOT_PATH [PATH=\"[...]|[...]\"] [AXES=YZ or Y,Z] [SIZE=8] [FLIPX=0] [FLIPY=0]"
gcode:
    {% set size   = params.SIZE|d(8)|float %}
    {% set force  = params.AXES|d(None) %}
    {% set flipx  = params.FLIPX|d(0)|int %}
    {% set flipy  = params.FLIPY|d(0)|int %}
    {% set raw    = params.PATH|d('') %}

    {% set import = printer.printer.__class__.__init__.__globals__.importlib.import_module %}
    {% set io     = import('io') %}
    {% set b64    = import('base64') %}
    {% set ast    = import('ast') %}
    {% set mpl    = import('matplotlib') %}
    {% set plt    = import('matplotlib.pyplot') %}
    {% set ticker = import('matplotlib.ticker') %}
    {% set math   = import('math') %}

    {% set paths = [] %}
    {% set raw = printer.toolchanger.params_pickup_path ~ "|" ~ printer.toolchanger.params_dropoff_path if not raw else raw %}
    {% for chunk in raw.split("|") if chunk|trim %}
        {% set _ = paths.append(ast.literal_eval(chunk.strip())) %}
    {% endfor %}

    {% set _ = action_raise_error('PLOT_PATH: empty or invalid PATH') if not paths %}

    {% set flat = [] %}
    {% for path in paths %}
        {% for p in path %}
            {% set _ = flat.append(p) %}
        {% endfor %}
    {% endfor %}

    {% if force %}
        {% set forced = [] %}
        {% for c in force|lower if c in ['x','y','z'] and c not in forced %}
            {% set _ = forced.append(c) %}
        {% endfor %}
        {% set axes = [forced[0], forced[1]] if forced|length >= 2 else axes %}
    {% endif %}

    {% if not axes %}
        {% set spans = [] %}
        {% for axname in ['x','y','z'] %}
            {% set vals = flat|selectattr(axname, 'defined')|map(attribute=axname)|map('float')|list %}
            {% if vals %}
                {% set _ = spans.append({'ax': axname, 'span': (vals|max - vals|min)|float}) %}
            {% endif %}
        {% endfor %}
        {% set spans = spans|sort(attribute='span', reverse=True) %}
        {% set _ = action_raise_error('PLOT_PATH: need at least two dimensions') if spans|length < 2 %}
        {% set a0, a1 = spans[0]['ax'], spans[1]['ax'] %}
        {% if a0 == 'z' and a1 != 'z' %}
            {% set axes = [a1, 'z'] %}
        {% elif a1 == 'z' %}
            {% set axes = [a0, 'z'] %}
        {% else %}
            {% set axes = [a0, a1] %}
        {% endif %}
    {% endif %}

    {% for path in paths if axes %}
        {% set _last = { axes[0]: 0.0, axes[1]: 0.0 } %}
        {% for p in path %}
            {% set _ = p.update({axes[0]: _last[axes[0]]}) if axes[0] not in p %}
            {% set _ = p.update({axes[1]: _last[axes[1]]}) if axes[1] not in p %}
            {% set _ = _last.update({axes[0]: p[axes[0]]|float, axes[1]: p[axes[1]]|float}) %}
        {% endfor %}
    {% endfor %}

    {% set vals_x = flat|selectattr(axes[0], 'defined')|map(attribute=axes[0])|map('float')|list %}
    {% set vals_y = flat|selectattr(axes[1], 'defined')|map(attribute=axes[1])|map('float')|list %}
    {% set dx, dy = (vals_x|max - vals_x|min), (vals_y|max - vals_y|min) %}
    {% set span = [dx, dy, 1.0]|max %}
    {% set pad  = span * 0.05 %}
    {% set cx = (vals_x|min + vals_x|max) / 2.0 %}
    {% set cy = (vals_y|min + vals_y|max) / 2.0 %}
    {% set x0 = cx - span/2.0 - pad %}
    {% set x1 = cx + span/2.0 + pad %}
    {% set y0 = cy - span/2.0 - pad %}
    {% set y1 = cy + span/2.0 + pad %}

    {% set fig = plt.figure(figsize=(size, size)) %}
    {% set ax  = fig.add_subplot(111) %}

    {% set _ = fig.patch.set_facecolor((0.06, 0.06, 0.07)) %}
    {% set _ = ax.set_facecolor((0.09, 0.10, 0.12)) %}

    {% set palette = [
        (0.34, 0.65, 1.00),
        (1.00, 0.48, 0.45),
        (0.25, 0.73, 0.31),
        (0.95, 0.80, 0.38),
        (0.47, 0.75, 1.00),
        (1.00, 0.65, 0.34),
        (0.49, 0.91, 0.53)
    ] %}

    {% for i in range(paths|length) %}
        {% set path = paths[i] %}
        {% set xs = path | map(attribute=axes[0]) | map('float') | list %}
        {% set ys = path | map(attribute=axes[1]) | map('float') | list %}
        {% set col = palette[i % (palette|length)] %}
        {% set _ = ax.plot(xs, ys, '-', linewidth=3.0, alpha=0.98,
                           marker='o', markersize=3.2,
                           markerfacecolor=col, markeredgecolor=col,
                           solid_capstyle='round', solid_joinstyle='round',
                           color=col) %}
        {% set _ = ax.annotate('', xy=(xs[-1], ys[-1]), xytext=(xs[-2], ys[-2]),
                                arrowprops={'arrowstyle': '-|>', 'lw': 2.2, 'alpha': 0.98, 'color': col}) 
                                if xs|length >= 2 %}
    {% endfor %}

    {% set _ = ax.set_xlim(x0, x1) %}
    {% set _ = ax.set_ylim(y0, y1) %}
    {% set _ = ax.set_aspect('equal', adjustable='box') %}

    {% set _ = ax.xaxis.set_major_locator(ticker.MaxNLocator(nbins=7, steps=[1,2,2.5,5], min_n_ticks=5)) %}
    {% set _ = ax.yaxis.set_major_locator(ticker.MaxNLocator(nbins=7, steps=[1,2,2.5,5], min_n_ticks=5)) %}
    {% set _ = ax.xaxis.set_minor_locator(ticker.AutoMinorLocator(2)) %}
    {% set _ = ax.yaxis.set_minor_locator(ticker.AutoMinorLocator(2)) %}

    {% set _ = ax.grid(True, which='major', alpha=0.38, linestyle=':') %}
    {% set _ = ax.grid(True, which='minor', alpha=0.14, linestyle=':') %}

    {% set _ = ax.tick_params(which='major', direction='out', length=7, width=2.2, color=(0.82,0.83,0.86), labelcolor=(0.86,0.88,0.92)) %}
    {% set _ = ax.tick_params(which='minor', direction='out', length=3, width=0.9, color=(0.70,0.72,0.76)) %}

    {% for s in ['left','bottom','right','top'] %}{% set _ = ax.spines[s].set_color((0.42,0.45,0.50)) %}{% endfor %}

    {% set _ = ax.set_xlabel(axes[0]|upper, color=(0.86,0.88,0.92)) %}
    {% set _ = ax.set_ylabel(axes[1]|upper, color=(0.86,0.88,0.92)) %}

    {% set _ = ax.invert_xaxis() if flipx %}
    {% set _ = ax.invert_yaxis() if flipy %}

    {% set xr = ax.get_xlim() %}{% set yr = ax.get_ylim() %}
    {% set _  = ax.axvline(0, linewidth=1.0, alpha=0.35, color=(0.60,0.62,0.66)) if 0 >= xr[0] and 0 <= xr[1] %}
    {% set _  = ax.axhline(0, linewidth=1.0, alpha=0.35, color=(0.60,0.62,0.66)) if 0 >= yr[0] and 0 <= yr[1] %}

    {% set buf = io.BytesIO() %}
    {% set _   = fig.savefig(buf, format='svg') %}
    {% set _   = plt.close(fig) %}
    {% set svg = buf.getvalue() %}
    {% set img = 'data:image/svg+xml;base64,' ~ b64.b64encode(svg).decode() %}
    {action_respond_info('<img style="max-width:100%" src="' ~ img ~ '"/>')}


