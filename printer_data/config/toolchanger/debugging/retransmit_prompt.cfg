[gcode_macro CHECK_MCU_LINK]
description: "Popup if MCU/CAN retransmits/errors increase"
variable_enabled: 1
variable_interval: 5 # ← during 5 seconds
variable_threshold: 100 # ← more then 100
variable_last: {}  # map: key -> counters
gcode:
    {% set enable   = params.get('ENABLE', enabled) %}
    {% set disable  = params.get('DISABLE', False) %}
    {% set reset    = params.get('RESET', False) %}
    {% set quiet    = params.get('QUIET', False) %}
    {% set interval = params.get('INTERVAL', interval) %}
    {% set thresh   = params.get('THRESH', threshold) %}

    {% if disable %}
        SET_GCODE_VARIABLE MACRO=CHECK_MCU_LINK VARIABLE=enabled VALUE=0
        UPDATE_DELAYED_GCODE ID=MCU_LINK_WATCHDOG DURATION=0
        RESPOND TYPE=echo MSG=CHECK_MCU_LINK:disabled
    {% endif %}

    {% if reset %}
        SET_GCODE_VARIABLE MACRO=CHECK_MCU_LINK VARIABLE=last VALUE={ {} }
        RESPOND TYPE=echo MSG=CHECK_MCU_LINK:baseline_reset
    {% endif %}

    {% if ('ENABLE' in params) or ('INTERVAL' in params) or ('THRESH' in params) %}
        SET_GCODE_VARIABLE MACRO=CHECK_MCU_LINK VARIABLE=enabled VALUE={enable|int(1)}
        SET_GCODE_VARIABLE MACRO=CHECK_MCU_LINK VARIABLE=interval VALUE={interval|float(5)}
        SET_GCODE_VARIABLE MACRO=CHECK_MCU_LINK VARIABLE=threshold VALUE={thresh}
        {% if enable %}
            UPDATE_DELAYED_GCODE ID=MCU_LINK_WATCHDOG DURATION={interval}
            {% if not quiet %} RESPOND TYPE=echo MSG=CHECK_MCU_LINK:enabled {% endif %}
        {% endif %}
    {% endif %}

    {% set new_last = {} %}
    {% set offenders, lines = [], [] %}

    {%- macro is_mcu(k) -%}{ True if (k == 'mcu') or k.startswith('mcu ') else ''}                   {%- endmacro -%}
    {%- macro is_can(k) -%}{ True if (k == 'canbus_stats') or k.startswith('canbus_stats ') else '' }{%- endmacro -%}

    {% for k in printer if is_mcu(k) or is_can(k) %}
        {% set curr = printer[k] %}
        {% set prev = last.get(k, {}) %}
        {% if is_mcu(k) %}
            {% set ls   = curr.get('last_stats', {}) %}
            {% set seq  = ls.get('retransmit_seq', -1) %}
            {% set by   = ls.get('bytes_retransmit', -1) %}
            {% set pseq = prev.get('seq', -1) %}
            {% set pby  = prev.get('bytes', -1) %}
            {% set dseq = (seq - pseq) %}
            {% set dby  = (by  - pby ) %}
            {% if seq == -1 or seq == 0 or by == -1 or by == 0 %}
                # uhhhh
            {% else %}
                {% set _ = new_last.update({k: {'seq': seq, 'bytes': by}}) %}
                {% set _ = lines.append(k ~ "  seq:" ~ seq ~ " (+" ~ dseq ~ ")  bytes:" ~ by ~ " (+" ~ dby ~ ")") %}
                {% if dseq >= thresh or dby >= thresh %}
                    {% set _ = offenders.append(k ~ "  Δseq=" ~ dseq ~ "  Δbytes=" ~ dby) %}
                {% endif %}
            {% endif %}

        {% elif is_can(k) %}
            {% set _ = new_last.update({k: curr}) %}
            {% set deltas = [] %}
            {% for field in ['tx_retries', 'rx_error', 'tx_error'] if curr.get(field) %}
                {% set v  = curr.get(field, -1) %}
                {% set pv = prev.get(field, -1) %}
                {% set dv = (v - pv) if (v >= 0 and pv >= 0) else 0 %}
                {% set _ = deltas.append((field, v, dv)) %}
            {% endfor %}
            {% set _ = lines.append(k ~ ": " ~ deltas) if deltas %}
        {% endif %}
    {% endfor %}

    {% if offenders|length > 0 %}
        SET_GCODE_VARIABLE MACRO=CHECK_MCU_LINK VARIABLE=threshold VALUE={threshold*2}
        {action_respond_info("action:prompt_begin MCU/CAN link warning")}
        {% for o in offenders %}
            {action_respond_info("action:prompt_text " ~ o)}
        {% endfor %}
        {action_respond_info("action:prompt_text ---------------")}
        {% for l in lines %}
            {action_respond_info("action:prompt_text " ~ l)}
        {% endfor %}
        {action_respond_info("action:prompt_button [Disable]|CHECK_MCU_LINK DISABLE=1")}
        {action_respond_info("action:prompt_button [Reset]|CHECK_MCU_LINK RESET=1")}
        {action_respond_info("action:prompt_show")}
    {% endif %}

    {% if not disable and enable %}
        UPDATE_DELAYED_GCODE ID=MCU_LINK_WATCHDOG DURATION={interval}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=CHECK_MCU_LINK VARIABLE=last VALUE="{new_last}"

[delayed_gcode MCU_LINK_WATCHDOG]
initial_duration: 5
gcode:
    CHECK_MCU_LINK QUIET=1
