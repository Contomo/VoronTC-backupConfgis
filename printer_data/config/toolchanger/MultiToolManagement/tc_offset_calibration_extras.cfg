gcode:
    {% set parent = printer['gcode_macro _TC_UPDATE_OFFSETS'] %}
    {% set state = parent.state %}

    {% macro create_report() %}
        # --- Data processing
        {% set v, ui = settings.vue, settings.ui %}
        {% set raw_new = state.copy() %}
        {% set raw_old = raw_new.pop('snapshot', {}) %}
        {% set tool_numbers = raw_new.keys()|select('number')|sort|list %}
        {% set axes = raw_new[raw_new.keys()|list|first].keys()|list %}
        {% set data = {} %}
        {% for ax in axes %}
            {% set all_new = raw_new.items()|selectattr('0', 'in', tool_numbers)|map(attribute=1)|map(attribute=ax)|list %}
            {% set all_old = raw_old.items()|selectattr('0', 'in', tool_numbers)|map(attribute=1)|map(attribute=ax)|list %}
            {% set sum_delta = all_new|sum - all_old|sum %}
            {% set shift = sum_delta / tool_numbers|length %}
            {% set raw_deltas, rel_deltas = [], [] %}
            {% for new_val in all_new %}
                {% set _ = raw_deltas.append(new_val - all_old[loop.index0]) %}
                {% set _ = rel_deltas.append(raw_deltas[loop.index0] - shift) %}
            {% endfor %}
            {% set _ = data.update({ ax: {'shift': shift,
                                    'vmax_raw': (raw_deltas|map('abs')|list + [settings.thresholds_raw.high])|max,
                                    'vmax_rel': (rel_deltas|map('abs')|list + [settings.thresholds_rel.high])|max } }) %}
        {% endfor %}

        { push('<style>
                .tc-summary-wrapper{
                        --fw: ' ~ ui.fw_bold ~ ';
                        --radius: ' ~ ui.radius ~ ';
                        --radius-pill: ' ~ ui.radius_pill ~ ';
                        --c-text: ' ~ v.text ~ ';
                        --c-text-muted: ' ~ v.text_muted ~ ';
                        --c-surface: ' ~ v.bg ~ ';
                        --c-surface-2: ' ~ v.bg_alt ~ ';
                        --c-border: ' ~ v.border ~ ';
                        --c-sep: ' ~ v.separator ~ ';
                        --c-hover: ' ~ v.hover_row ~ ';
                        font-family: ' ~ settings.font_family ~ ', monospace;
                        font-size: ' ~ settings.font_px ~ 'px;
                        color: var(--c-text);
                }
                .tc-summary-wrapper, .tc-summary-wrapper *{
                        box-sizing:border-box;
                        min-width:0;
                }

                .tc-cards{
                        display:flex;
                        flex-wrap:wrap;
                        gap:.8em;
                        align-items:flex-start;
                }

        .tc-card{
                flex: 1 1 auto;
                width: max-content;
                max-width: 100%;
                min-width: 0;
                padding: .6em;
                background: var(--c-surface-2);
                border: 1px solid var(--c-border);
                border-radius: var(--radius);
                display: flex;
                flex-direction: column;
                gap: .6em;
                box-shadow: inset 0 0 0 1px var(--c-border);
                overflow: hidden;
                clip-path: inset(0 round var(--radius));
                contain: layout paint;
        }

                .tool-title{
                        text-align:center;
                        font-weight:var(--fw);
                        font-size:1.15em;
                        padding:.25em 0 .4em 0;
                        border-bottom:1px solid var(--c-border);
                }

        .tc-table{
                width: 100%;
                max-width: 100%;
                min-width: 0;
                box-sizing: border-box;
                border-collapse: separate;
                border-spacing: 0;
                table-layout: auto;
                background: var(--c-surface);
                border: 1px solid var(--c-border);
                border-radius: var(--radius);
                overflow: hidden;
                margin: 0;                           /* no sneaky outside margins */
        }

                .tc-table thead th{
                        text-align:center;
                        font-weight:var(--fw);
                        padding:.45em .55em;
                        border-bottom:1px solid var(--c-border);
                        white-space:nowrap;
                        background:var(--c-surface-2);
                        overflow:hidden;
                        text-overflow:ellipsis;
                }
                .tc-table thead th + th{ border-left:1px solid var(--c-border); }

                .tc-table tbody tr:nth-child(even) td{ background:rgba(255,255,255,0.02); }

                .tc-table tbody td{
                        padding:.38em .55em;
                        border-top:1px solid var(--c-sep);
                        vertical-align:middle;
                        white-space:nowrap;
                        overflow:hidden;
                }
                .tc-table tbody td + td{ border-left:1px solid var(--c-sep); }

                .tc-table tr:hover td{ background:var(--c-hover); }

                .tc-table .axis{
                        font-weight:var(--fw);
                        text-align:left;
                        overflow:hidden;
                        text-overflow:ellipsis;
                }

                .tc-table .num{
                        text-align:right;
                        font-variant-numeric:tabular-nums;
                }

                .tc-table .clip{
                        display:inline-block;
                        max-width:100%;
                        overflow:hidden;
                        text-overflow:ellipsis;
                        white-space:nowrap;
                        vertical-align:bottom;
                }
                .tc-pill{
                        display: inline-block;
                        padding: 0 .25em;
                        border-radius: 9999px;
                        max-width: 100%;
                        overflow: hidden;
                        text-overflow: ellipsis;
                        white-space: nowrap;
                        vertical-align: bottom;
                        font-weight: var(--fw);
                        background:
                                radial-gradient(ellipse closest-side at 50% 50%,
                                        rgba(0,0,0,0) 0%,
                                        rgba(0,0,0,0) 55%,
                                        color-mix(in oklab, var(--pill-color) 60%, transparent) 80%,
                                        color-mix(in oklab, var(--pill-color) 90%, transparent) 100%);
                        box-shadow:
                                inset 0 0 0 1px color-mix(in oklab, var(--pill-color) 60%, transparent),
                                0 0 .35em color-mix(in oklab, var(--pill-color) 35%, transparent);
                        /* center readability */
                        text-shadow:
                                0 0 .35em rgba(0,0,0,.6),
                                0 0 .06em rgba(0,0,0,.85);
                }
                
        </style>') }
        { push('<div class="tc-summary-wrapper">') }
        { push('<div class="tc-header">') }
        { push('<span>System-Wide Shift</span>') }
        { push('<div class="tc-header-stats">') }
        {% for ax in axes %}
            { push('<span class="tc-stat"><span class="axis">' ~ ax|upper ~ ':</span><span>' ~ fmt(data[ax]['shift']) ~ '</span></span>') }
        {% endfor %}
        { push('</div></div>') }

        { push('<div class="tc-cards">') }

        {% for entry in raw_new.keys() %}
            {% set is_num = entry is number %}
            {% set entry_name = printer.toolchanger.tool_names[entry]|replace('tool ', '') if is_num else entry|string %}
            { push('<div class="tc-card">') }
            { push('<div class="tool-title">' ~ entry_name ~ '</div>') }

            { push('<table class="tc-table">') }
            { push('<colgroup>') }
            { push('<col class="axis">') }
            { push('<col class="num">') }
            { push('<col class="num">') }
            { push('<col class="num">') }
            { push('<col class="num">') }
            { push('</colgroup>') }
            { push('<thead><tr><th>Axis</th><th>Relative</th><th>Previous</th><th>New</th><th>Raw</th></tr></thead><tbody>') }

            {% for ax in axes %}
                {% set is_pp = entry == parent.svf_probe_key %}
                {% set old, new = raw_old[entry][ax], raw_new[entry][ax] %}
                {% set delta = new - old %}
                {% set rel = 0 if ax != 'probe' and is_pp else delta - data[ax].shift %}
                { push('<tr>') }
                { td('<span class="tc-stat axis">' ~ ax|upper ~ '</span>') }
                { push('<td class="num"><span class="clip">' ~ ring_box(rel, data[ax].vmax_rel) ~ '</span></td>') }
                { push('<td class="num"><span class="clip">' ~ fmt(old) ~ '</span></td>') }
                { push('<td class="num"><span class="clip">' ~ fmt(new) ~ '</span></td>') }
                { push('<td class="num"><span class="clip">' ~ (ring_box(delta, data[ax].vmax_raw) if not is_pp else fmt(delta)) ~ '</span></td>') }
                { push('</tr>') }
            {% endfor %}

            { push('</tbody></table>') }
            { push('</div>') }
        {% endfor %}

        { push('</div>') }
        { push('</div>') }

        { action_respond_info(buffer|join) }
    {% endmacro %}

    {% set buffer = [] %}
    {% macro push(str) %} {% set _ = buffer.append(str|string|replace('\n', '')) %} {% endmacro %}
    {% macro td(str) %}   { push('<td>' ~ str ~ '</td>') }                          {% endmacro %}

    {%- macro get_hsla(value, vmax, zero=settings.hls_zero_threshold) -%}
        {%- set d = vmax - zero -%}
        {%- set p = (((value|abs) - zero) / d) if d > 0 else 0.0 -%}
        {%- set p = [ [p, 1.0]|min, 0.0 ]|max -%}
        {%- set start, stop = settings.hsla_start, settings.hsla_end -%}
        {%- set h = start[0] + (stop[0] - start[0]) * p -%}
        {%- set s = start[1] + (stop[1] - start[1]) * p -%}
        {%- set l = start[2] + (stop[2] - start[2]) * p -%}
        {%- set a = start[3] + (stop[3] - start[3]) * p -%}
        { 'hsla(' ~ h|int ~ ', ' ~ s|int ~ '%, ' ~ l|int ~ '%, ' ~ a|round(2) ~ ')' }
    {%- endmacro -%}

    {%- macro fmt(value, r=rounding) -%}
        {%- if value|float|round(r|int(4) + 2) == 0.0 -%}
            /
        {%- else -%}
            { '%+.*f'|format(r|int(4), value) }
        {%- endif -%}
    {%- endmacro -%}

    {%- macro ring_box(value, vmax, width=2) -%}
        {%- set s = fmt(value) -%}
        {%- if '+' in s or '-' in s -%}
            {%- set c = get_hsla(value, vmax) -%}
            { '<span class="tc-pill" style="--pill-color: ' ~ c ~ '; --ring-shadow: inset 0 0 0 ' ~ width ~ 'px ' ~ c ~ ';">' ~ s ~ '</span>' }
        {%- else -%}
            { s }
        {%- endif -%}
    {%- endmacro -%}

  {% if 'snapshot' not in state %}
      { action_respond_info("Cannot generate summary. Please start calibration with T0.") }
  {% else %}
      {% set import = printer.printer.__class__.__init__.__globals__.importlib.import_module %}
      {% set b64 = import('base64') %}

      { create_report() }

      {% set html = buffer|join %}
      {% if 'gcode_macro _CUSTOM_PROMPTS' in printer %} _CUSTOM_PROMPTS B64={b64.b64encode(html.encode()).decode()} {% endif %}
  {% endif %}

[gcode_macro _TC_LOG_OFFSET_HISTORY]
description: Logs tool offsets to JSON. Structure: Group(Time) -> ToolName -> Data(Lists).
    Usage: _TC_LOG_OFFSET_HISTORY [T]=<int> [X|Y|Z|PROBE]=<float>
variable_log_settings: {
        'logfile':       '~/printer_data/config/tool_offset_history.json',
        'rounding':      6,
        'time_grouping': '%Y-%m-%d'
    }
variable_verbose: False
variable_debug: False
gcode:
    {% set SELF = '_TC_LOG_OFFSET_HISTORY' %}

    #───< Imports >─────────────────────────────────────────────────────────────────────────────────────
    {% set glb           = printer.printer.__class__.__init__.__globals__ %}
    {% set import_module = glb.importlib.import_module %}
    {% set builtins      = import_module('builtins') %}
    {% set os            = import_module('os') %}
    {% set json          = import_module('json') %}
    {% set dt            = import_module('datetime') %}
    {% set tc            = printer.toolchanger %}

    #───< Main macro >──────────────────────────────────────────────────────────────────────────────────
    {% macro main() %}
        {% set tn           = (params.T or params.TOOL or None)|int(-1) %}
        {% set axis         = dict.fromkeys(['X', 'Y', 'Z', 'PROBE'], 0.0) %}
        {% set axis_present = axis.keys()|select('in', params)|list %}
        { dbg('axis: ' ~ axis ~ '    present: ' ~ axis_present) }
        {% if tn >= 0 and axis_present|length > 0 %}
            {% set fpath = os.path.expanduser(log_settings.logfile) %}
            { dbg('abspath: ' ~ fpath) }
            {% set now       = dt.datetime.now() %}
            {% set group_key = now.strftime(log_settings.time_grouping) %}

            {% set payload   = {
                'time':  now.strftime('%H:%M:%S')
            } %}

            {% for ax in axis.keys() if ax in params and params[ax]|float(None) is not none %}
                {% set _ = payload.update({
                    ax|lower: params[ax]|float|round(log_settings.rounding)
                }) %}
            {% endfor %}
            { dbg('payload: ' ~ payload) }
            {% set tool_name = tc.tool_names[tn] if tn < tc.tool_names|length else 'tool ' ~ tn %}
            { update_tool_dataset(fpath, group_key, tool_name, payload) }

            {% if not (verbose or 'SILENT' in params) %}
                { msg("Logged " ~ tool_name ~ " to [" ~ group_key ~ "]") }
            {% endif %}
        {% else %}
            { err("Skipped: Missing T or Axis data.") }
        {% endif %}
    {% endmacro %}

    #───< JSON Logic >──────────────────────────────────────────────────────────────────────────────────
    {% macro update_tool_dataset(path, group_key, tool_key, data_map) %}
        {% set path    = os.path.expanduser(path) %}
        {% set dirpath = os.path.dirname(path) %}
        {% set _       = os.makedirs(dirpath, 0o755, True)
                         if dirpath and not os.path.isdir(dirpath) %}

        {% set exists = os.path.exists(path) %}
        {% set mode   = 'r+' if exists else 'w+' %}

        {% set f   = builtins.open(path, mode) %}
        {% set db  = json.load(f) if (exists and os.stat(path).st_size > 0) else {} %}

        {% set group  = db.setdefault(group_key, {}) %}
        {% set target = group.setdefault(tool_key, {}) %}

        {% for k, v in data_map.items() %}
            {% set _ = target.setdefault(k, []).append(v) %}
        {% endfor %}

        {% set sorted_db = {} %}
        {% for k, v in db|dictsort(case_sensitive=false, by='key', reverse=true) %}
            {% set _ = sorted_db.update({k: v}) %}
        {% endfor %}

        {% set _ = f.seek(0) %}
        {% set _ = f.truncate() %}
        {% set _ = json.dump(sorted_db, f, indent=4) %}
        {% set _ = f.close() %}
    {% endmacro %}

    #───< UI Helpers >──────────────────────────────────────────────────────────────────────────────────
    {% macro msg(s, prefix_color="--v-accent-base, orange", msg_color="--p-text-color2, grey") %}
        {% set desc = printer.configfile.settings['gcode_macro ' ~ SELF|lower].description|trim|trim('"')|trim("'") %}
        {% set pre  = "<span style=\"color: var(" ~ prefix_color ~ "); font-weight:bold;\" title=\"" ~ desc ~ "\">" ~ SELF ~ " </span>" %}
        { action_respond_info(pre ~ "<span style=\"color: var(" ~ msg_color ~ ");\" title=\"" ~ desc ~ "\">" ~ s ~ "</span>") }
    {% endmacro %}
    {% macro err(s) %}{ msg(s, prefix_color="--v-error-base, red", msg_color="--v-warning-base, orange") }{% endmacro %}
    {% macro dbg(s) %}{%- set _ =  msg(s, prefix_color="--p-text-color2, grey", msg_color="--p-text-color2, grey") if debug -%}{% endmacro %}

    #-----------------------
    { main() }







