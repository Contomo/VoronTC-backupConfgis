[gcode_macro SHOW_LAST_CALIBRATION_RESULTS]
variable_rounding: 4
variable_settings: {
        'font_family':  'monospace',
        'font_px':      10.5,
        'padding':      '0.15em',
        'vue': {
            'primary':       'var(--v-primary-base, rgb(var(--v-theme-primary, 86,156,214)))',
            'success':       'var(--v-success-base, rgb(var(--v-theme-success, 0,200,83)))',
            'warning':       'var(--v-warning-base, rgb(var(--v-theme-warning, 255,170,0)))',
            'error':         'var(--v-error-base,   rgb(var(--v-theme-error,   244,67,54)))',
            'info':          'rgb(var(--v-theme-info, 86,156,214))',
            'accent':        'var(--v-accent-base, var(--v-primary-base, rgb(var(--v-theme-secondary, var(--v-theme-primary, 238,0,255)))))',

            'text':          'rgba(var(--v-theme-on-surface, 212,212,212), var(--v-high-emphasis-opacity, 0.87))',
            'text_muted':    'rgba(var(--v-theme-on-surface, 212,212,212), var(--v-medium-emphasis-opacity, 0.60))',
            'bg':            'rgb(var(--v-theme-surface, 45,45,48))',
            'bg_alt':        'rgb(var(--v-theme-surface-variant, 37,37,38))',
            'background':    'rgb(var(--v-theme-background, 30,30,32))',
            'on_background': 'rgba(var(--v-theme-on-background, 212,212,212), var(--v-high-emphasis-opacity, 0.87))',

            'border':        'var(--ms-border,    rgba(var(--v-border-color, 68,68,68),  var(--v-border-opacity, 1)))',
            'separator':     'var(--ms-separator, rgba(var(--v-border-color, 25,25,26),  var(--v-hover-opacity, 0.08)))',
            'hover_row':     'rgba(var(--v-theme-primary, 86,156,214), var(--v-hover-opacity, 0.08))',

            'muted':         'rgba(var(--v-theme-on-surface, 255,255,255), 0.06)',
            'muted_border':  'rgba(var(--v-theme-on-surface, 255,255,255), 0.12)',

            'tool_bg':       'var(--ms-tool, rgb(55,55,58))',
        },
        'ui': {
            'fw_bold':     700,
            'pad_y':       '0.5em',
            'radius':      '0.6em',
            'radius_pill': '0.15em',
        },
        'hls_zero_threshold': 0.01,
        'hsla_start':         [120, 100, 45, 0.1],
        'hsla_end':           [0,   100, 50, 0.7],
