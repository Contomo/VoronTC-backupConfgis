[gcode_macro GOOD_ONES]
description: Statistical analysis of tool offsets. Calculates Floating T0 drift based on common-mode shift of all tools.
variable_settings: {
        'source_macro': '_TC_LOG_OFFSET_HISTORY',
        'axis':         ['x', 'y', 'z', 'probe'],
        'rounding':     4,
        'ui': {
            'font':    'monospace',
            'px':      11,
            'radius':  '4px',
            'colors': {
                'text':    'rgba(212,212,212,0.87)',
                'bg':      'rgb(45,45,48)',
                'bg_alt':  'rgb(30,30,30)',
                'border':  'rgba(68,68,68,1)',
                'pill_bg': 'rgba(0,0,0,0.3)',
                'white':   'rgb(255,255,255)',
                'gray':    'rgb(238,238,238)'
            }
        },
        'thresholds': { 'warn': 0.010, 'crit': 0.050 },
        'hsla_start': [120, 90, 40, 0.2],
        'hsla_end':   [0,   90, 50, 0.6],
        'axis_order': ['x', 'y', 'z', 'probe']
    }
gcode:
    {% set SELF = 'TC_ANALYZE_OFFSETS' %}

    #───< Imports >─────────────────────────────────────────────────────────────────────────────────────
    {% set glb           = printer.printer.__class__.__init__.__globals__ %}
    {% set import_module = glb.importlib.import_module %}
    {% set builtins      = import_module('builtins') %}
    {% set os            = import_module('os') %}
    {% set json          = import_module('json') %}
    {% set dt            = import_module('datetime') %}

    {% set parent        = printer['gcode_macro _TC_UPDATE_OFFSETS'] %}

    #───< Main >────────────────────────────────────────────────────────────────────────────────────────
    {% macro main() %}

        {% set since       = params.MAX_DAYS_AGO|d(30)|float -%}
        {% set max_entries = params.MAX_ENTRIES|d(10)|int -%}
        {% set limit       = params.LIMIT|d(100)|int -%}

        {% set before      = dt.datetime.now() - dt.timedelta(days=since) %}
        {% set group_key   = before.strftime(parent.log_settings.time_grouping) %}


        {% set data        = {} %}
        { load_database_to_container(
            container=data,
            path=parent.log_settings.logfile,
            max_count_per=limit,
            max_count_date=max_entries,
            after_date=group_key,
        ) }

        # convert all entries of first tool into probe position and T0 actual.
        {% set t0_name = printer.toolchanger.tool_names|first %}
        {% set axes = ['x', 'y', 'z'] %}
        {% for date, tools in data.items() if t0_name in tools %}
            {% set p_data = dict(tools[t0_name]|items|selectattr(0, 'in', axes)) %}
            {% set _      = tools.update({t0_name: dict.fromkeys(axes, 0.0)}) if p_data %}
            {% set _      = tools.update({'calibration_probe': p_data}) if p_data %}
        {% endfor %}

    {% endmacro %}

    #───< Message Macros >──────────────────────────────────────────────────────────────────────────────
    {% macro msg(t, prefix_color="--v-accent-base", msg_color="--p-text-color2", respond=action_respond_info) %}
        {% set desc = printer.configfile.settings['gcode_macro ' ~ SELF|lower].description|trim|trim('"')|trim("'") %}
        {% set pre  = "<span style=\"color: var(" ~ prefix_color ~ "); font-weight:bold;\" title=\"" ~ desc ~ "\">" ~ SELF ~ " </span>" %}
        { action_respond_info(pre ~ "<span style=\"color: var(" ~ msg_color ~ ");\" title=\"" ~ desc ~ "\">" ~ t ~ "</span>") }
    {% endmacro %}
    {% macro err(t) %}
        { msg(t, prefix_color="--v-error-base", msg_color="--v-warning-base") }
    {% endmacro %}
    {% macro raise(t) %}
        { msg(t, prefix_color="--v-error-base", msg_color="--v-warning-base", respond=action_raise_error) }
    {% endmacro %}

    #───< Math Macros >─────────────────────────────────────────────────────────────────────────────────
    {%- macro average(numbers) -%}
        { numbers|sum / numbers|length if numbers else 0.0 }
    {%- endmacro -%}

    {%- macro median(numbers) -%}
        {%- set sorted_list = numbers|sort -%}
        {%- set count       = sorted_list|length -%}
        { 0.0 if count == 0 else
          (sorted_list[count // 2] if count % 2 == 1 else
          (sorted_list[count // 2 - 1] + sorted_list[count // 2]) / 2.0) }
    {%- endmacro -%}

    {%- macro stddev(numbers) -%}
        {%- set varsums, mean = [], average(numbers)|float -%}
        {%- for x in numbers|map('float') -%}
            {%- set _ = varsums.append((x - mean)**2) -%}
        {%- endfor -%}
        { (varsums|sum / numbers|length)**0.5 if numbers|length > 1 else 0.0 }
    {%- endmacro -%}

    #───< Database Handling >───────────────────────────────────────────────────────────────────────────

    {%- macro _verify_expand_path(path) -%}
        {%- set exp = os.path.expanduser(path) if path -%}
        { exp if exp and os.path.exists(exp) else raise("Log file not found: " ~ exp) }
    {%- endmacro -%}

    {%- macro load_database_to_container(container, path, max_count_per=9999, max_count_date=9999, after_date=None) -%}
        {%- set f   = builtins.open(_verify_expand_path(path), 'r') -%}
        {%- set db  = json.load(f) -%}
        {%- set _   = f.close() -%}

        {%- set all_db     = db|items|list|sort(reverse=True) -%}
        {%- set valid_keys = all_db|selectattr('0', '>=', after_date)|list if after_date else all_db -%}

        {%- set collected_tools = {} -%}
        {%- macro _below_limit(name) -%}
            {- True if (collected_tools[name] or 0) < max_count_per else '' -}
        {%- endmacro -%}

        {%- for day, content in valid_keys[:max_count_date] -%}
            {%- set out_day = container.get(day, {}) -%}
            {%- for t_name, t_data in content|items if _below_limit(t_name) -%}
                {%- set out_t = out_day.get(t_name, {}) -%}
                {%- for axis, arr in t_data|items 
                    if arr and arr is sequence and (arr is not string) and _below_limit(t_name) -%}
                    {%- set cur   = collected_tools[t_name] or 0 -%}
                    {%- set take  = [max_count_per - cur, arr|length]|min -%}
                    {%- set _     = out_t.update({
                        axis: (out_t[axis] or []) + arr[:take]
                    }) -%}
                    {%- set _ = collected_tools.update({ t_name: cur + take }) -%}
                {%- endfor -%}
                {%- set _ = out_day.update({ t_name: out_t }) -%}
            {%- endfor -%}
            {%- set _ = container.update({ day: out_day }) -%}
        {%- endfor -%}
    {%- endmacro -%}

    #───< HTML Macros >─────────────────────────────────────────────────────────────────────────────────
    {%- macro get_color(value, max_v=None, min_v=None) -%}
        {%- set max_v = max_v or settings.thresholds.critical  or 1    -%}
        {%- set min_v = max_v or settings.thresholds.threshold or 0.05 -%}
        # this is messy right now lol, so basically... we want to offset it... so 0-min same color, and max-inf same coolor, and lerp with v from min-max
        {%- set p = (((max_v - value|abs) - min_v) / max_v) if max_v else 0 -%}
        {%- set p = [ [p, 1.0]|min, 0.0 ]|max -%}
        {%- set start, stop = settings.hsla_start, settings.hsla_end -%}
        {%- set h = start[0] + (stop[0] - start[0]) * p -%}
        {%- set s = start[1] + (stop[1] - start[1]) * p -%}
        {%- set l = start[2] + (stop[2] - start[2]) * p -%}
        {%- set a = start[3] + (stop[3] - start[3]) * p -%}
        { 'hsla(' ~ h|int ~ ', ' ~ s|int ~ '%, ' ~ l|int ~ '%, ' ~ a|round(2) ~ ')' }
    {%- endmacro -%}

    {% macro ring_box(value, vmax, width=2) %}
        {% set s = fmt(value) %}
        {% if '+' in s or '-' in s %}
            {% set c = get_hsla(value, vmax) %}
            { '<span class="tc-pill" style="--pill-color: ' ~ c ~ '; --ring-shadow: inset 0 0 0 ' ~ width ~ 'px ' ~ c ~ ';">' ~ s ~ '</span>' }
        {% else %}
            { s }
        {% endif %}
    {% endmacro %}








