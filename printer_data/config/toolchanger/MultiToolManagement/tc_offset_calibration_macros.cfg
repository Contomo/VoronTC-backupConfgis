[delayed_gcode _TC_UPDATE_OFFSETS_LOAD_AT_STARTUP]
initial_duration: 1
gcode:
    _TC_UPDATE_OFFSETS LOAD_ALL=1

[gcode_macro _TC_UPDATE_OFFSETS]
description: saves tool offsets into save variables, call with 'LOAD_ALL' to load all offsets from SVF into active.
    Maintains a state of all offsets to be later made use of for analysis.
variable_rounding:      4
variable_svf_prefix:    'offsets_'
variable_svf_probe_key: 'probe_position'
variable_state:         {}
gcode:
    {% set SELF = '_TC_UPDATE_OFFSETS' %}
    {% set tc, tools_cal = printer.toolchanger, (printer.tools_calibrate if 'tools_calibrate' in printer else {}) %}
    {% set lr, lp        = tools_cal.get('last_result', [0.0, 0.0, 0.0]), tools_cal.get('last_probe_offset', 0.0) %}
    {% if tc.has_detection %}
        {% set _actn = tc.detected_tool_number %}
    {% elif 'tool_probe_endstop' in printer %}
        {% set _actn = printer.tool_probe_endstop.active_tool_number %}
    {% elif 'probe_multiplexer' in printer %}
        {% set _actn = (printer.probe_multiplexer.probe_number|default(-1)|int) %}
    {% else %}
        {% set _actn = -1 %}
    {% endif %}
    {% set tn            = params.get('T', _actn)|int(-1) %}

    {% macro main() %}
        {% if 'T' in params and tn not in tc.tool_numbers %}
            { err('Invalid T<int> (' ~ params.T ~ ' not in ' ~ tc.tool_numbers|join(', ') ~ ').')  }

        {% elif ('T' in params or not params) and tn in tc.tool_numbers %}
            # first call, clear state, add snapshot
            {% if tn == 0 %}
                {% set _ = state.clear() %}
                { stash_svf_snapshot() }
            {% endif %}
            { handle_last_result(tn) }
            { msg("staged") }

        {% elif 'LOAD_ALL' in params %}
            {% set svf = printer.save_variables.variables %}
            {% set report = [] %}
            {% for tool in printer.toolchanger.tool_names %}
                {% set tshort   = tool|replace('tool ', '') %}
                {% set key      = tool|lower|replace('tool ', svf_prefix) %}
                {% set raw      = svf.get(key, {}) %}
                {% set stored   = raw.copy() if raw is mapping else {} %}
                {% if stored %}
                    { ensure_keys(stored, ensure_probe=('probe' in stored)) }
                    { overwrite_tool_gcode_offset(tool_number=printer[tool].tool_number, **stored) }
                    { overwrite_tool_probe_offset(tool_number=printer[tool].tool_number, z=stored.probe) if 'probe' in stored else ''}
                    {% set msg = tshort ~ ' → X=' ~ stored.x|round(rounding) ~ ' Y=' ~ stored.y|round(rounding) ~ ' Z=' ~ stored.z|round(rounding) %}
                    {% set msg = msg ~ (' P=' ~ stored.probe|round(rounding)  if 'probe' in stored else '') %}
                    {%- set _ = report.append('<div style="margin: 0; color: var(--p-text-color2);">' ~ msg ~ '</div>') -%}
                {% else %}
                    {%- set _ = report.append('<div style="margin: 0; color: var(--v-warning-base);">No saved offsets for ' ~ tshort ~ '</div>') -%}
                {% endif %}
            {% endfor %}
            {% set _ = summary(
                'Loaded gcode offsets from SVF', 
                "<div style='margin-top:5px; padding:5px 10px; border-radius:4px; 
                            font-size:0.75em; border:1px solid var(--p-border); 
                            background:var(--p-background-darker);'>" ~ 
                            report|join ~ 
                "</div>" ) if report %}
        {% endif %}
    {% endmacro %}

    # -------------------------------------------- Message macros --------------------------------------------
    {% macro summary(t, details, prefix_color="--v-accent-base", msg_color="--p-text-color2") %}
        {% set desc = printer.configfile.settings['gcode_macro ' ~ SELF|lower].description %}
        {% set pre  = "<span style=\"color: var(" ~ prefix_color ~ "); font-weight:bold;\" title=\"" ~ desc ~ "\">" ~ SELF ~ " </span>" %}
        { action_respond_info("<details><summary>" ~ pre ~ "<span style=\"color: var(" ~ msg_color ~ ");" ~ 
                              "\" title=\"" ~ desc ~ "\">" ~ t ~ "</span></summary>" ~ details ~ "</details>") }
    {% endmacro %}

    {% macro msg(t, prefix_color="--v-accent-base", msg_color="--p-text-color2") %}
        {% set desc = printer.configfile.settings['gcode_macro ' ~ SELF|lower].description %}
        {% set pre  = "<span style=\"color: var(" ~ prefix_color ~ "); font-weight:bold;\" title=\"" ~ desc ~ "\">" ~ SELF ~ " </span>" %}
        { action_respond_info(pre ~ "<span style=\"color: var(" ~ msg_color ~ ");\" title=\"" ~ desc ~ "\">" ~ t ~ "</span>") }
    {% endmacro %}
    {% macro err(t) %}{ msg(t, prefix_color="--v-error-base", msg_color="--v-warning-base") }{% endmacro %}

    # ---------------------- allow overwrite as a tuple with 3/4 entries ----------------------
    {% set overwrite = params.pop('OVERWRITE', None) %}
    {% if overwrite %}
        {% set _v = overwrite.split(',')|map('trim')|map('float')|list %}
        {% if _v|length > 4 or _v|length < 3 %}
            { action_raise_error('OVERWRITE must be a list of either 3 or 4 indicies representing <X,Y,Z,[PROBE]>'|e ~ '<br>Provided was: ' ~ _v) }
        {% endif %}
        {% set lr, lp = _v[:3], (_v[3] if _v|length == 4 else lp) %}
        { msg('overwritten input. (' ~ _v  ~ ')') }
    {% endif %}

    # -------------------------------------------- tool probe/tool helpers for offsets --------------------------------------------
    {% macro overwrite_tool_gcode_offset(tool_number, x=None, y=None, z=None) %}
        {% set _ = kwargs %} # just so we dont error when "probe" slips in
        {% set tool         = tc.tool_names[tc.tool_numbers.index(tool_number)] %}
        {% set tool_obj     = printer.printer.lookup_object(tool, None) %}
        {% set mapping      = [
            ('gcode_x_offset', x),
            ('gcode_y_offset', y),
            ('gcode_z_offset', z)
        ] %}
        {% for key, val in mapping if val|float(None) is not none %}
            {% set _ = tool_obj.__setattr__(key, val) %}
        {% endfor %}
    {% endmacro %}

    {% macro overwrite_tool_probe_offset(tool_number, x=None, y=None, z=None) %}
        {% if 'probe_multiplexer' in printer and tool_number in printer.probe_multiplexer.probe_numbers %}
            SET_PROBE_OFFSET N={tool_number} {('X=' ~ x) if x is not none else ''} {('Y=' ~ y) if y is not none else ''} {('Z=' ~ z) if z is not none else ''}
        {% endif %}
    {% endmacro %}
    #------------------------------- saving/staging helpers -------------------------------
    # ensure all present, float and valid.
    {% macro ensure_keys(container, ensure_probe=lp) %}
        {% for key in ['x','y','z'] + (['probe'] if ensure_probe else []) %}
            {% set val = container.get(key, None)|float(0.0) %}
            {% set _   = container.update({key: val}) %}
        {% endfor %}
    {% endmacro %}  

    # Save to save variables file without stripping other keys which may be present.
    {% macro save_dict_merged(key, dict) %}
        {% set _dict    = dict.copy() if dict is mapping else {} %}
        {% for k,v in _dict.items() if v is number %}
            {% set _    = _dict.update({k: v|round(rounding|int(4))}) %}
        {% endfor %}
        {% set svf      = printer.save_variables.variables %}
        {% set updated  = svf.get(key, {}).copy() %}
        {% set _        = updated.update(_dict) %}
        {% set _        = svf.update({key: updated}) %}
        SAVE_VARIABLE VARIABLE={key} VALUE="{updated}"
    {% endmacro %}

    # helper to handle last results → saves to SVF → saves to tools → saves to local var
    {% macro handle_last_result(tool_number) %}
        {% set t_index = tc.tool_numbers.index(tool_number) %}
        {% set svf_key = tc.tool_names[t_index]|lower|replace('tool ', svf_prefix) %}
        _TC_LOG_OFFSET_HISTORY {'T=' ~ tool_number ~ 
            ' X=' ~ lr[0] ~ ' Y=' ~ lr[1] ~ ' Z=' ~ lr[2] ~ ' SILENT=TRUE' ~ 
            (' PROBE=' ~ lp if lp else '')}
        {% if tool_number == 0 %}
            # save probe position first, only then possibly default probe to 0
            {% set tool_offs = {} %}
            {% set probe_pos = {'x': lr[0], 'y': lr[1], 'z': lr[2]} %}
            { save_dict_merged(svf_probe_key, probe_pos) }
            { ensure_keys(probe_pos) }
            {% set _ = state.update({
                svf_probe_key: probe_pos
            }) %}
        {% else %}
            {% set tool_offs = {'x': lr[0], 'y': lr[1], 'z': lr[2] } %}
            # Immediately apply/update any non T0
            { overwrite_tool_gcode_offset(tool_number=tool_number, **tool_offs) }
        {% endif %}
        # carry over probe
        {% set _ = tool_offs.update({'probe': lp}) if lp %}
        { ensure_keys(tool_offs) } 
        { save_dict_merged(svf_key, tool_offs) }
        {% set _ = state.update( {tool_number: tool_offs} ) %}
    {% endmacro %}

    # helper to take a snapshot of all previous offsets and store them locally
    {% macro stash_svf_snapshot() %}
        {% set snapshot = {} %}
        {% set svf          = printer.save_variables.variables %}
        {% set tkey_lookup  = tc.tool_names|sort|map('lower')|map('replace', 'tool ', svf_prefix)|list %}
        {% for tn in tc.tool_numbers|sort %}
            {% set _prev = svf.get(tkey_lookup[loop.index0], {}) %}
            {% set _     = ensure_keys(_prev) %}
            {% set _     = snapshot.update( {tn: _prev} )  %}
        {% endfor %}
        {% set prev = svf.get(svf_probe_key, {}).copy() %}
        { ensure_keys(prev) }
        {% set _ = snapshot.update( {svf_probe_key: prev} )  %}
        {% set _ = state.update( {'snapshot': snapshot} )  %}
    {% endmacro %}
    { main() }
    SET_GCODE_VARIABLE MACRO={SELF} VARIABLE=state VALUE="{state}"


