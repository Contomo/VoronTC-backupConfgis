[gcode_macro TC_FIND_TOOL_OFFSETS]
description: "Calibrates the offsetts of the specified tool or tools. Usage: TC_FIND_TOOL_OFFSETS TOOL=x,x,x"
variable_saved_tool_temps: None
variable_clean_nozzle_macro_name: "CLEAN_NOZZLE"
variable_calibration_temp: 160
gcode:
    {% set SELF = "TC_FIND_TOOL_OFFSETS" %}

    {% if toolchanger_helper %}
        {% import toolchanger_helper as tch with context %}
        { tch.check_ok() }
    {% endif %}

    {% set tool_nums = params.T|d('all') %}

    {% macro find_tool_offsets() %}
        {% set active_tn        = printer.toolchanger.tool_number %}
        {% set toolhead         = printer.toolhead %}

        {% set valid_nums       = (get_all_valid_tns()).split(',')|map('int')|list %}
        {% set tool_nums          = valid_nums|join(',') if tool_nums == 'all' else tool_nums %}
        {% set requested_tools  = (
                [0] + (
                tool_nums.split(',')
                |map('trim')
                |map('int')
                |select('in', valid_nums)
                |reject('==', 0)
                |list)
            )|unique|sort|list if 'T' in params else valid_nums
        %}

        { msg("calibrating: " ~ requested_tools|join(', ')) }

        {% for tn in requested_tools %}
            { ('M104 S' ~ calibration_temp ~ 'T' ~ loop.nextitem)       if loop.nextitem           else '' }
            { (clean_nozzle_macro_name ~ ' T=' ~ tn ~ ' WIPE_TIMES=12') if clean_nozzle_macro_name else '' }
            { 'M104 S' ~ calibration_temp ~ 'T' ~ tn }
            { 'T' ~ tn } 
            { 'M109 S' ~ calibration_temp ~ ' T' ~ tn ~ ' L' ~ (calibration_temp - 10) ~ ' U' ~ (calibration_temp + 30) }
            TC_PROBE_CALIBRATION_PROBE 
            { '_TC_UPDATE_OFFSETS T=' ~ tn } 
            { restore_temp(tn) }
        {% endfor %}

        SHOW_LAST_CALIBRATION_RESULTS
        { ('MOVE_TO_CENTER T=' ~ active_tn) 
          if printer.idle_timeout.state|lower != "printing" or 'xyz' not in toolhead.homed_axes|lower 
          else 'T' ~ active_tn ~ toolhead.position._asdict()|xmlattr }

        {% for tn in printer.toolchanger.tool_numbers %}
            { restore_temp(tn) }
        {% endfor %}
    {% endmacro %}

    # ----------------------------------------------------------------------------------------------------------------------------
    {% macro msg(s, prefix_color="--v-accent-base, orange", msg_color="--p-text-color2, grey") %}
        {% set desc = printer.configfile.settings['gcode_macro ' ~ SELF|lower].description|trim|trim('"')|trim("'") %}
        {% set pre  = "<span style=\"color: var(" ~ prefix_color ~ "); font-weight:bold;\" title=\"" ~ desc ~ "\">" ~ SELF ~ " </span>" %}
        { action_respond_info(pre ~ "<span style=\"color: var(" ~ msg_color ~ ");\" title=\"" ~ desc ~ "\">" ~ s ~ "</span>") }
    {% endmacro %}
    {% macro err(s) %}{ msg(s, prefix_color="--v-error-base, red", msg_color="--v-warning-base, orange") }{% endmacro %}

    # ----------------------------------------------------------------------------------------------------------------------------
    {% set tnums  = printer.toolchanger.tool_numbers %}
    {% set tnames = printer.toolchanger.tool_names %}

    {%- macro restore_temp(tn=None) -%}
        {%- set tool = printer[tnames[tnums.index(tn)]] -%}
        {%- set target = printer[tool.extruder].target if tool.extruder else None -%}
        { ('M104 T' ~ tn ~ ' S' ~ target ~ '\n') if target is not none else '' }
    {%- endmacro -%}

    {%- macro get_all_valid_tns() -%}
        {%- for tn in tnums if printer[tnames[tnums.index(tn)]].extruder -%}
            {tn}{',' if not loop.last else ''}
        {%- endfor -%}
    {%- endmacro -%}

    # ----------------------------------------------------------------------------------------------------------------------------
    { find_tool_offsets() }


