[delayed_gcode _LOAD_DOCK_FROM_SVF]
gcode: 
    _LOAD_DOCK_FROM_SVF
initial_duration: 1

[gcode_macro _LOAD_DOCK_FROM_SVF]
variable_dock_pre: 'dock_'
gcode:
    {% set SELF = '_LOAD_DOCK_FROM_SVF' %}
    {% macro summary(t, details, prefix_color="--v-accent-base", msg_color="--p-text-color2") %}
        {% set desc = printer.configfile.settings['gcode_macro ' ~ SELF|lower].description %}
        {% set pre  = "<span style=\"color: var(" ~ prefix_color ~ "); font-weight:bold;\" title=\"" ~ desc ~ "\">" ~ SELF ~ " </span>" %}
        { action_respond_info("<details><summary>" ~ pre ~ "<span style=\"color: var(" ~ msg_color ~ ");" ~ 
                              "\" title=\"" ~ desc ~ "\">" ~ t ~ "</span></summary>" ~ details ~ "</details>") }
    {% endmacro %}

    {% set report = [] %}
    {% set axes = ['x', 'y', 'z'] %}
    {% set svf = printer.save_variables.variables %}
    {% for tool in printer.toolchanger.tool_names %}
        {% set _key = tool|lower|replace('tool ', dock_pre) %}
        {% set dock = svf.get(_key, {}) %}
        {% for ax in axes if ax in dock %}
            SET_TOOL_PARAMETER TOOL="{tool}" PARAMETER={ 'params_park_' ~ ax } VALUE={dock[ax]}
        {% endfor %}
        {%- set _ = report.append('<div style="margin: 0; color: var(--p-text-color2);">' ~ tool ~ ' → ' ~ dock|xmlattr ~ '</div>') 
                    if dock.keys()|select('in', axes)|list 
                    else report.append('<div style="margin: 0; color: var(--v-warning-base);">No saved dock for ' ~ tool ~ '</div>') -%}
    {% endfor %}

    {% set _ = summary('Loaded dock position from SVF', 
                       "<div style='margin-top:5px; padding:5px 10px; border-radius:4px; 
                       font-size:0.75em; border:1px solid var(--p-border); 
                       background:var(--p-background-darker);'>" ~ 
                       report|join ~ 
                       "</div>" ) if report %}
