[gcode_macro TC_FIND_PROBE_TRIGGER_TO_BOTTOM]
description: Calculates correct trigger_to_bottom_z using the trusted z_offset of the current tool.
gcode:
    {% import toolchanger_helper as tc with context %}
    {% set temp = printer['gcode_macro _toolchanger_settings'].get('offset_calibration', {}).get('nozzle_temperature', 150) %}
    # --- Pre-flight Checks ---
    { tc.check_ok()}
    { tc.respond_colored("Starting TTBZ Calibration...", 'TTBZ', 'info--text') }
    M104 S{temp}
    MOVE_OVER_PROBE
    { tc.update_ttbz_from_svf(respond=False)}
    TC_LOAD_OFFSETS
    M109 S{temp}
    TC_PROBE_CALIBRATION_PROBE PROBE=1 FORCE_LOCATE=1
    M104 S{ tc.get_tool_target(printer.toolchanger.tool_number) }
    _TC_FIND_PROBE_TRIGGER_TO_BOTTOM

[gcode_macro _TC_FIND_PROBE_TRIGGER_TO_BOTTOM]
gcode:
    {% set SELF = 'TC_FIND_PROBE_TRIGGER_TO_BOTTOM' %}

    {% macro msg(t, prefix_color="--v-accent-base", msg_color="--p-text-color2") %}
        {% set desc = printer.configfile.settings['gcode_macro ' ~ SELF|lower].description %}
        {% set pre  = "<span style=\"color: var(" ~ prefix_color ~ "); font-weight:bold;\" title=\"" ~ desc ~ "\">" ~ SELF ~ " </span>" %}
        { action_respond_info(pre ~ "<span style=\"color: var(" ~ msg_color ~ ");\" title=\"" ~ desc ~ "\">" ~ t ~ "</span>") }
    {% endmacro %}
    {% macro err(t) %}{ msg(t, prefix_color="--v-error-base", msg_color="--v-warning-base") }{% endmacro %}

    {%- macro ui(msg) -%} { action_respond_info('action:prompt_' ~ msg) } {%- endmacro -%}

    {% set p, svf               = printer, printer.save_variables.variables or {} %}
    {% set pp                   = svf.get('probe_position', {}) %}
    {% if 'UPDATE' in params %} 
        {% set new_ttbz         = params.UPDATE|float %}
        {% set _                = pp.update({'trigger_to_bottom_z': new_ttbz|round(4)}) %}
        SAVE_VARIABLE VARIABLE=probe_position VALUE="{pp}"
        { msg('trigger_to_bottom_z updated to ' ~ new_ttbz|round(4)) }
        { ui('end') }
    {% else %}
        {% if 'tool_probe_endstop' in printer %}
            {% set trusted_probe_z = printer.tool_probe_endstop.active_tool_probe_z_offset|float %}
        {% elif 'probe_multiplexer' in printer %}
            {% set trusted_probe_z = printer.probe_multiplexer.z_offset|float(0.0) %}
        {% else %}
            {% set trusted_probe_z = 0.0 %}
        {% endif %}
        {% set last_probe_offset = printer.tools_calibrate.last_probe_offset|float %}
        {% set ttbz_old          = pp.get('trigger_to_bottom_z', 0.0)|float %}
        {% set ttbz_new          = trusted_probe_z - (last_probe_offset - ttbz_old) %}
        { ui('begin Calibrate Trigger to Bottom Z') }
        { ui('text  → Old TTBZ: ' ~ ttbz_old|round(3) ~ ' mm') }
        { ui('text  → New TTBZ: ' ~ ttbz_new|round(3) ~ ' mm') }
        { ui('footer_button [ 🖫 ]|_TC_FIND_PROBE_TRIGGER_TO_BOTTOM UPDATE=' ~ ttbz_new ~ '|success') }
        { ui('footer_button [ 🗙 ]|RESPOND TYPE="command" MSG="action:prompt_end"|error') }
        { ui('show') }
    {% endif %}


