

[gcode_macro MOVE_OVER_PROBE]
description: Move tool head to probing position defined in [save_variables]. 
    Moves 2mm above the saved probe position.
    Call TC_FIND_FIRST_CALIBRATION_PROBE_POSITION to set the first probe position.
variable_move_back_before_appraoch_y: 100
gcode:
    {% set SELF = "MOVE_OVER_PROBE" %}

    {% macro msg(t, prefix_color="--v-accent-base", msg_color="--p-text-color2") %}
        {% set desc = printer.configfile.settings['gcode_macro ' ~ SELF|lower].description %}
        {% set pre  = "<span style=\"color: var(" ~ prefix_color ~ "); font-weight:bold;\" title=\"" ~ desc ~ "\">" ~ SELF ~ " </span>" %}
        { action_respond_info(pre ~ "<span style=\"color: var(" ~ msg_color ~ ");\" title=\"" ~ desc ~ "\">" ~ t ~ "</span>") }
    {% endmacro %}
    {% macro err(t) %}{ msg(t, prefix_color="--v-error-base", msg_color="--v-warning-base") }{% endmacro %}

    {%- macro safe_y_away_from_docks(y_pos=0.0, min_dist=0.0) -%}
        {%- set dock_ys = [] -%}
        {%- for tool in printer.toolchanger.tool_names -%}
            {%- set _ = dock_ys.append(printer[tool].params_park_y) if 'params_park_y' in printer[tool] -%}
        {%- endfor -%}
        {%- set dfy     = (dock_ys or [y_pos|float])|min -%}   # most-forward dock (most negative Y)
        { dfy + min_dist if y_pos|float - dfy < min_dist else None }
    {%- endmacro -%}

    {% import toolchanger_helper as tch with context %}

    {% set p, cfg   = printer, printer.configfile.settings %}
    {% set pp       = printer.save_variables.variables.get('probe_position', {}) %}
    {% set feed     = printer.toolchanger.params_fast_speed  %} 
    #{ tch.check_ok() }
    {% if pp is mapping and pp.values()|select|list|length >= 2 %} # just makes sure all xyz arent 0
        G90
        { tch.try_divide_accel() }
        {% if printer.toolhead.position[2] < pp.z + 3 %} 
            ROUNDED_G0 Z={pp.z + 8} D=10 F={feed/2}
        {% endif %}
        {% set safe_y = safe_y_away_from_docks(printer.toolhead.position.y, move_back_before_appraoch_y)|float(None) %}
        {% if safe_y is not none %}
            ROUNDED_G0 Y={safe_y} D=100 F={feed}
        {% endif %}
        ROUNDED_G0 X={pp.x}     D=100 F={feed}
        ROUNDED_G0 Y={pp.y}     D=100 F={feed}
        ROUNDED_G0 Z={pp.z + 2} D=0   F={feed/2}
    {% else %}
        { err("Missing probe_position in save variables... Run <code>TC_FIND_FIRST_CALIBRATION_PROBE_POSITION</code> first") }
    {% endif %}
    # ---< restore original accel/vel
    { tch.restore_vel() }


[gcode_macro TC_PROBE_CALIBRATION_PROBE]
variable_probe_extra_params: "SAMPLE_RETRACT_DIST=5"
variable_enable_probe_calibration: True
gcode:
    {% import toolchanger_helper as tch with context %}
    { tch.update_ttbz_from_svf(respond=False) }
    {% if 'T' in params %}
        {% set _actn = params.T|int(params.T) %}
    {% else %}
        {% set tc = printer.toolchanger %}
        {% if tc.has_detection %}
            {% set _actn = tc.detected_tool_number %}
        {% elif 'tool_probe_endstop' in printer %}
            {% set _actn = printer.tool_probe_endstop.active_tool_number %}
        {% elif 'probe_multiplexer' in printer %}
            {% set _actn = printer.probe_multiplexer.probe_number|int(-1) %}
        {% else %}
            {% set _actn = -1 %}
        {% endif %}
    {% endif %}
    {% set probe_calibration = enable_probe_calibration if 'PROBE' not in params else params.PROBE|int(0) %} 
    {% if 'tool_probe_endstop' in printer %}
        {% set probe_section = printer.tool_probe_endstop.active_tool_probe %}
    {% elif 'probe_multiplexer' in printer %}
        {% set probe_section = printer.probe_multiplexer.probe %}
    {% else %}
        {% set probe_section = None %}
    {% endif %}
    {% set cmd = 'TOOL_CALIBRATE_PROBE_OFFSET ' ~ ('PROBE="' ~ probe_section ~ '" ' if probe_section else '') %}
    { tch.check_ok() }
    M400
    {% if _actn not in printer.toolchanger.tool_numbers or _actn != printer.toolchanger.tool_number %}
        RESPOND TYPE=ERROR MSG="No tool active or bad toolnumber ({_actn}≠{printer.toolchanger.tool_number})"
    {% elif _actn == 0 or 'FORCE_LOCATE' in params %} # If we are T0
        SET_GCODE_OFFSET X=0 Y=0 Z=0
        MOVE_OVER_PROBE
        TOOL_LOCATE_SENSOR
        {(cmd ~ probe_extra_params) if probe_calibration else ''}
    {% else %}
        MOVE_OVER_PROBE
        TOOL_CALIBRATE_TOOL_OFFSET
        {(cmd ~ probe_extra_params) if probe_calibration else ''}
    {% endif %}


