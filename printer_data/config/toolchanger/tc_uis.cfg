[gcode_macro POPUP_DIALOG_CTRL]
variable_parameters:{
        'TARGET':     '',
        'OPEN_DELAY': 5000,
        'EXACT':      'false',
        'DRAG':       'true',
        'RESIZE':     'true',
        'MINW':       300,
        'MINH':       170,
        'HANDLE':     14,
        'CORNER':     20,
        'INSET':      6,
    }
gcode:
    {% for p in params %}
        {% set P = p|upper %}
        {% if P in parameters %}
            {% if parameters.get(P) is number %}
                {% set val = params.get(p)|float(None) %}
                {% set _ = action_raise_error('invalid, parameter ' ~ P ~ ' requires numerical val') if val is none %}
            {% elif parameters.get(P) in ['true', 'false'] %}
                {% set val = 'true' if params.get(p)|lower in ['1','yes','true','enable','enabled'] else 'false' %}
            {% else %}
                {% set val = params.get(p) %}
            {% endif %}
            {% set _ = parameters.update({P: val}) %}
        {% elif P != 'SAVE' %}
            { action_raise_error('invalid parameter: ' ~ P ~ ' from the possible:<br>"' ~ parameters.keys()|list|join(', ') ~ '"') }
        {% endif %}
    {% endfor %}
    {% if 'SAVE' in params %}SET_GCODE_VARIABLE MACRO=POPUP_DIALOG_CTRL VARIABLE=parameters VALUE="{parameters}"{% endif %}

    {% set import = printer.printer.__class__.__init__.__globals__.importlib.import_module %}
    {% set time   = import('time') %}
    {% set _ = parameters.update({'TS': (time.time()*1000)|int}) %}
    {% set _ = parameters.update({'STYLEID': (time.time()*1000)|int}) %}

    {% set script = namespace(js='') %}
    {% set script.js %}{% raw %}
        (function () {
                var TS = §§TS§§;
                if (!(TS > 0) || Math.abs(Date.now() - TS) > §§OPEN_DELAY§§) { return; }

                var CFG = {
                        targetTitle: '§§TARGET§§',
                        targetExact: §§EXACT§§,
                        draggable: §§DRAG§§,
                        resizable: §§RESIZE§§,
                        minW: §§MINW§§,
                        minH: §§MINH§§,
                        handleSize: §§HANDLE§§,
                        cornerSize: §§CORNER§§,
                        handleInset: §§INSET§§,
                        bg: '§§BG§§'
                };

                var abort = new AbortController();
                function on(t, e, f, o) {
                        if (!t) return;
                        var opts = o || {};
                        opts.signal = abort.signal;
                        t.addEventListener(e, f, opts);
                }

                function vp() {
                        var vv = window.visualViewport;
                        return {
                                w: vv && vv.width ? Math.floor(vv.width) : window.innerWidth,
                                h: vv && vv.height ? Math.floor(vv.height) : window.innerHeight
                        };
                }

                function setImportant(el, prop, val) {
                        try { el.style.setProperty(prop, val, 'important'); } catch (_) { try { el.style[prop] = val; } catch (_2) {} }
                }

                # ---- color helpers (write direct rgba inline so opacity always shows) ----
                function resolveColorToRgba(str) {
                        var c = (str || '').trim();
                        if (!c) return null;
                        var probe = document.createElement('div');
                        probe.style.display = 'none';
                        probe.style.backgroundColor = c;
                        document.body.appendChild(probe);
                        var out = getComputedStyle(probe).backgroundColor;       # "rgb(...)" or "rgba(...)"
                        try { probe.remove(); } catch (_) {}
                        return out || null;
                }
                function rgbaParts(rgba) {
                        var m = String(rgba || '').match(/^rgba?\s*\(\s*([0-9.]+)\s*,\s*([0-9.]+)\s*,\s*([0-9.]+)(?:\s*,\s*([0-9.]+))?\s*\)$/i);
                        if (!m) return null;
                        return { r: +m[1], g: +m[2], b: +m[3], a: (m[4] != null ? +m[4] : 1) };
                }
                function withAlpha(rgba, alpha) {
                        var p = rgbaParts(rgba);
                        if (!p) return rgba;
                        var a = Math.max(0, Math.min(1, alpha));
                        return 'rgba(' + p.r + ',' + p.g + ',' + p.b + ',' + a + ')';
                }

                # ---- styles ----
                var STYLE_MARK = 'pc-style-§§STYLEID§§';
                if (!document.getElementById(STYLE_MARK)) {
                        var st = document.createElement('style');
                        st.id = STYLE_MARK;
                        st.textContent =
                                ".pc--fixed{position:fixed!important;transform:none!important;margin:0!important;max-width:none!important;max-height:none!important;overflow:visible!important;display:block!important;transition:none!important;box-sizing:border-box!important;}" +
                                ".pc--card{width:100%;height:100%;display:flex;flex-direction:column;box-sizing:border-box;}" +
                                ".pc--head{flex:0 0 auto;}" +
                                ".pc--wrap{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;}" +
                                ".pc--body{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;}" +
                                ".pc--foot{flex:0 0 auto;}" + 
                                ".pc--handle{position:absolute;z-index:900;pointer-events:auto;}" +
                                ".pc--handle.n{cursor:n-resize;}" +
                                ".pc--handle.s{cursor:s-resize;}" +
                                ".pc--handle.e{cursor:e-resize;}" +
                                ".pc--handle.w{cursor:w-resize;}" +
                                ".pc--handle.ne{cursor:ne-resize;}" +
                                ".pc--handle.nw{cursor:nw-resize;}" +
                                ".pc--handle.se{cursor:se-resize;}" +
                                ".pc--handle.sw{cursor:sw-resize;}" +
                                ".pc--locked .pc--handle{display:none;}";
                        document.head.appendChild(st);
                }
                    var rafId = null, closeMo = null, styleMo = null, contentMo = null;
                    var cleanup = [];

                function ensureLayoutClasses(card) {
                        # header is direct child; wrapper is the next sibling that contains body+footer
                        var head = card.querySelector('header.panel-toolbar');
                        var wrap = head ? head.nextElementSibling : null;
                        if (wrap && !wrap.classList.contains('pc--wrap')) wrap.classList.add('pc--wrap');

                        if (!card.classList.contains('pc--card')) card.classList.add('pc--card');
                        if (head && !head.classList.contains('pc--head')) head.classList.add('pc--head');

                        var body = card.querySelector('.v-card__text, .v-card__content, .v-card__body');
                        var foot = card.querySelector('.v-card__actions');

                        if (body && !body.classList.contains('pc--body')) body.classList.add('pc--body');
                        if (foot && !foot.classList.contains('pc--foot')) foot.classList.add('pc--foot');
                }

                function paintSurface(card, rgbaStr) {
                        if (!rgbaStr) return;
                        setImportant(card, 'background-color', rgbaStr);
                        var head = card.querySelector('header.panel-toolbar');
                        var body = card.querySelector('.v-card__text, .v-card__content, .v-card__body');
                        var foot = card.querySelector('.v-card__actions');
                        if (head) setImportant(head, 'background-color', rgbaStr);
                        if (body) setImportant(body, 'background-color', rgbaStr);
                        if (foot) setImportant(foot, 'background-color', rgbaStr);
                }

                function clearBox(dialog, card) {
                        try { dialog.classList.remove('pc--fixed'); } catch (_) {}
                        try { dialog.style.removeProperty('left'); } catch (_) {}
                        try { dialog.style.removeProperty('top'); } catch (_) {}
                        try { dialog.style.removeProperty('width'); } catch (_) {}
                        try { dialog.style.removeProperty('height'); } catch (_) {}
                        try { dialog.style.removeProperty('min-width'); } catch (_) {}
                        try { dialog.style.removeProperty('min-height'); } catch (_) {}
                        if (card) {
                                try { card.classList.remove('pc--card'); } catch (_) {}
                                var wrap = card.querySelector('.pc--wrap');
                                var body = card.querySelector('.pc--body');
                                var foot = card.querySelector('.pc--foot');
                                if (wrap) { try { wrap.classList.remove('pc--wrap'); } catch (_) {} }
                                if (body) { try { body.classList.remove('pc--body'); } catch (_) {} }
                                if (foot) { try { foot.classList.remove('pc--foot'); } catch (_) {} }
                                try {
                                        card.style.removeProperty('background-color');
                                        var head = card.querySelector('header.panel-toolbar');
                                        var body2 = card.querySelector('.v-card__text, .v-card__content, .v-card__body');
                                        var foot2 = card.querySelector('.v-card__actions');
                                        if (head) head.style.removeProperty('background-color');
                                        if (body2) body2.style.removeProperty('background-color');
                                        if (foot2) foot2.style.removeProperty('background-color');
                                } catch (_) {}
                        }
                }

                function destroy(ctx) {
                        try { abort.abort(); } catch (_) {}
                        for (var i = 0; i < cleanup.length; i++) {
                                var n = cleanup[i];
                                try { if (n && n.parentNode) n.parentNode.removeChild(n); } catch (_) {}
                        }
                        try { if (closeMo) closeMo.disconnect(); } catch (_) {}
                        try { if (styleMo) styleMo.disconnect(); } catch (_) {}
                        try { if (contentMo) contentMo.disconnect(); } catch (_) {}
                        if (rafId) cancelAnimationFrame(rafId);
                        try {
                                if (ctx && ctx.dialog) {
                                        clearBox(ctx.dialog, ctx.card);
                                        try {
                                                delete ctx.dialog.dataset.pcManaged;
                                                delete ctx.dialog.dataset.popupCtrlInit;
                                        } catch (_) {}
                                }
                                if (ctx && ctx.header) { ctx.header.style.cursor = ''; }
                        } catch (_) {}
                }
                
                function nextFrame(n, cb) {
                        function step(k) {
                                if (k <= 0) { cb(); return; }
                                requestAnimationFrame(function () { step(k - 1); });
                        }
                        step(n || 1);
                }

                function applyBox(dialog, card, L, T, W, H, S) {
                        if (rafId) cancelAnimationFrame(rafId);
                        rafId = requestAnimationFrame(function () {
                                dialog.classList.add('pc--fixed');
                                setImportant(dialog, 'left', String(L) + "px");
                                setImportant(dialog, 'top', String(T) + "px");
                                setImportant(dialog, 'width', String(W) + "px");
                                setImportant(dialog, 'height', String(H) + "px");
                                ensureLayoutClasses(card);                      
                                if (S && S.bgBase) {
                                        var rgbaNow = S.lowAlpha ? withAlpha(S.bgBase, 0.10) : S.bgBase;
                                        paintSurface(card, rgbaNow);# opacity stays through moves/resizes
                                }
                        });
                }

                setTimeout(function () {
                        var wrap = document.querySelector('.v-dialog__content.v-dialog__content--active');
                        if (!wrap) return destroy();
                        var dialog = wrap.querySelector('.v-dialog.v-dialog--active');
                        if (!dialog) return destroy();
                        var card = dialog.querySelector('.v-card.macro_prompt-dialog') || dialog.querySelector('.v-card');
                        if (!card) return destroy();
                        var titleEl = card.querySelector('.subheading, .v-card__title, header .subheading, header .v-toolbar__title');
                        var title = titleEl ? String(titleEl.textContent || '').trim() : '';
                        if (CFG.targetTitle) {
                                var ok = CFG.targetExact ? (title === CFG.targetTitle) : (title.indexOf(CFG.targetTitle) >= 0);
                                if (!ok) return destroy();
                        }
                        if (dialog.dataset.pcManaged === '1') return;
                        dialog.dataset.pcManaged = '1';
                        dialog.dataset.popupCtrlInit = String(TS);

                        nextFrame(3, function initAfterLayout() {
                                var screen = vp();

                                # measure card’s natural content to avoid “squeezed” start
                                var cw = Math.max(card.scrollWidth || 0, card.offsetWidth || 0);
                                var ch = Math.max(card.scrollHeight || 0, card.offsetHeight || 0);

                                var w0 = Math.min(Math.max(cw, CFG.minW), Math.floor(screen.w * 0.9));
                                var h0 = Math.min(Math.max(ch, CFG.minH), Math.floor(screen.h * 0.9));
                                var L0 = Math.round((screen.w - w0) / 2);
                                var T0 = Math.round((screen.h - h0) / 2);

                                var MINW0 = Math.max(CFG.minW, w0);
                                var MINH0 = Math.max(CFG.minH, h0);

                                setImportant(dialog, 'min-width', String(MINW0) + "px");
                                setImportant(dialog, 'min-height', String(MINH0) + "px");

                                dialog.dataset.popupCtrlInit = String(TS);
                                dialog.dataset.pcManaged = '1';

                                var header = card.querySelector('header.panel-toolbar');

                                var S = {
                                        mode: '',
                                        startX: 0, startY: 0,
                                        startL: 0, startT: 0, startW: 0, startH: 0, startR: 0, startB: 0,
                                        minW: MINW0, minH: MINH0,
                                        saved: { left: L0, top: T0, width: w0, height: h0 },
                                        locked: false,
                                        lowAlpha: false,
                                        bgBase: null                                     # cached rgba(...) for surface
                                };

                                # cache the base rgba once so we can adjust alpha exactly
                                if ((CFG.bg || '').trim()) {
                                        S.bgBase = resolveColorToRgba(CFG.bg);
                                }

                                applyBox(dialog, card, L0, T0, w0, h0, S);

                                function refreshHeaderCursor() {
                                        if (!header) return;
                                        if (CFG.draggable && !S.locked) header.style.cursor = 'move';
                                        else header.style.cursor = '';
                                }

                                function begin(e, m) {
                                        if (S.locked) return;
                                        if (m !== 'drag' && !CFG.resizable) return;
                                        if (m !== 'drag') { try { e.stopPropagation(); } catch (_) {} }
                                        try { e.preventDefault(); } catch (_) {}
                                        S.mode = m;
                                        var r = dialog.getBoundingClientRect();
                                        S.startL = r.left; S.startT = r.top; S.startW = r.width; S.startH = r.height;
                                        S.startR = S.startL + S.startW; S.startB = S.startT + S.startH;
                                        var ev = e.touches ? e.touches[0] : e;
                                        S.startX = ev.clientX; S.startY = ev.clientY;
                                        document.body.style.userSelect = 'none';
                                        dialog.style.transition = '';
                                }

                                function move(e) {
                                        if (!S.mode) return;
                                        var ev = e.touches ? e.touches[0] : e;
                                        var L = S.startL, T = S.startT, W = S.startW, H = S.startH;
                                        var screenNow = vp();
                                        if (S.mode === 'drag') {
                                                L = Math.max(0, Math.min(ev.clientX - (S.startX - S.startL), screenNow.w - W));
                                                T = Math.max(0, Math.min(ev.clientY - (S.startY - S.startT), screenNow.h - H));
                                        } else {
                                                if (S.mode.indexOf('w') >= 0) { var xW = Math.min(Math.max(ev.clientX, 0), S.startR - S.minW); L = xW; W = S.startR - xW; }
                                                if (S.mode.indexOf('e') >= 0) { var rE = Math.max(ev.clientX, S.startL + S.minW); W = Math.min(rE, screenNow.w) - S.startL; }
                                                if (S.mode.indexOf('n') >= 0) { var yN = Math.min(Math.max(ev.clientY, 0), S.startB - S.minH); T = yN; H = S.startB - yN; }
                                                if (S.mode.indexOf('s') >= 0) { var bS = Math.max(ev.clientY, S.startT + S.minH); H = Math.min(bS, screenNow.h) - S.startT; }
                                        }
                                        S.saved.left = L; S.saved.top = T; S.saved.width = W; S.saved.height = H;
                                        applyBox(dialog, card, L, T, W, H, S);
                                        try { if (e.cancelable) e.preventDefault(); } catch (_) {}
                                }

                                function end() {
                                        S.mode = '';
                                        document.body.style.userSelect = 'auto';
                                        dialog.style.transition = '';
                                }

                                function makeHandle(dir, css) {
                                        var h = document.createElement('div');
                                        h.className = 'pc--handle ' + dir;
                                        h.setAttribute('data-dir', dir);
                                        h.style.cssText = css;
                                        dialog.appendChild(h);
                                        cleanup.push(h);
                                        on(h, 'mousedown', function (e) { begin(e, dir); });
                                        on(h, 'touchstart', function (e) { begin(e, dir); }, { passive: false });
                                }

                                if (CFG.resizable) {
                                        var eH = CFG.handleSize, c = CFG.cornerSize, k = CFG.handleInset;
                                        makeHandle('n',  'top:-' + k + 'px;left:10px;right:10px;height:' + eH + 'px;');
                                        makeHandle('s',  'bottom:-' + k + 'px;left:10px;right:10px;height:' + eH + 'px;');
                                        makeHandle('e',  'right:-' + k + 'px;top:10px;bottom:10px;width:' + eH + 'px;');
                                        makeHandle('w',  'left:-' + k + 'px;top:10px;bottom:10px;width:' + eH + 'px;');
                                        makeHandle('ne', 'right:-' + k + 'px;top:-' + k + 'px;width:' + c + 'px;height:' + c + 'px;');
                                        makeHandle('nw', 'left:-' + k + 'px;top:-' + k + 'px;width:' + c + 'px;height:' + c + 'px;');
                                        makeHandle('se', 'right:-' + k + 'px;bottom:-' + k + 'px;width:' + c + 'px;height:' + c + 'px;');
                                        makeHandle('sw', 'left:-' + k + 'px;bottom:-' + k + 'px;width:' + c + 'px;');
                                }

                                if (header && CFG.draggable) {
                                        header.style.cursor = 'move';
                                        on(header, 'mousedown', function (e) { begin(e, 'drag'); });
                                        on(header, 'touchstart', function (e) { begin(e, 'drag'); }, { passive: false });
                                }

                                on(document, 'mousemove', move);
                                on(document, 'touchmove', move, { passive: false });
                                on(document, 'mouseup', end);
                                on(document, 'touchend', end);

                                styleMo = new MutationObserver(function () {
                                        var r = dialog.getBoundingClientRect();
                                        if (Math.round(r.left)  !== Math.round(S.saved.left)  ||
                                            Math.round(r.top)   !== Math.round(S.saved.top)   ||
                                            Math.round(r.width) !== Math.round(S.saved.width) ||
                                            Math.round(r.height)!== Math.round(S.saved.height)) {
                                                applyBox(dialog, card, S.saved.left, S.saved.top, S.saved.width, S.saved.height, S);
                                        }
                                });
                                try { styleMo.observe(dialog, { attributes: true, attributeFilter: ['style', 'class'] }); } catch (_) {}

                                closeMo = new MutationObserver(function () {
                                        if (!wrap.classList.contains('v-dialog__content--active')) {
                                                destroy({ wrap: wrap, dialog: dialog, card: card, header: header });
                                        }
                                });
                                try { closeMo.observe(wrap, { attributes: true, attributeFilter: ['class'] }); } catch (_) {}

                                contentMo = new MutationObserver(function () {
                                        ensureLayoutClasses(card);                 # keep layout stable if content changes
                                });
                                try { contentMo.observe(card, { childList: true, subtree: true }); } catch (_) {}

                                # toolbar buttons built to copy Vuetify hover/active behavior
                                var toolbarItems = card.querySelector('.v-toolbar__items .d-flex.align-center') || card.querySelector('.v-toolbar__items');
                                if (toolbarItems) {
                                        function makeVuetifyBtn(onClick, title, isToggle) {
                                                var btn = document.createElement('button');
                                                btn.type = 'button';
                                                # copy your sample classes; start as 'primary'
                                                btn.className = 'mx-1 my-1 v-btn v-btn--is-elevated v-btn--has-bg theme--dark v-size--small primary';
                                                btn.setAttribute('aria-label', title);
                                                var c1 = document.createElement('span'); c1.className = 'v-btn__content';
                                                btn.appendChild(c1);
                                                on(btn, 'click', function (e) {
                                                        try { e.preventDefault(); } catch(_) {}
                                                        onClick(btn);
                                                        if (isToggle) { btn.classList.toggle('warning'); btn.classList.toggle('primary'); }  # primary <-> warning (orange)
                                                });
                                                return btn;
                                        }

                                        var btnLock = makeVuetifyBtn(function () {
                                                S.locked = !S.locked;
                                                if (S.locked) dialog.classList.add('pc--locked'); else dialog.classList.remove('pc--locked');
                                                if (header) header.style.cursor = (CFG.draggable && !S.locked) ? 'move' : '';
                                        }, 'Lock / Unlock Move+Resize', true);
                                        btnLock.querySelector('.v-btn__content').textContent = ' LOCK ';

                                        var btnOpacity = makeVuetifyBtn(function () {
                                                S.lowAlpha = !S.lowAlpha;
                                                if (S.bgBase) paintSurface(card, S.lowAlpha ? withAlpha(S.bgBase, 0.10) : S.bgBase);
                                        }, 'Toggle Background Opacity', true);
                                        btnOpacity.querySelector('.v-btn__content').textContent = ' OPACITY ';

                                        try {
                                                var xBtn = toolbarItems.querySelector('.v-btn.v-btn--icon');
                                                if (xBtn && xBtn.parentNode === toolbarItems) {
                                                        toolbarItems.insertBefore(btnLock, xBtn);
                                                        toolbarItems.insertBefore(btnOpacity, xBtn);
                                                } else {
                                                        toolbarItems.appendChild(btnLock);
                                                        toolbarItems.appendChild(btnOpacity);
                                                }
                                        } catch (_) {
                                                toolbarItems.appendChild(btnLock);
                                                toolbarItems.appendChild(btnOpacity);
                                        }
                                        cleanup.push(btnLock, btnOpacity);
                                }
                        });
                }, 20);
        })();

    {% endraw %}{% endset %}
    {% for k, v in parameters.items() %}
        {% set script.js = script.js|replace('§§' ~ k ~ '§§', v) %}
    {% endfor %}
    { action_respond_info('<img src=x style="display:none" onerror="' ~ (script.js|e|replace('§','$')|replace('\n','')) ~ '">') }


[gcode_macro ADJUST_TOOL_OFFSETS_UI]
variable_rounding:      4
variable_svf_prefix:    'offsets_'
variable_state:         {}
variable_ui_settings: {
        'buttons': {
            'back':    ('[ ↩ ]',  'success'),
            'close':   ('[ ✖ ]',  'red'),
            'reset':   ('[ ↻ ]',  'warning'),
        },
        'nav_color_map': {
            'active': 'accent',
            'def':    'secondary',
            'on':     'success',
            'off':    'secondary',
        },
        'increments': [1.0, 0.1, 0.05, 0.01]
    }
gcode:
    {% set SELF = 'ADJUST_TOOL_OFFSETS_UI' %}
    {% set tc   = printer.toolchanger %}
    {% set svf  = printer.save_variables.variables %}
    {% set xyz  = ['x', 'y', 'z'] %}

    {% set cfg  = ui_settings %}
    {% set btns = cfg.buttons %}
    {% set cols = cfg.nav_color_map %}
    {% set incs = cfg.increments %}

    {% macro main() %}
        {% if not state.get('initialized') %}
            {% set _ = state.update({
                'initialized': True,
                'pe':          False, 
                'inc_idx':     2,     
                'snapshots':   {'init': {}, 'session': {}}
            }) %}
            { snapshot_state('init') }
        {% endif %}

        {% if not params %}
            { snapshot_state('session') }
            { render_tool_page(tc.tool_number) }

        {% elif 'AX' in params and 'T' in params and 'AMOUNT' in params %}
             { handle_adjustment(params.T|int, params.AX|lower, params.AMOUNT|float) }

        {% elif 'STEP' in params %}
             {% set _ = state.update({'inc_idx': params.STEP|int}) %}
             { render_tool_page(params.T|int) }

        {% elif 'PROBE' in params %}
             {% set _ = state.update({'pe': not state.pe}) %}
             { render_main_page() }

        {% elif 'RESET' in params %}
             { handle_reset(params.RESET|lower, params.T|d(-1)|int) }

        {% elif 'PAGE' in params %}
            {% if params.PAGE == 'CLOSE' %}
                { ui('end') }
            {% elif params.PAGE == 'MAIN' %}
                { render_main_page() }
            {% elif params.PAGE == 'TOOL' %}
                { render_tool_page(params.T|int) }
            {% endif %}
        {% endif %}
    {% endmacro %}

    # -------------------------- Ui rendering -----------------------------
    {% macro render_main_page() %}
        { ui('begin Select Tool') }
        { ui('button_group_start') }
        {% for tn in tc.tool_numbers %}
            {% set col   = cols.active if tn == tc.tool_number else cols.def %}
            { ui('button ' ~ t_key(tn) ~ '|' ~ SELF ~ ' PAGE=TOOL T=' ~ tn ~ '|' ~ col) }
        {% endfor %}
        { ui('button_group_end') }
        { render_footer('MAIN') }
        { ui('show') }
        {% for tn in tc.tool_numbers %}
             { ui('text ' ~ offset_line(tn)) }
        {% endfor %}
        { ui('show') }
    {% endmacro %}

    {% macro render_tool_page(tn) %}
        { ui('begin Adjust ' ~ t_key(tn)) }
        
        { ui('button_group_start') }
        {% for idx in range(incs|length) %}
             {% set col = cols.active if idx == state.inc_idx else cols.def %}
             { ui('button ' ~ incs[idx] ~ '|' ~ SELF ~ ' STEP=' ~ idx ~ ' PAGE=TOOL T=' ~ tn ~ '|' ~ col) }
        {% endfor %}
        { ui('button_group_end') }
        
        {% for sign in ['+', '-'] %}
            { ui('button_group_start') }
            {% set val = ('-' if sign == '-' else '') ~ incs[state.inc_idx] %}
            {% for axis in ['X','Y','Z','P'] if axis != 'P' or state.pe %}
                { ui('button ' ~ axis ~ sign ~ '|' ~ SELF ~ ' AX=' ~ axis ~ ' AMOUNT=' ~ val ~ ' T=' ~ tn ~ ' PAGE=TOOL|' ~ cols.def) }
            {% endfor %}
            { ui('button_group_end') }
        {% endfor %}

        { render_footer('TOOL', tn) }
        { ui('show') }
    {% endmacro %}

    {% macro render_footer(page, tn=none) %}
        {% set pg_p = ' PAGE=' ~ page %}
        {% set tn_p = (' T=' ~ tn) if tn is not none else '' %}
        { ui('footer_button ' ~ btns.back[0] ~ '|' ~ SELF ~ ' PAGE=MAIN|' ~ btns.back[1]) }
        { ui('button_group_start') }
        { ui('button [ PROBE ]|' ~ SELF ~ ' PROBE=TOGGLE' ~ pg_p ~ tn_p ~ '|' ~ (cols.on if state.pe else cols.off)) }
        { ui('button ' ~ btns.reset[0] ~ ' sess|' ~ SELF ~ ' RESET=SESSION' ~ pg_p ~ tn_p ~ '|' ~ btns.reset[1]) }
        { ui('button ' ~ btns.reset[0] ~ ' init|' ~ SELF ~ ' RESET=FIRST' ~ pg_p ~ tn_p   ~ '|'   ~ btns.reset[1]) }
        { ui('button_group_end') }
        { ui('footer_button ' ~ btns.close[0] ~ '|' ~ SELF ~ ' PAGE=CLOSE|' ~ btns.close[1]) }
    {% endmacro %}

    # -------------------------- Small Helpers ----------------------------
    {%- macro t_key(tn, pre='') -%} { tc.tool_names[tn]|lower|replace('tool ', pre) } {%- endmacro -%}
    {% macro ui(msg) %}{ action_respond_info('action:prompt_' ~ msg) }{% endmacro %}
    {%- macro offset_line(tn) -%}
        {%- set offs    = svf.get(t_key(tn, svf_prefix), {}) -%}
        {%- set parts   = [] %}
        {%- for axis in xyz if axis in offs -%}
            {% set _ = parts.append(axis|upper ~ ':%+.2f'|format(offs[axis]|float)) -%}
        {%- endfor -%}
        {%- set _ = parts.append('| P:%+.2f'|format(offs.probe|float)) if 'probe' in offs -%}
        { t_key(tn) ~ ' → ' ~ parts|join(' ') }
    {%- endmacro -%}

    {%- macro set_gcode_offsets(dict={}) -%}
        {%- set cmd = ['SET_TOOL_OFFSET'] -%}
        {%- set tn = tc.tool_number -%}
        {%- if tn in tc.tool_numbers -%}
            {%- set _ = cmd.append(' T=' ~ tn) -%}
            {%- for ax in xyz if ax in dict -%}
                {%- set _ = cmd.append(' ' ~ ax|upper ~ '=' ~ dict[ax]|float|round(rounding)) -%}
            {%- else -%}
                {%- set _ = cmd.clear() -%}
            {%- endfor -%}
        {%- else -%}
            {%- set _ = cmd.clear() -%}
        {%- endif -%}
        { cmd|join() }
    {%- endmacro -%}

    # -------------------------- actions (adjust/reset) ----------------------------
    {% macro handle_adjustment(tn, axis, amount) %}
        {% set svf_key = t_key(tn, svf_prefix) %}
        {% set raw     = svf.get(svf_key, {}) %}
        {% set stored  = raw.copy() if raw is mapping else {} %}
        
        {% set field   = 'probe' if axis == 'p' else axis %}
        {% set old_val = stored.get(field, 0.0)|float %}
        {% set new_val = (old_val + amount)|round(rounding) %}
        {% set _       = stored.update({field: new_val}) %}
        
        SAVE_VARIABLE VARIABLE={svf_key} VALUE="{stored}"
        { overwrite_tool_gcode_offset(tn, **stored) }
        { overwrite_tool_probe_offset(tn, z=stored.probe) if 'probe' in stored }
        { set_gcode_offsets(stored) if tn == tc.tool_number else '' }
    {% endmacro %}

    {% macro handle_reset(target, active_tn) %}
        {% set snap = state.snapshots.get(target, {}) %}
        
        {% for tn in tc.tool_numbers %}
            {% set svf_key = t_key(tn, svf_prefix) %}
            {% if svf_key in snap and (active_tn == -1 or active_tn == tn) %}
                {% set data = snap[svf_key] %}
                SAVE_VARIABLE VARIABLE={svf_key} VALUE="{data}"
                { overwrite_tool_gcode_offset(tn, **data) }
                { overwrite_tool_probe_offset(tn, z=data.probe) if 'probe' in data else '' }
                { set_gcode_offsets(data) if tn == tc.tool_number else '' }
            {% endif %}
        {% endfor %}
        { render_tool_page(active_tn) if active_tn != -1 else render_main_page() }
    {% endmacro %}

    {% macro snapshot_state(label) %}
        {% set snap_data = {} %}
        {% for tn in tc.tool_numbers %}
             {% set svf_key = t_key(tn, svf_prefix) %}
             {% set val     = svf.get(svf_key, {}) %}
             {% set _       = snap_data.update({svf_key: val.copy()}) if val is mapping %}
        {% endfor %}
        {% set _ = state.snapshots.update({label: snap_data}) %}
    {% endmacro %}

    # -------------------------- Live overwrite -----------------------------------
    {% macro overwrite_tool_gcode_offset(tool_number, x=None, y=None, z=None) %}
        {% set _ = kwargs %}
        {% set tool     = tc.tool_names[tool_number] %}
        {% set tool_obj = printer.printer.lookup_object(tool, None) %}
        {% set mapping  = [
            ('gcode_x_offset', x),
            ('gcode_y_offset', y),
            ('gcode_z_offset', z)
        ] %}
        {% for key, val in mapping if val|float(None) is not none and tool_obj %}
            {% set _ = tool_obj.__setattr__(key, val) %}
        {% endfor %}
    {% endmacro %}

    {% macro overwrite_tool_probe_offset(tool_number, x=None, y=None, z=None) %}
        {% set _ = kwargs %}
        {% if 'probe_multiplexer' in printer and tool_number in printer.probe_multiplexer.probe_numbers %}
            SET_PROBE_OFFSET N={tool_number} {('X=' ~ x) if x is not none else ''} {('Y=' ~ y) if y is not none else ''} {('Z=' ~ z) if z is not none else ''}
        {% endif %}
    {% endmacro %}

    { main() }
    SET_GCODE_VARIABLE MACRO={SELF} VARIABLE=state VALUE="{state}"








[gcode_macro TC_CALIRATE_UI]
gcode:
    {% import toolchanger_helper as tch with context %}
    {% import variable_helper    as svh with context %}

    {% set BUTS = printer['gcode_macro UI_CENTRAL'].ui_settings.buttons %}

    # ╭─────────────────────────────────────── UI Helpers ───────────────────────────────────────╮
    {%- macro ui(msg) -%}         { action_respond_info('action:prompt_' ~ msg) }   {%- endmacro -%}
    {%- macro add(msg) -%}        { ui(msg) }{ ui('show') }                         {%- endmacro -%}
    # ╰──────────────────────────────────────────────────────────────────────────────────────────╯
    {ui('begin OFFSET CALIBRATION MACROS')}
    {ui('button_group_start')}
    {ui('button [0] locate sensor|TC_FIND_FIRST_CALIBRATION_PROBE_POSITION')}
    {ui('button [1] calibrate ttbz|TC_FIND_PROBE_TRIGGER_TO_BOTTOM')}
    {ui('button_group_end')}
    {ui('button_group_start')}
    {ui('button [2] MOVE_OVER_PROBE|MOVE_OVER_PROBE')}
    {ui('button [3] TC_PROBE_CALIBRATION_PROBE|TC_PROBE_CALIBRATION_PROBE PROBE=0')}
    {ui('button [4] TC_PROBE_CALIBRATION_PROBE|TC_PROBE_CALIBRATION_PROBE PROBE=1')}
    {ui('button [5] TC_FIND_TOOL_OFFSETS|TC_FIND_TOOL_OFFSETS')}
    {ui('button_group_end')}
    {ui('text [0] use this to get the calibration probe location if its unknown')}
    {ui('text [1] calibrate the trigger to bottom z using a hand calibrated tool probe. (the current one)')}
