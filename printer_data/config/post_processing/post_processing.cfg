[gcode_macro SDCARD_PRINT_FILE]
rename_existing: _SDCARD_PRINT_FILE
description: "Wrapper that calls the postprocessor before printing from virtual_sdcard"
gcode:
    {% set vsd_root = printer.configfile.settings.virtual_sdcard.path %}
    {% set sep      = '/' if not vsd_root.endswith('/') else '' %}
    {% set fullpath = vsd_root ~ sep ~ (params.FILENAME or '') %}
    GCODE_POSTPROCESS PATH="{fullpath}"
    _SDCARD_PRINT_FILE {rawparams}


[gcode_macro GCODE_POSTPROCESS]
description: "Run configured Python postprocessors over a G-code file"
variable_settings: {
        'scripts_dir':   '~/printer_data/config/post_processing/post_processors',
        'python_path':   '',
        'order':         [
            # for example if they were order dependant:
            # 'thumbnail_move',
            # 'prime_tower_exclude'
        ],
        'stop_on_error': False,
        'header_prefix': '; POSTPROC'
    }
gcode:
    {% set SELF = 'GCODE_POSTPROCESS' %}

    {% set gbl     = printer.printer.__class__.__init__.__globals__ %}
    {% set imp_mod = gbl.importlib.import_module %}
    {% set sp      = imp_mod('subprocess') %}
    {% set bi      = imp_mod('builtins') %}
    {% set os      = imp_mod('os') %}
    {% set sys     = imp_mod('sys') %}
    {% set time    = imp_mod('time') %}



    {%- macro main() -%}
        {% set scripts_dir = validate_dir(settings.scripts_dir, 'scripts_dir') %}
        {% set python      = resolve_py_path(settings.python_path) %}
        {% set order       = settings.order|map('string')|map('trim')|list %}

        {% set _ = filenames_in_dir(order, scripts_dir, type='.py') 
                   if scripts_dir and (not order or not order|length
        ) %}

        {% set target_file = resolve_gcode_file(params.PATH or params.FILE or params.TARGET or '') %}
        {% set target      = validate_file(target_file, 'gcode file', hard=True) %}

        {% set processed   = (get_already_postprocessed(target, settings.header_prefix)).split('\n')|list %}
        {% set work_list   = order|reject('in', processed)|list %}
        {% set ran         = order|select('in', processed)|list %}
        {% set _ = log(
            "Skipping processors (already ran):<br>  -\"" ~ ran|join('"<br>  -"') ~ '"<br> '
        ) if ran %}
        {% if python and scripts_dir and work_list %}
            { log("Target: <code>" ~ target ~ "</code>") }
            {% for name in work_list %}
                {% set script = resolve_script(scripts_dir, name) %}
                {% if script %}
                    { timer() }
                    {% set res = sp.run(
                        [python, script, target],
                        capture_output=True,
                        text=True
                    ) %}
                    {% if res.returncode %}
                        { log("Processor '" ~ name ~ "' failed  (" ~ timer() ~ ") (Code " ~ res.returncode ~ "). Check details.", color='--v-warning-base') }
                        { handle_error("<b>Error Output:</b><br/>" ~ res.stderr|replace('\n', '<br/>')) }
                    {% else %}
                        { log("Processor '" ~ name ~ "' finished successfully.  (" ~ timer() ~ ")") }
                        { mark_postprocessed(target, settings.header_prefix, name) }
                    {% endif %}
                {% endif %}
            {% endfor %}
            { msg("Post-processing complete on " ~ target.split('/')|last) }
        {% else %}
            { msg("No post-processors to run or already processed.") }
        {% endif %}
    {%- endmacro -%}

    {% set t = namespace(start=None) %}
    {%- macro timer() -%}
        {%- set now = time.time() -%}
        {%- if t.start is none -%}
            {%- set t.start = now -%}
        {%- else -%}
            {%- set dt = (now - t.start) * 1000.0 -%}
            { dt|int ~ 'ms' }
            {%- set t.start = none -%}
        {%- endif -%}
    {%- endmacro -%}

    {% set summary = [] %}
    {%- macro log(s, color='') -%}
        {%- set style = 'style="margin: 0; color: var(' ~ (color if color else "--p-text-color2") ~ ');"' -%}
        {%- set _ = summary.append('<div ' ~ style ~ '>' ~ s ~ '</div>') -%}
    {%- endmacro -%}

    {%- macro msg(s, is_error=False) -%}
        # Config
        {%- set desc = printer.configfile.settings['gcode_macro ' ~ SELF|lower].description|trim|trim('"')|trim("'") -%}
        {%- set prefix_color = "--v-error-base, red"      if is_error else "--v-accent-base" -%}
        {%- set text_color   = "--v-warning-base, orange" if is_error else "--p-text-color2" -%}
        {%- set action       = action_raise_error         if is_error else action_respond_info -%}
        
        {%- set prefix_html  = "<span style=\"color: var(" ~ prefix_color ~ "); font-weight:bold;\" title=\"" ~ desc ~ "\">" ~ SELF ~ " </span>" -%}
        {%- set msg_html     = "<span style=\"color: var(" ~ text_color ~ ");\" title=\"" ~ desc ~ "\">" ~ s ~ "</span>" -%}

       {%- if summary -%}
            {%- set content = summary|join -%}
            {%- set block_style = "margin-top:5px; padding:5px 10px; border-radius:4px; font-size:0.75em; border:1px solid var(--p-border); background:var(--p-background-darker);" -%}
            {%- set details_block = "<div style='" ~ block_style ~ "'>" ~ content ~ "</div>" -%}
            { action("<details><summary>" ~ prefix_html ~ msg_html ~ "</summary>" ~ details_block ~ "</details>") }
        {%- else -%}
            { action(prefix_html ~ msg_html) -}
        {%- endif -%}
    {%- endmacro -%}

    {%- macro handle_error(s, force_raise=False) -%}
        {%- set _ = msg(s, is_error=True) 
                    if force_raise or settings.stop_on_error 
                    else log(s, color='--v-warning-base, orange') -%}
    {%- endmacro -%}
    {%- macro normpath(p='') -%} { os.path.abspath(os.path.expanduser(p)) } {%- endmacro -%}

    {%- macro filenames_in_dir(names, dir='', type='.py') -%}
        {% if dir and os.path.isdir(dir) and type %}
            {% for entry in os.listdir(dir)|sort if entry.endswith(type) %}
                {% set full = os.path.join(dir, entry) %}
                {% set _ = names.append(entry) if os.path.isfile(full) if names is iterable %}
            {% endfor %}
        {% endif %}
    {%- endmacro -%}

    {%- macro validate_dir(p, label, hard=True) -%}
        {%- set p = normpath(p) -%}
        {%- if not p -%}
            { handle_error(label ~ " is empty", force_raise=hard) }
        {%- elif not os.path.isdir(p) -%}
            { handle_error(label ~ " is not a directory: " ~ p, force_raise=hard) }
        {%- else -%}
            { p }
        {%- endif -%}
    {%- endmacro -%}

    {%- macro validate_file(p, label='file', hard=True) -%}
        {%- set p = normpath(p) -%}
        {%- if not p or not os.path.exists(p) -%}
            { handle_error("Target " ~ label ~ " does not exist: " ~ p, force_raise=hard) }
        {%- else -%}
            { p }
        {%- endif -%}
    {%- endmacro -%}

    {%- macro resolve_py_path(path='') -%}
        {%- if path and path|trim -%}
            { normpath(path|trim) }
        {%- else -%}
            { sys.executable if sys and sys.executable else 'python3' }
        {%- endif -%}
    {%- endmacro -%}

    {%- macro resolve_gcode_file(path='') -%}
        {%- if not (path.startswith('/') or path.startswith('~')) -%}
            {%- set base = printer.configfile.settings.virtual_sdcard.path or '' -%}
            {%- set name = path or printer.print_stats.filename -%}
            {%- set path = (base ~ ('/' if not base.endswith('/') else '') ~ name) if (base and name) else '' -%}
        {%- endif -%}
        { normpath(path) }
    {%- endmacro -%}

    {%- macro resolve_script(scripts_dir, name) -%}
        {%- set base = os.path.join(scripts_dir, name) -%}
        {%- if os.path.exists(base) -%}
            { base }
        {%- elif not name.endswith('.py') -%}
            {%- set candidate = os.path.join(scripts_dir, name ~ '.py') -%}
            { validate_file(candidate, label='postprocessor', hard=False) }
        {%- else -%}
            { handle_error("Postprocessor script not found: " ~ name, force_raise=False) }
        {%- endif -%}
    {%- endmacro -%}

    {%- macro get_already_postprocessed(target, header_prefix) -%}
        {%- set header_start  = header_prefix ~ '_BLOCK_START' -%}
        {%- set header_end    = header_prefix ~ '_BLOCK_END'   -%}

        {%- if os.path.exists(target) -%}
            {%- set fh   = bi.open(target, 'r', encoding='utf-8', errors='ignore') -%}
            {%- set data = fh.read(4096) -%}
            {%- set _    = fh.close() -%}

            {%- set start = data.find(header_start) -%}
            {%- set end   = data.find(header_end, start + header_start|length) if start != -1 else -1 -%}
            {%- set segment = data[start:end] if (start != -1 and end != -1 and end > start) else '' -%}

            {%- set out = [] -%}
            {%- for ln in segment.splitlines() if segment and ln.strip() -%}
                {%- set _ = out.append(ln.lstrip('; ').strip()) -%}
            {%- endfor -%}
            { out|join('\n') }
        {%- else -%}
            { log("<b>get_already_postprocessed</b> file doesnt exist: '" ~ target ~ "'", color='--v-warning-base, orange') }
        {%- endif -%}
    {%- endmacro -%}

    {%- macro mark_postprocessed(target, header_prefix, name) -%}
        {%- if name -%}
            {%- set header_start  = header_prefix ~ '_BLOCK_START' -%}
            {%- set header_end    = header_prefix ~ '_BLOCK_END'   -%}
            {%- set marker        = '; ' ~ name -%}

            {%- set fh            = bi.open(target, 'r+', encoding='utf-8', errors='ignore') -%}
            {%- set content       = fh.read() -%}

            {%- if marker not in content -%}
                {%- if header_start in content and header_end in content -%}
                    {%- set new_content = content.replace(header_end,  marker ~ '\n' ~ header_end, 1) -%}
                {%- else -%}
                    {%- set new_content = '\n' ~ header_start ~ '\n' ~ marker ~ '\n' ~ header_end ~ '\n\n' ~ content -%}
                    { log("mark_postprocessed: created new marker header") }
                {%- endif -%}

                {%- set _ = fh.seek(0) -%}
                {%- set _ = fh.write(new_content) -%}
                {%- set _ = fh.truncate() -%}
            {%- endif -%}

            {%- set _ = fh.close() -%}
        {%- endif -%}
    {%- endmacro -%}

    { main() }
