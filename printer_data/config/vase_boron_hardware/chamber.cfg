[heater_chamber_fan chamber]
sensor_type: Generic 3950
sensor_pin: PF4
pullup_resistor: 4700
min_temp: -20
max_temp: 120

control: pid
pid_Kp: 10
pid_Ki: 1
pid_Kd: 1

fan_pin: PD12
max_power: 1.00
min_power: 0.20
cycle_time: 0.01
hardware_pwm: True

linger_time: 900
linger_power: 0.2
auto_linger: true









